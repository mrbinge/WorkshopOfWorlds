<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Kelly+Slab&family=Marck+Script&family=Pattaya&family=Bad+Script&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#14151b;--bg-alt:#1a1c24;--card:#1f222c;--card-hover:#262a36;--border:#33384a;--border-soft:#2a2e3a;--text:#e9e4d8;--text-dim:#9a9fb0;--text-faint:#5f6478;--thread:#c1443b;--gold:#c9a24c;--teal:#5fa8a0;--rose:#b5698f;--violet:#8c7ec9;--gray:#7a7f92;--radius:3px}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--border) var(--bg-alt)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg-alt)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid var(--bg-alt);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}::-webkit-scrollbar-corner{background:var(--bg-alt)}::-webkit-scrollbar-button{display:none;width:0;height:0}
input[type=checkbox],input[type=radio]{accent-color:var(--gold)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
h1,h3{font-family:'Spectral',serif;font-weight:600;margin:0}
button,input,select{font-family:inherit;color:var(--text);background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:13px;outline:none}
button{cursor:pointer}button:hover{background:var(--card-hover)}
button:disabled{opacity:.35;cursor:default}
#hist{margin-left:10px;display:flex;gap:6px}#hist button{font-size:17px;padding:4px 12px}#hist button svg{display:block}
body.fs-edit header{position:fixed;top:10px;right:10px;z-index:30;padding:4px 6px;gap:6px;border:1px solid var(--border);border-radius:var(--radius);background:rgba(26,28,36,.94)}
body.fs-edit header>:not(#hist){display:none}body.fs-edit #hist{margin-left:0}body.nopanel #side{display:none}
button.on{border-color:var(--gold);color:var(--gold)}
input:focus,select:focus{border-color:var(--thread)}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--bg-alt);border-bottom:1px solid var(--border)}
#backBtn{white-space:nowrap}
.fb{padding:0 6px;font-size:12px;line-height:20px;border:none;background:none;color:var(--text-dim)}.fb:hover{color:var(--text);background:none}
.tl.sub{border-style:dashed;border-color:var(--gold)}.tl .kc{font:10px 'IBM Plex Mono',monospace;color:var(--text-faint)}
a.lk{color:var(--gold);cursor:pointer;text-decoration:underline}
.ep-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.ep-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:pointer;font-size:13px}
.ep-row:hover{background:var(--card-hover)}.ep-row.on{border-color:var(--gold)}
.ep-row .i{font:10px 'IBM Plex Mono',monospace;color:var(--text-faint);width:14px;text-align:center}
.ep-row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-row .y{font:11px 'IBM Plex Mono',monospace;color:var(--text-faint);white-space:nowrap}
.ep-acts{display:flex;gap:4px;margin:2px 0 6px}.ep-acts button{flex:1;padding:5px 4px;font-size:12px}
.ec select{max-width:240px;padding:5px 8px;font-size:13px}.ec button:disabled,.ec select:disabled{opacity:.4;cursor:default}
#epBadge{position:absolute;left:12px;top:10px;z-index:5;pointer-events:none;font-size:12px;color:var(--gold);background:rgba(20,21,27,.85);padding:5px 10px;border-radius:var(--radius);border:1px solid var(--border)}
#epBadge i{font-style:normal;color:var(--text-faint);margin-left:8px;font-family:'IBM Plex Mono',monospace;font-size:11px}
body[data-mode=view] #epBadge{display:none}header h1{font-size:19px}header .mark{color:var(--gold);margin-right:9px;display:inline-flex;vertical-align:middle;position:relative;top:-1px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin:14px 0 6px}
#wrap{flex:1;display:flex;min-height:0}
#side{width:290px;flex-shrink:0;background:var(--bg-alt);border-right:1px solid var(--border);padding:4px 16px 16px;overflow:auto}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}
label.lay{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
#stage{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle,var(--border-soft) 1px,transparent 1px) 0 0/22px 22px,var(--bg-alt)}
#svg{width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--text-dim);background:rgba(20,21,27,.85);padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border)}
.tl{padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:4px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--card)}
.tl.sel{border-color:var(--gold)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;font-size:12px;color:var(--text-dim)}
input[type=range]{padding:0;accent-color:var(--gold)}
.swb{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px}
.swb .dot{width:20px;height:20px;border-radius:2px;border:1px solid var(--border);flex-shrink:0}
.swb .hv{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim)}
.pk{position:fixed;z-index:50;width:238px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pk .sv{position:relative;height:132px;border-radius:2px;cursor:crosshair;touch-action:none}
.pk .sv i{position:absolute;width:13px;height:13px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6);transform:translate(-50%,-50%);pointer-events:none}
.pk .pr{display:flex;align-items:center;gap:8px;margin:10px 0}
.pk .cur{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);flex-shrink:0}
.pk .eye{padding:5px 6px;line-height:0}
.pk .hue{flex:1;-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;border:0;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.pk .hue::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--gold);cursor:pointer}
.pk .hue::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--gold)}
.pk .nums{display:grid;grid-template-columns:1fr 1fr 1fr 1.9fr;gap:6px}
.pk .nums label{display:flex;flex-direction:column;align-items:center;gap:3px;font:10px 'IBM Plex Mono',monospace;color:var(--text-faint)}
.pk .nums input{width:100%;padding:6px 2px;text-align:center;font-size:12px}
.danger{color:var(--thread)}
[hidden]{display:none!important}
body.loading #wrap{visibility:hidden}
.map-mode-seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-left:auto}
.map-mode-seg button{border:none;border-radius:0;background:transparent;padding:6px 14px;color:var(--text-dim);border-right:1px solid var(--border)}
.map-mode-seg button:last-child{border-right:none}.map-mode-seg button.on{background:var(--card-hover);color:var(--gold)}
#col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
body[data-mode=view] #side,body[data-mode=view] #hist,body[data-mode=view] #hint{display:none}
body[data-mode=view] #col{overflow:auto;padding:20px 28px 40px}
body[data-mode=view] #stage{flex:none;height:auto;aspect-ratio:var(--ar,1.6);max-height:80vh;min-height:300px;border:1px solid var(--border);border-radius:var(--radius)}
body.fs #col{position:fixed;inset:0;z-index:40;background:var(--bg);padding:12px 18px;overflow:hidden}
body.fs #stage{flex:1;height:auto;aspect-ratio:auto;max-height:none}
body.fs #vlist{display:none}
.canvas-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.canvas-toolbar h3{margin:0;font-size:17px}
.zc{display:flex;gap:4px;align-items:center}.zc button{padding:5px 10px}
.mono{font-family:'IBM Plex Mono',monospace}
.map-icon-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;padding:0;background:transparent;color:var(--text-dim)}
.map-icon-btn.on{color:var(--gold);border-color:var(--gold)}
.map-icon-btn:hover,.map-layers-btn:hover,.map-layers-btn.open{background:rgba(255,255,255,.05);color:var(--text)}
.map-layers-wrap{position:relative}
.map-layers-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;background:transparent;color:var(--text-dim)}
.map-layers-panel{position:absolute;top:calc(100% + 6px);right:0;width:230px;z-index:60;background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 28px rgba(0,0,0,.45);padding:8px}
.layer-row{display:flex;align-items:center;justify-content:space-between;padding:5px 6px;font-size:12.5px;cursor:pointer;border-radius:6px}
.layer-row:hover{background:rgba(255,255,255,.05)}.layer-row.off{color:var(--text-faint)}.layer-row.off svg{opacity:.35}
.layer-sub-list{margin-left:16px;padding-left:8px;border-left:1px solid var(--border);margin-bottom:2px}
.layer-div{height:1px;background:var(--border);margin:6px 2px}
.layer-acts{display:flex;gap:6px;padding:4px 6px 2px}.layer-acts button{flex:1;font-size:11.5px;padding:4px 0;background:transparent;color:var(--text-dim)}
#info{position:absolute;right:12px;top:12px;width:280px;max-height:calc(100% - 24px);overflow:auto;background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius);padding:16px;z-index:15}
#info h3{font-size:16px;margin:0 28px 4px 0}
.map-list-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:22px 0 16px}
.map-list-tab{padding:9px 16px;font-size:13px;cursor:pointer;color:var(--text-dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.map-list-tab:hover{color:var(--text)}.map-list-tab.on{color:var(--text);border-bottom-color:var(--gold)}
.map-list-tab .cnt{margin-left:6px;font-size:11px;color:var(--text-faint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dossier{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.dossier h3{font-size:15px;margin:0;display:flex;align-items:center;gap:9px}
.d-role{font:11px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:5px 0 6px}
.d-desc{color:var(--text-dim);font-size:13px;margin-top:6px;line-height:1.45}
.d-actions{margin-top:10px;display:flex;gap:6px}.d-actions button{font-size:12px;padding:5px 9px;background:transparent}
.empty-tab{padding:50px 20px;text-align:center;color:var(--text-faint);font-size:13.5px}
.pdot{width:14px;height:14px;border-radius:50%;display:inline-block;flex-shrink:0}
#offer{position:absolute;z-index:20;width:250px;background:var(--card);border:1px solid var(--gold);border-radius:var(--radius);padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13px}
#pathBar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:19;display:flex;gap:6px;background:var(--card);border:1px solid var(--gold);border-radius:var(--radius);padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}#pathBar button{font-size:12px;padding:6px 10px}
#walk{position:absolute;z-index:19;max-width:270px;background:var(--card);border:1px solid var(--gold);border-radius:var(--radius);padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:12px}
#walk .wt{font:10px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin:0 0 6px}
#walk .wr{display:flex;gap:4px;margin-bottom:4px}#walk .wr button{font-size:12px;padding:6px 8px;text-align:left}#walk .wr button:first-child{flex:1}
#walk kbd{font:10px 'IBM Plex Mono',monospace;color:var(--text-faint);margin-left:6px}
#walk .wx{margin-top:4px;text-align:right}#walk .wx a{font-size:11px;color:var(--text-faint);cursor:pointer;text-decoration:underline}#walk .wx a:hover{color:var(--text)}
#offer p{margin:0 0 8px;line-height:1.4}#offer .row{gap:6px}#offer button{font-size:12px;padding:6px 8px}
.mi{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#14151b;border:1.5px solid rgba(20,21,27,.8);flex-shrink:0}
.mi svg{width:12px;height:12px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
select{width:100%}

.fchips{display:flex;gap:4px;align-items:center;margin-left:6px}
.fchips button{font:10px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;color:var(--text-faint);background:transparent;border:1px solid var(--border)}
.fchips button:hover{color:var(--text)}.fchips button.on{color:var(--gold);border-color:var(--gold);background:rgba(201,162,76,.1)}
.fchips .fh{padding:4px 7px}.fchips .fh svg{display:block}
body[data-mode=view] .fchips{display:none}body.fs-edit header>#fchips{display:flex}
#pkRow{display:flex;gap:4px;margin:-4px 0 10px}#pkRow button{flex:1;padding:5px 4px;font-size:12px}
/* фокус: то, что не относится к выбранному инструменту, приглушено и не кликается */
#vp .gT,#vp .pg,#vp [data-m],#vp [data-l]{transition:opacity .15s}
body[data-focus=borders] #vp .pg,body[data-focus=borders] #vp [data-m],body[data-focus=borders] #vp [data-l],
body[data-focus=markers] #vp .gT,body[data-focus=markers] #vp .pg,body[data-focus=markers] #vp [data-l],
body[data-focus=labels] #vp .gT,body[data-focus=labels] #vp .pg,body[data-focus=labels] #vp [data-m],
body[data-focus=paths] #vp .gT,body[data-focus=paths] #vp [data-m],body[data-focus=paths] #vp [data-l]{pointer-events:none!important;opacity:.28}
body[data-fh="1"][data-focus=borders] #vp .pg,body[data-fh="1"][data-focus=borders] #vp [data-m],body[data-fh="1"][data-focus=borders] #vp [data-l],
body[data-fh="1"][data-focus=markers] #vp .gT,body[data-fh="1"][data-focus=markers] #vp .pg,body[data-fh="1"][data-focus=markers] #vp [data-l],
body[data-fh="1"][data-focus=labels] #vp .gT,body[data-fh="1"][data-focus=labels] #vp .pg,body[data-fh="1"][data-focus=labels] #vp [data-m],
body[data-fh="1"][data-focus=paths] #vp .gT,body[data-fh="1"][data-focus=paths] #vp [data-m],body[data-fh="1"][data-focus=paths] #vp [data-l]{display:none}
body[data-focus=markers] #walkLbl,body[data-focus=labels] #walkLbl,body[data-focus=paths] #walkLbl,
body[data-focus=markers] #smooth,body[data-focus=labels] #smooth,body[data-focus=paths] #smooth,body[data-focus=markers] #shared,body[data-focus=labels] #shared,body[data-focus=paths] #shared,
body[data-focus=markers] .eyebrow:has(+#smooth),body[data-focus=labels] .eyebrow:has(+#smooth),body[data-focus=paths] .eyebrow:has(+#smooth),
body[data-focus=markers] .eyebrow:has(+#shared),body[data-focus=labels] .eyebrow:has(+#shared),body[data-focus=paths] .eyebrow:has(+#shared){display:none}
</style>
</head>
<body data-mode="edit">
<header><button id="backBtn" type="button" title="Сохранить и вернуться в Мастерскую" hidden>← В мастерскую</button><h1><span class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="26" height="26" fill="none" stroke="currentColor" style="display:block" stroke-width="3.6" stroke-linecap="round"><circle cx="32" cy="32" r="26"/><ellipse cx="32" cy="32" rx="12" ry="26"/><path d="M32 6v52M6 32h52M10.1 18h43.8M10.1 46h43.8"/></svg></span>Стол картографа</h1><div class="fchips" id="fchips"><button data-f="borders" title="Только границы: правка областей">Границы</button><button data-f="markers" title="Только значки">Значки</button><button data-f="labels" title="Только подписи">Подписи</button><button data-f="paths" title="Только пути: герои, торговые пути, реки">Пути</button><button class="fh" id="fHide" hidden></button></div><span id="bstat" class="eyebrow" style="margin:0 0 0 14px" hidden></span><div class="map-mode-seg" id="modeSeg"><button data-md="view">Просмотр</button><button data-md="edit" class="on">Редактирование</button></div><div id="hist"><button id="pnl" title="Показать/скрыть панель" hidden></button><button id="efs" title="Во весь экран"></button><button id="undo" title="Отменить (Ctrl+Z)">↶</button><button id="redo" title="Вернуть (Ctrl+Y)">↷</button></div></header>
<div id="wrap">
<aside id="side">
  <input type="file" id="tiFile" accept="image/*" hidden>
  <div class="eyebrow">Эпохи</div>
  <div id="epBox"></div>
  <div class="eyebrow">Инструмент</div>
  <div class="row" id="tools">
    <button data-t="move" class="on">Двигать</button><button data-t="draw">Рисовать</button>
    <button data-t="add">Точка +</button><button data-t="del">Точка −</button>
    <button data-t="marker">Значок</button><button data-t="label">Подпись</button><button data-t="path">Путь</button>
  </div>
  <div class="row" id="pkRow" hidden><button data-kind="hero" title="Путь героя">Герои</button><button data-kind="trade" title="Торговый путь">Торговые</button><button data-kind="river" title="Течение реки: пунктиры бегут по течению">Реки</button></div>
  <label class="lay" id="walkLbl" title="После клика по точке готовой границы показывать, куда можно идти вдоль неё"><input type="checkbox" id="walkOn" checked>Подсказывать путь вдоль границы</label>
  <div class="eyebrow">Сглаживание границ</div>
  <input type="range" id="smooth" min="0" max="1.5" step="0.05" value="0.6" style="width:100%">
  <div class="eyebrow" title="Толщина границы между областями одной страны (провинции и т. п.). Граница между разными странами и внешний контур остаются обычной толщины. 100% — без утончения">Границы внутри страны</div>
  <input type="range" id="shared" min="0.15" max="1" step="0.05" value="0.4" style="width:100%">
  <div class="eyebrow">Слои</div>
  <div id="layers"></div>
  <div class="eyebrow">Новая область рисуется в слое</div>
  <select id="actLayer" style="width:100%"></select>
  <div class="eyebrow">Выбранная область</div>
  <div id="props"><span style="font-size:12px;color:var(--text-faint)">Ничего не выбрано</span></div>
  <div class="eyebrow">Все области</div>
  <div id="list"></div>
  
</aside>
<div id="col"><div id="vtop" hidden></div>
<main id="stage">
  <svg id="svg">
    <defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c1443b" stroke-width="3" opacity=".7"/></pattern></defs>
    <g id="vp"></g>
  </svg>

  <div class="ep-acts"><button id="epUp" title="Сдвинуть раньше">↑</button><button id="epDown" title="Сдвинуть позже">↓</button><button id="epDel" class="danger">Удалить</button></div>
  <div class="row"><button id="epCopy" title="Новая эпоха со всем, что есть на карте сейчас">+ Копия этой</button><button id="epNew" title="Новая эпоха с чистой картой">+ Пустая</button></div>`;
  epBadge()}
$('epBox').addEventListener('click',e=>{e.stopPropagation();const r=e.target.closest('[data-ep]'),id=e.target.id;
  if(r)return epSwitch(r.dataset.ep);if(id==='epCopy')return epAdd(1);if(id==='epNew')return epAdd(0);
  if(id==='epUp')return epMove(-1);if(id==='epDown')return epMove(1);if(id==='epDel')return epDel()});
$('epBox').addEventListener('input',e=>{e.stopPropagation();const c=epCur(),i=e.target;if(!c)return;
  if(i.id==='epName')c.name=i.value;else if(i.id==='epYears')c.years=i.value;else return;
  const r=$('epBox').querySelector(`[data-ep="${c.id}"]`);if(r){r.querySelector('.n').textContent=c.name;r.querySelector('.y').textContent=c.years||''}epBadge()});
function epCtl(){const i=EP.list.findIndex(e=>e.id===EP.cur),one=EP.list.length<2;
  return`<div class="zc ec" title="Эпоха карты"><button data-epstep="-1" ${i<=0?'disabled':''} title="Предыдущая эпоха">‹</button><select id="vesel" ${one?'disabled':''}>${EP.list.map(e=>`<option value="${e.id}" ${e.id===EP.cur?'selected':''}>${esc(e.name)}${e.years?' · '+esc(e.years):''}</option>`).join('')}</select><button data-epstep="1" ${i>=EP.list.length-1?'disabled':''} title="Следующая эпоха">›</button></div>`}
function epStep(d){const i=EP.list.findIndex(e=>e.id===EP.cur)+d;if(i>=0&&i<EP.list.length)epSwitch(EP.list[i].id)}
function loadMap(m,mode){const im=new Image(),go=()=>{
    S.img=m.image||null;S.name=m.name||'Карта';
    if(m.image){S.w=im.naturalWidth;S.h=im.naturalHeight}else{S.w=1600;S.h=Math.round(1600/(m.aspect||1.6))}
    const g=m.geo||{},ly=m.layers||{},tv=ly.terr||{};
    S.imgs=g.imgs||{};
    EP.list=(m.epochs&&m.epochs.length?m.epochs:[{id:'ep1',name:'Основная эпоха',years:'',markers:m.markers,labels:m.labels,paths:m.paths,geo:{nodes:g.nodes,terrs:g.terrs}}]).map(e=>({id:e.id,name:e.name||'Эпоха',years:e.years||'',d:{markers:e.markers||[],labels:e.labels||[],paths:e.paths||[],geo:{nodes:(e.geo||{}).nodes||{},terrs:(e.geo||{}).terrs||[]}}}));
    EP.cur=EP.list.some(e=>e.id===m.epoch)?m.epoch:EP.list[0].id;uid=1;
    applyEpoch(epCur().d);
    S.imgs=g.imgs||{};
    S.vis={pol:tv.pol===false?0:1,nat:tv.nat===false?0:1,dis:tv.dis===false?0:1,markers:ly.markers===false?0:1,labels:ly.labels===false?0:1,paths:ly.paths===false?0:1};
    S.shared=ly.shared===undefined?.4:Math.max(.15,Math.min(1,+ly.shared||.4));$('shared').value=S.shared;
    S.pk=Object.assign({hero:1,trade:1,river:1},Object.fromEntries(Object.entries(ly.pathKinds||{}).map(([a,b])=>[a,b===false?0:1])));
    S.lt=Object.assign({country:1,river:1,lake:1,ocean:1,land:1},Object.fromEntries(Object.entries(ly.labelTypes||{}).map(([a,b])=>[a,b===false?0:1])));
    let mx=0;[...Object.keys(S.nodes),...S.terrs.map(t=>t.id),...Object.keys(S.imgs),...S.markers.map(o=>o.id),...S.labels.map(o=>o.id),...S.paths.map(o=>o.id)].forEach(id=>{const r=/^[a-z](\d+)$/.exec(id);if(r)mx=Math.max(mx,+r[1])});
    uid=mx+1;H=[];F=[];sel=null;selI=null;selN=null;editId=null;draft=[];pd=[];off=null;
    document.title=S.name+' — Стол картографа';
    epPanel();document.body.classList.remove('loading');bridge.ready=true;bridge.savedSig=sigOf();setStatus('Связь с Мастерской установлена');
    mode==='view'?setMode('view'):setMode('edit');fit();render();if(mode==='view')buildView()};
  if(m.image){im.onload=go;im.onerror=go;im.src=m.image}else go()}
function sendSave(){if(!host||host.closed){setStatus('Мастерская закрыта — изменения не сохранены. Открой стол заново из Мастерской.',true);return}
  bridge.pending=sigOf();host.postMessage({type:'stol:save',patch:toPct()},refOrigin);setStatus('Сохраняю…');
  clearTimeout(ackT);ackT=setTimeout(()=>setStatus('Нет ответа от Мастерской — изменения могут быть не сохранены',true),5000)}
if(qs.get('mode')){
  bridge={ready:false,mode:qs.get('mode')==='edit'?'edit':'view'};
  if(host){
    document.body.classList.add('loading');setStatus('Загрузка карты из Мастерской…');
    addEventListener('message',e=>{if(e.source!==host||!e.data)return;
      if(e.data.type==='stol:init'&&e.data.map)loadMap(e.data.map,bridge.mode);
      if(e.data.type==='stol:saved'){clearTimeout(ackT);bridge.savedSig=bridge.pending;setStatus('Сохранено в Мастерской')}});
    host.postMessage({type:'stol:ready'},refOrigin);
    setInterval(()=>{if(!bridge.ready)return;const sg=sigOf();if(sg===(bridge.pending||bridge.savedSig))return;clearTimeout(saveT);saveT=setTimeout(sendSave,500);bridge.pending=sg},700);
    addEventListener('beforeunload',e=>{if(bridge.ready&&sigOf()!==bridge.savedSig){e.preventDefault();e.returnValue=''}});
  }else setStatus('Открой карту из Мастерской миров — отсюда данных нет',true);
}
$('efs').innerHTML=ico(IC.fs);
$('pnl').innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>';
$('efs').onclick=()=>setEditFs(!document.body.classList.contains('fs-edit'));
$('pnl').onclick=()=>{document.body.classList.toggle('nopanel');requestAnimationFrame(()=>{fit();render(1)})};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('fs-edit'))setEditFs(false)});
/* ===== возврат в Мастерскую: сначала дожидаемся сохранения ===== */
function leave(){
  if(embedded){host.postMessage({type:'stol:close'},refOrigin)}
  else{try{window.opener&&!window.opener.closed&&window.opener.focus()}catch(_){}window.close()}}
$('backBtn').hidden=!host;
$('backBtn').onclick=()=>{
  const b=$('backBtn');b.disabled=true;if(pd.length>=2){commitPath();render()}
  if(bridge&&bridge.ready&&sigOf()!==bridge.savedSig){
    clearTimeout(saveT);sendSave();const t0=Date.now();
    const w=setInterval(()=>{if(sigOf()===bridge.savedSig||Date.now()-t0>3000){clearInterval(w);leave()}},80)}
  else leave()};
fit();render();addEventListener('resize',()=>{fit();render()});
</script>
</body>
