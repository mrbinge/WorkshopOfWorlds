let walk=null,walkHi=0,walkLast=null,walkOn=(()=>{try{return localStorage.getItem('stol.walk')!=='0'}catch(_){return true}})();
let mapEdit=false,selPic=null;
let V={x:20,y:20,k:.6},tool='move',draft=[],sel=null,selN=null,editId=null,drag=null,uid=1,selI=null,pd=[],off=null;
let H=[],F=[],lastK='',lastT=0;
let spaceDown=false,styleClip=null,toastT=0,lastIcon=(()=>{try{return localStorage.getItem('stol.icon')||'landmark'}catch(_){return'landmark'}})();
const snap=()=>JSON.stringify({nodes:S.nodes,terrs:S.terrs,draft,markers:S.markers,labels:S.labels,paths:S.paths,pics:S.pics,base:S.base});
function push(k){const tt=document.getElementById('toast');if(tt)tt.hidden=true;const t=Date.now();if(k&&k===lastK&&t-lastT<700){lastT=t;return}lastK=k||'';lastT=t;H.push(snap());if(H.length>100)H.shift();F=[]}
function restore(x){const tt=document.getElementById('toast');if(tt)tt.hidden=true;const o=JSON.parse(x);S.nodes=o.nodes;S.terrs=o.terrs;draft=o.draft;S.markers=o.markers||[];S.labels=o.labels||[];S.paths=o.paths||[];if(o.pics)S.pics=o.pics;if(o.base)S.base=o.base;if(selI&&!item())selI=null;if(sel&&!S.terrs.find(t=>t.id===sel))sel=null;if(editId&&!S.terrs.find(t=>t.id===editId))editId=null;if(selN&&!S.nodes[selN])selN=null;render()}

const $=id=>document.getElementById(id),svg=$('svg'),vp=$('vp');
const HINTS={view:'Клик по области — выбрать · двойной клик или «Редактировать точки» — показать точки · колесо или +/− — масштаб · 0 — вписать · F — к выбранному · пробел+мышь, стрелки или правая кнопка — сдвиг карты',move:'Редактирование: тяни точки · стрелки — сдвиг точки (Shift — крупнее) · правая кнопка по точке — дублировать или удалить · Del — удалить · двойной клик по точке — острый угол · Esc или «Готово» — скрыть точки',
free:'Рисуй от руки: зажми кнопку мыши и веди линию — при отпускании она превратится в точки. Можно рисовать несколько штрихов подряд. Линия, закончившаяся у первой точки, замыкает область (или Enter). Esc — отмена',
draw:'Ставь точки; поставленную точку можно перетащить. Курсор цепляется к точкам и линиям готовых границ (Alt — отключить магнит). Дошёл до точки границы — редактор покажет, куда можно идти вдоль неё: пробел или клик по подсказке. Либо кликни другую точку границы — предложит пройти по ней сам. Клик по первой точке или Enter — замкнуть, Esc — отмена',
add:'Выбери область и нажми «Редактировать точки», затем клик по её границе — добавить точку (обновится у обоих соседей)',del:'Клик по точке — удалить её из всех областей'};
const pt=e=>{const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left-V.x)/V.k,y:(e.clientY-r.top-V.y)/V.k}};
const nid=()=>'n'+(uid++);
function nb(){const m={};S.terrs.forEach(t=>t.ring.forEach((a,i)=>{const b=t.ring[(i+1)%t.ring.length];(m[a]=m[a]||new Set).add(b);(m[b]=m[b]||new Set).add(a)}));return m}
function bez(a,b,m){ // кривая a→b, зависит только от общего графа → общая граница одинакова у соседей
  const A=S.nodes[a],B=S.nodes[b],s=S.smooth;
  const tan=(n,from,to,arrive)=>{const q=S.nodes[n];if(q.sharp||!m[n]||m[n].size!==2)return{x:0,y:0};
    const o=[...m[n]].find(z=>z!==(arrive?from:to)),O=S.nodes[o];
    return arrive?{x:(O.x-S.nodes[from].x)/2,y:(O.y-S.nodes[from].y)/2}:{x:(S.nodes[to].x-O.x)/2,y:(S.nodes[to].y-O.y)/2}};
  const ta=tan(a,a,b,false),tb=tan(b,a,b,true);
  return`C${A.x+ta.x*s/3} ${A.y+ta.y*s/3} ${B.x-tb.x*s/3} ${B.y-tb.y*s/3} ${B.x} ${B.y}`}
function ringD(r,m){let d=`M${S.nodes[r[0]].x} ${S.nodes[r[0]].y}`;r.forEach((a,i)=>d+=bez(a,r[(i+1)%r.length],m));return d+'Z'}
/* ===== иерархия областей: страна → провинции → острова (граница родителя не делится) ===== */
const tById=id=>S.terrs.find(t=>t.id===id);
function fixParents(){const ids=new Set(S.terrs.map(t=>t.id));
  S.terrs.forEach(t=>{if(t.parent&&(!ids.has(t.parent)||t.parent===t.id))delete t.parent});
  S.terrs.forEach(t=>{let u=t,g=0;while(u&&u.parent&&g++<60){u=tById(u.parent);if(u===t){delete t.parent;break}}})}
function terrInfo(){const byId={},depth={},hidden=new Set(),kids={},anc={},root={};S.terrs.forEach(t=>byId[t.id]=t);
  S.terrs.forEach(t=>{if(t.parent&&byId[t.parent])(kids[t.parent]=kids[t.parent]||[]).push(t.id)});
  S.terrs.forEach(t=>{let d=0,u=t,g=0,fold=false;const A=new Set();while(u.parent&&byId[u.parent]&&g++<60){u=byId[u.parent];d++;A.add(u.id);if(u.fold)fold=true}anc[t.id]=A;root[t.id]=u.id;depth[t.id]=d;if(fold)hidden.add(t.id)});
  return{depth,hidden,kids,anc,root}}
function descIds(id,I){I=I||terrInfo();const r=new Set(),st=[id];while(st.length){const u=st.pop();(I.kids[u]||[]).forEach(c=>{if(!r.has(c)){r.add(c);st.push(c)}})}return r}
const LU={order:['pol','nat','dis'],gf:new Set()};
const LC=new Set(); // свёрнутые в левом списке страны (только список, на карту не влияет)
function treeOrder(){const I=terrInfo(),out=[],seen=new Set(),add=t=>{if(seen.has(t.id))return;seen.add(t.id);out.push(t);(I.kids[t.id]||[]).forEach(id=>{const c=tById(id);if(c)add(c)})};
  S.terrs.filter(t=>!(t.parent&&tById(t.parent))).forEach(add);S.terrs.forEach(add);return{rows:out,I}}
/* при включении области в состав страны она берёт основной цвет страны (потом цвет можно поменять как угодно) */
function adoptColor(c,p){if(c&&p&&p.color)c.color=p.color}
function attachToggle(id){const P=tById(attachTo),C=tById(id);if(!P||!C||id===attachTo)return;
  if(descIds(id).has(attachTo)){setStatus('Нельзя: «'+P.name+'» уже входит в состав «'+C.name+'»',true);setTimeout(()=>setStatus(''),2800);return}
  push();if(C.parent===attachTo)delete C.parent;else{C.parent=attachTo;adoptColor(C,P)}render()}
function hierProps(t){const TO=treeOrder(),I=TO.I,ds=descIds(t.id,I),opts=TO.rows.filter(x=>x.id!==t.id&&!ds.has(x.id)),
    kd=(I.kids[t.id]||[]).map(tById).filter(Boolean),par=t.parent&&tById(t.parent);

  <div class="fld">Состав${kd.length?` (${kd.length})`:''}</div>
  ${kd.map(c=>`<div class="tl" data-s="${c.id}"><span class="sw" style="background:${c.color}"></span>${esc(c.name)}<button class="fb" data-ud="${c.id}" title="Убрать из состава" style="margin-left:auto">✕</button></div>`).join('')||'<div style="font-size:12px;color:var(--text-faint);margin-bottom:6px;line-height:1.4">Пока никого: сюда можно включить провинции, острова и другие части</div>'}

$('backBtn').hidden=!host;
$('backBtn').onclick=()=>{
  const b=$('backBtn');b.disabled=true;if(pd.length>=2){commitPath();render()}
  if(bridge&&bridge.ready&&sigOf()!==bridge.savedSig){
    clearTimeout(saveT);sendSave();const t0=Date.now();
    const w=setInterval(()=>{if(sigOf()===bridge.savedSig||Date.now()-t0>3000){clearInterval(w);leave()}},80)}
  else leave()};

/* ===== экспорт карты: PNG и SVG (кнопка в «Изменить карту») ===== */
const XP={fmt:'png',sz:2,bg:'dark'},XW=1200;let xMsg='',xBad=false,xBusy=false;
const xDims=()=>{const w=Math.round(XW*XP.sz),h=Math.round(w*S.h/S.w);return{w,h}};
function xPanel(){const sl=(id,v,o)=>`<select id="${id}">${o.map(([k,n])=>`<option value="${k}" ${String(v)===String(k)?'selected':''}>${n}</option>`).join('')}</select>`;
  return`<div class="eyebrow">Экспорт карты</div>`+
  `<div class="fld">Формат${sl('xFmt',XP.fmt,[['png','PNG — картинка'],['svg','SVG — вектор, без потери качества']])}</div>`+
  (XP.fmt==='png'?`<div class="fld">Размер${sl('xSz',XP.sz,[1,2,3,4].map(z=>[z,'×'+z+' — '+XW*z+' × '+Math.round(XW*z*S.h/S.w)+' px']))}</div>`:'')+
  `<div class="fld">Фон${sl('xBg',XP.bg,[['dark','Тёмный, как в редакторе'],['none','Прозрачный']])}</div>`+
  `<button id="xGo" style="width:100%" ${xBusy?'disabled':''}>${xBusy?'Готовлю файл…':'Сохранить файл'}</button>`+
  `<div style="font-size:11.5px;color:var(--text-faint);margin-top:6px;line-height:1.4">В файл попадает то, что сейчас включено в слоях: области, значки, подписи, пути и картинки карты. Сетка и точки правки не попадают.</div>`+
  (xMsg?`<div style="font-size:12px;color:${xBad?'var(--thread)':'var(--text-dim)'};margin-top:6px;line-height:1.4">${esc(xMsg)}</div>`:'')}
const FONTC={};
const inRange=(cp,r)=>r.split(',').some(u=>{u=u.trim().replace(/^U\+/i,'');if(!u)return false;
  if(u.includes('?')){return cp>=parseInt(u.replace(/\?/g,'0'),16)&&cp<=parseInt(u.replace(/\?/g,'F'),16)}
  const[a,b]=u.split('-'),lo=parseInt(a,16),hi=b?parseInt(b,16):lo;return cp>=lo&&cp<=hi});
async function faceCss(fam,wt,chars){const key=fam+'|'+wt;
  if(!FONTC[key]){const r=await fetch('https://fonts.googleapis.com/css2?family='+encodeURIComponent(fam).replace(/%20/g,'+')+':wght@'+wt+'&display=swap');if(!r.ok)throw new Error('css');FONTC[key]={css:await r.text(),data:{}}}
  const F=FONTC[key],out=[];
  for(const m of F.css.matchAll(/@font-face\s*\{([^}]*)\}/g)){const b=m[1],ur=(/unicode-range:\s*([^;]+)/.exec(b)||[])[1],u=/url\(([^)]+)\)/.exec(b);if(!u)continue;
    if(ur&&![...chars].some(ch=>inRange(ch.codePointAt(0),ur)))continue;
    const url=u[1].replace(/['"]/g,'');
    if(!F.data[url]){const rb=await fetch(url);if(!rb.ok)throw new Error('font');const bl=await rb.blob();
      F.data[url]=await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).replace(/^data:[^,]*,/,'data:font/woff2;base64,'));fr.readAsDataURL(bl)})}
    out.push("@font-face{font-family:'"+fam+"';font-style:normal;font-weight:"+wt+";src:url("+F.data[url]+") format('woff2');"+(ur?'unicode-range:'+ur+';':'')+"}")}
  return out.join('')}
function fontNeeds(){const need={},add=(fam,wt,txt)=>{const k=fam+'|'+wt,o=need[k]=need[k]||{fam,wt,ch:new Set()};for(const ch of String(txt||''))o.ch.add(ch)};
  if(S.vis.labels)S.labels.forEach(lb=>{if(S.lt[lb.type||'country']===0)return;const fd=MAP_LABEL_FONTS[lb.font]||MAP_LABEL_FONTS.caveat;add(fd.family,400,lb.text)});
  if(S.vis.markers)S.markers.forEach(mk=>add('Inter',600,mk.name));
  return Object.values(need)}
async function fontCss(){let css='',bad=false;for(const n of fontNeeds()){try{css+=await faceCss(n.fam,n.wt,n.ch)}catch(_){bad=true}}return{css,bad}}
function buildExportSvg(w,h,css){
  const bk=[sel,selI,selN,editId],k=XW/S.w,NS='http://www.w3.org/2000/svg';let body='';
  sel=selI=selN=editId=null;
  try{const m=nb(),TI=terrInfo(),vis=S.terrs.filter(t=>S.vis[t.layer]&&!TI.hidden.has(t.id)).sort((a,b)=>TI.depth[a.id]-TI.depth[b.id]),EO={};
    vis.forEach(t=>t.ring.forEach((a,i)=>{const b=t.ring[(i+1)%t.ring.length],key=a<b?a+'|'+b:b+'|'+a;(EO[key]=EO[key]||[]).push(t.id)}));
    body=(S.img?picSvg(S.base,S.img):'')+picsSvg(0)+'<g>';
    vis.forEach(t=>{const d=ringD(t.ring,m),ti=terrImg(t);body+=`<path d="${d}" fill="${t.color}" fill-opacity="${t.alpha}"/>${ti.fill}<clipPath id="c${t.id}"><path d="${d}"/></clipPath>${bord(t,d,m,EO,TI,k)}${ti.emb}`;
      if(t.layer==='dis')body+=`<path d="${d}" fill="url(#hatch)"/>`});
    body+='</g>'+picsSvg(1)+extra(k)}
  finally{[sel,selI,selN,editId]=bk}
  const root=document.createElementNS(NS,'svg');
  root.innerHTML=svg.querySelector('defs').outerHTML+(XP.bg==='dark'?`<rect width="${S.w}" height="${S.h}" fill="#1a1c24"/>`:'')+body;
  root.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if((a.name.startsWith('data-')&&a.name!=='data-per')||a.name==='pointer-events')el.removeAttribute(a.name)});
    const st=el.getAttribute('style');if(st&&/cursor/.test(st)){const n=st.replace(/cursor:[^;]*;?/g,'').trim();n?el.setAttribute('style',n):el.removeAttribute('style')}});
  root.querySelectorAll('[stroke="transparent"],rect[fill="transparent"],title').forEach(el=>el.remove());
  const cs=getComputedStyle(document.documentElement),vars=['gold','teal','rose','violet','gray','thread','text'].map(n=>'--'+n+':'+cs.getPropertyValue('--'+n).trim()).join(';');
  const st=document.createElementNS(NS,'style');st.textContent=':root{'+vars+'}'+css;root.insertBefore(st,root.firstChild);
  root.setAttribute('xmlns',NS);root.setAttribute('viewBox','0 0 '+S.w+' '+S.h);root.setAttribute('width',w);root.setAttribute('height',h);
  return new XMLSerializer().serializeToString(root)}
function xSave(blob,ext){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(String(S.name||'karta').replace(/[\\/:*?"<>|]+/g,'_').trim()||'karta')+'.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function xGo(){if(xBusy)return;const png=XP.fmt==='png',d=png?xDims():{w:S.w,h:S.h};
  if(png&&(d.w>16000||d.h>16000||d.w*d.h>150e6)){xMsg='Слишком большой размер для PNG — выбери меньший или формат SVG';xBad=true;return mapPanelUpd()}
  xBusy=true;xBad=false;xMsg='';mapPanelUpd();
  try{const f=await fontCss(),str=buildExportSvg(d.w,d.h,f.css);
    if(png){const url=URL.createObjectURL(new Blob([str],{type:'image/svg+xml;charset=utf-8'}));
      try{const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=()=>no(new Error('img'));im.src=url});await new Promise(r=>setTimeout(r,200));
        const c=document.createElement('canvas');c.width=d.w;c.height=d.h;c.getContext('2d').drawImage(im,0,0,d.w,d.h);
        const bl=await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/png'));xSave(bl,'png')}
      finally{URL.revokeObjectURL(url)}}
    else xSave(new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+str],{type:'image/svg+xml'}),'svg');
    xMsg=f.bad?'Файл сохранён, но шрифты подписей встроить не удалось (нет доступа к Google Fonts) — подписи могут выглядеть другим шрифтом.':'Файл сохранён.';xBad=f.bad}
  catch(err){xMsg='Не получилось сохранить: '+(err&&err.message||err);xBad=true}
  xBusy=false;mapPanelUpd()}
$('mapPanel').addEventListener('click',e=>{if(e.target.closest('#xGo'))xGo()});
$('mapPanel').addEventListener('change',e=>{const i=e.target;
  if(i.id==='xFmt'){XP.fmt=i.value;xMsg='';mapPanelUpd()}else if(i.id==='xSz'){XP.sz=+i.value;mapPanelUpd()}else if(i.id==='xBg'){XP.bg=i.value;mapPanelUpd()}});
$('ezm').onclick=()=>zoomBy(1/1.25);$('ezp').onclick=()=>zoomBy(1.25);$('ezf').onclick=()=>{fit();render(1)};$('efsT').innerHTML=ico(IC.fs);$('efsT').onclick=()=>$('efs').click();
fit();render();addEventListener('resize',()=>{fit();render()});
</script>
