<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор иконок меток</title>
<style>
  :root{
    --bg:#14151b; --bg-alt:#1a1c24; --panel:#1e2029; --border-soft:#2a2e3a; --border-strong:#3a3f4f;
    --text:#e9e4d8; --text-faint:#8a8f9e; --text-dim:#5f6478;
    --gold:#c9a24c; --teal:#5fa8a0; --rose:#b5698f; --violet:#8c7ec9; --gray:#7a7f92; --thread:#c1443b;
    --accent:#c9a24c;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; font-size:13px; height:100vh; overflow:hidden; }
  button{ font-family:inherit; cursor:pointer; }
  .btn{ background:var(--panel); border:1px solid var(--border-soft); color:var(--text); border-radius:6px; padding:6px 11px; font-size:12.5px; transition:background .12s, border-color .12s; }
  .btn:hover{ background:var(--border-soft); }
  .btn.primary{ background:var(--gold); border-color:var(--gold); color:#14151b; font-weight:600; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.sm{ padding:4px 8px; font-size:11.5px; }
  .btn.danger{ color:var(--thread); }
  input[type=text], input[type=number]{
    background:var(--bg-alt); border:1px solid var(--border-soft); color:var(--text); border-radius:5px;
    padding:5px 7px; font-size:12.5px; font-family:inherit; width:100%;
  }
  input[type=color]{ width:32px; height:26px; border:1px solid var(--border-soft); border-radius:5px; background:none; padding:1px; cursor:pointer; }
  select{ background:var(--bg-alt); border:1px solid var(--border-soft); color:var(--text); border-radius:5px; padding:5px 6px; font-size:12.5px; font-family:inherit; }
  label.field{ display:block; margin-bottom:9px; }
  label.field .lbl{ display:block; font-size:11px; color:var(--text-faint); margin-bottom:3px; }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; min-width:0; }

  #app{ display:flex; height:100vh; }

  #sidebar{ width:250px; min-width:125px; max-width:340px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border-soft); display:flex; flex-direction:column; position:relative; }
  #sidebarResizeHandle{
    position:absolute; top:0; right:-3px; width:6px; height:100%; cursor:col-resize; z-index:5;
    background:transparent;
  }
  #sidebarResizeHandle:hover, #sidebarResizeHandle.dragging{ background:rgba(201,162,76,.35); }
  #sidebarHeader{ padding:12px 12px 8px; border-bottom:1px solid var(--border-soft); }
  #sidebarHeader h1{ font-size:14px; margin:0 0 8px; font-weight:700; }
  #searchInput{ margin-bottom:8px; }
  #catTabs{ display:flex; flex-wrap:wrap; gap:4px; }
  #catTabs button{ font-size:10.5px; padding:3px 7px; }
  #catTabs button.active{ background:var(--gold); border-color:var(--gold); color:#14151b; }
  #iconList{ flex:1; overflow-y:auto; padding:8px; display:grid; grid-template-columns:repeat(auto-fill, minmax(48px, 1fr)); gap:6px; align-content:start; }
  .icon-thumb{
    position:relative; aspect-ratio:1; border-radius:8px; border:1px solid var(--border-soft); background:var(--bg-alt);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color .12s, background .12s;
  }
  .icon-thumb:hover{ border-color:var(--text-dim); }
  .icon-thumb.active{ border-color:var(--gold); background:rgba(201,162,76,.12); }
  .icon-thumb svg{ width:60%; height:60%; }
  .icon-thumb .dot{ position:absolute; top:3px; right:3px; width:6px; height:6px; border-radius:50%; background:var(--gold); display:none; }
  .icon-thumb.dirty .dot{ display:block; }
  .icon-thumb .moved-dot{ position:absolute; top:3px; left:3px; width:6px; height:6px; border-radius:50%; background:var(--accent, #d9a441); display:none; }
  .icon-thumb.moved .moved-dot{ display:block; }

  #center{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #topbar{ display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:8px 16px; padding:10px 16px; border-bottom:1px solid var(--border-soft); background:var(--panel); }
  #topbarLeft{ display:flex; flex-direction:column; gap:8px; min-width:0; flex:1 1 0; }
  .topbar-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; min-width:0; }
  #iconKeyLabel{ font-size:15px; font-weight:700; white-space:nowrap; }
  #iconMetaLabel{ font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #iconCategorySelect{ margin-left:10px; font-size:12px; padding:4px 6px; max-width:150px; }
  #iconMetaLabel .moved{ color:var(--accent, #d9a441); }
  #topbarRight{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; margin-left:auto; flex:0 0 auto; width:250px; }
  #topbarBtnStack{ display:flex; gap:6px; }
  #saveStatus{ order:2; font-size:11px; line-height:1.35; color:var(--text-faint); text-align:right; }
  #saveStatus.warn{ color:var(--accent); }

  #canvasWrap{ flex:1; display:flex; overflow:auto; background:
    repeating-conic-gradient(#191a21 0% 25%, #16171d 0% 50%) 50% / 18px 18px; }
  #svgCanvas{ background:var(--bg-alt); border:1px solid var(--border-strong); border-radius:4px; box-shadow:0 6px 24px rgba(0,0,0,.4); cursor:crosshair; touch-action:none; flex-shrink:0; margin:auto; }
  #realPreviewSizes{ display:flex; justify-content:space-between; gap:8px; }
  #realPreviewPanel{
    position:sticky; bottom:0; background:var(--panel); border-top:1px solid var(--border-soft);
    box-shadow:0 -8px 16px rgba(0,0,0,.35); z-index:5;
  }
  .rp-size-row{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; min-width:0; }
  .rp-badge{ border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.45); flex-shrink:0; }
  .rp-badge svg{ display:block; }
  .rp-size-label{ font-size:9px; color:var(--text-dim); font-family:'IBM Plex Mono', monospace; white-space:nowrap; text-align:center; }
  #svgCanvas .safe-zone{ fill:none; stroke:var(--border-strong); stroke-width:0.25; stroke-dasharray:1 1; pointer-events:none; }
  #svgCanvas .elem-outline{ fill:none; stroke:#4da3ff; stroke-width:0.4; stroke-dasharray:1.5 1; pointer-events:none; }
  #svgCanvas .handle-line{ stroke:#ff9f4d; stroke-width:0.25; pointer-events:none; }
  #svgCanvas .anchor-pt{ fill:#14151b; stroke:#4da3ff; stroke-width:0.5; cursor:grab; opacity:0.6; transition:opacity .1s; }
  #svgCanvas .anchor-pt:hover{ opacity:1; }
  #svgCanvas .anchor-pt.selected{ fill:#4da3ff; opacity:0.9; }
  #svgCanvas .handle-pt{ fill:#ff9f4d; stroke:#14151b; stroke-width:0.3; cursor:grab; opacity:0.65; transition:opacity .1s; }
  #svgCanvas .handle-pt:hover{ opacity:1; }
  #svgCanvas .resize-handle{ fill:#14151b; stroke:#4da3ff; stroke-width:0.5; cursor:nwse-resize; opacity:0.65; transition:opacity .1s; }
  #svgCanvas .resize-handle:hover{ opacity:1; }
  #svgCanvas .rotate-handle{ fill:#14151b; stroke:#7ee787; stroke-width:0.5; cursor:grab; opacity:0.7; transition:opacity .1s; }
  #svgCanvas .rotate-handle:hover{ opacity:1; }
  #svgCanvas .rotate-handle:active{ cursor:grabbing; }
  #svgCanvas .rotate-stick{ stroke:#7ee787; stroke-width:0.25; opacity:0.6; pointer-events:none; }
  #svgCanvas .move-hit{ cursor:move; }

  /* copy/paste toast */
  #editorToast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel, #1c1d24); border:1px solid var(--border-strong); color:var(--text, #e9e4d8);
    padding:10px 18px; border-radius:8px; font-size:13px; box-shadow:0 10px 28px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; z-index:600;
  }
  #editorToast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* right-click context menu */
  #ctxMenu{
    position:fixed; z-index:500; min-width:200px; background:var(--panel, #1c1d24); border:1px solid var(--border-strong);
    border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.55); padding:5px; font-size:12.5px; user-select:none;
  }
  #ctxMenu .ctx-item{
    display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:5px; cursor:pointer; white-space:nowrap;
    color:var(--text, #e9e4d8);
  }
  #ctxMenu .ctx-item:hover{ background:rgba(255,255,255,.08); }
  #ctxMenu .ctx-item.danger:hover{ background:rgba(255,90,90,.15); color:#ff8a8a; }
  #ctxMenu .ctx-item[disabled]{ opacity:.35; cursor:default; pointer-events:none; }
  #ctxMenu .ctx-sep{ height:1px; background:var(--border-strong); margin:4px 2px; }
  #ctxMenu .ctx-check{ width:14px; text-align:center; flex-shrink:0; }
  .ctx-fill-swatch{ width:12px; height:12px; border-radius:3px; flex-shrink:0; border:1px solid rgba(255,255,255,.25); }
  .ctx-fill-swatch-main{ background:#e9e4d8; }
  .ctx-fill-swatch-accent{ background:#8a8f9e; }
  #ctxMenu .ctx-sub-wrap{ position:relative; }
  #ctxMenu .ctx-sub-wrap > .ctx-item::after{ content:'▸'; margin-left:auto; padding-left:10px; color:var(--text-faint); }
  #ctxSubMenu{
    position:fixed; z-index:501; min-width:190px; max-height:280px; overflow-y:auto; background:var(--panel, #1c1d24);
    border:1px solid var(--border-strong); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.55); padding:5px;
  }
  #ctxSubMenu .ctx-shape-item{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:5px; cursor:pointer; font-size:12.5px; color:var(--text, #e9e4d8);
  }
  #ctxSubMenu .ctx-shape-item:hover{ background:rgba(255,255,255,.08); }
  #ctxSubMenu .ctx-shape-item svg{ width:16px; height:16px; flex-shrink:0; }
  #ctxMenuOverlay{ position:fixed; inset:0; z-index:499; }
  #svgCanvas .snap-guide{ stroke-width:0.18; stroke-dasharray:0.9 0.7; pointer-events:none; }
  #svgCanvas .snap-guide-canvas{ stroke:#ff4da6; }
  #svgCanvas .snap-guide-object{ stroke:#4da3ff; }
  #svgCanvas .snap-guide-radial{ stroke:#7fe08a; stroke-dasharray:0.5 0.5; }
  #svgCanvas .snap-guide-center-dot{ fill:#7fe08a; stroke:none; pointer-events:none; }

  #canvasFooter{ display:flex; align-items:center; justify-content:center; gap:10px; padding:8px 16px; border-top:1px solid var(--border-soft); background:var(--panel); font-size:11.5px; color:var(--text-faint); position:relative; }
  #zoomControls{ position:absolute; right:16px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:6px; }
  #zoomControls .btn.sm{ width:24px; height:24px; padding:0; display:flex; align-items:center; justify-content:center; }
  #zoomLabel{ min-width:38px; text-align:center; font-variant-numeric:tabular-nums; }

  #rightPanel{ width:280px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--border-soft); display:flex; flex-direction:column; overflow-y:auto; }
  .panel-section{ padding:12px; border-bottom:1px solid var(--border-soft); }
  .panel-section h2{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin:0 0 9px; font-weight:600; }
  .panel-section h2.collapsible-header{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; margin-bottom:8px; }
  .panel-section h2.collapsible-header:hover{ color:var(--text); }
  .panel-section h2.collapsible-header .collapse-chevron{ font-size:10px; color:var(--text-dim); flex-shrink:0; }
  #elementList{ display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
  .elem-row{
    display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:6px; border:1px solid transparent;
    background:var(--bg-alt); cursor:pointer; font-size:12px; position:relative;
  }
  .elem-row:hover{ border-color:var(--border-strong); }
  .elem-row.active{ border-color:var(--gold); background:rgba(201,162,76,.1); }
  .elem-row.link-selected{ border-color:#4da3ff; background:rgba(77,163,255,.12); }
  .elem-row.dragging{ opacity:.4; }
  .elem-row.drag-over-top::before, .elem-row.drag-over-bottom::after{
    content:''; position:absolute; left:6px; right:6px; height:2px; background:var(--gold); border-radius:2px;
  }
  .elem-row.drag-over-top::before{ top:-2px; }
  .elem-row.drag-over-bottom::after{ bottom:-2px; }
  .elem-row .drag-handle{ color:var(--text-dim); cursor:grab; flex-shrink:0; font-size:12px; line-height:1; padding:0 1px; }
  .elem-row .drag-handle:active{ cursor:grabbing; }
  .elem-row .row-thumb{
    width:22px; height:22px; border-radius:5px; flex-shrink:0; border:1px solid rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:
      linear-gradient(45deg, rgba(255,255,255,.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.06) 75%) 0 0/8px 8px,
      linear-gradient(45deg, rgba(255,255,255,.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.06) 75%) 4px 4px/8px 8px,
      #14151b;
    color:#e9e4d8;
  }
  .elem-row .row-thumb-svg{ display:block; --marker-color:#8a8f9e; }
  .elem-row .kind{ flex:1; color:var(--text-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .elem-row .link-badge{ color:#4da3ff; font-size:11px; flex-shrink:0; }
  .elem-row .del{ color:var(--text-dim); background:none; border:none; padding:2px 4px; font-size:13px; }
  .elem-row .del:hover{ color:var(--thread); }
  #linkToolbar{ display:flex; align-items:center; gap:6px; margin:2px 0 8px; padding:6px 8px; border:1px dashed #4da3ff; border-radius:6px; background:rgba(77,163,255,.08); font-size:11px; color:var(--text-faint); flex-wrap:wrap; }
  #linkToolbar .btn{ font-size:11px; padding:4px 8px; }
  .link-hint{ font-size:10.5px; color:var(--text-dim); margin:-4px 0 8px; }
  #addShapeRow{ display:flex; gap:5px; flex-wrap:wrap; }
  #addShapeRow button{ flex:1; min-width:56px; }
  .shape-add-wrap{ position:relative; }
  .shape-picker-overlay{ position:fixed; inset:0; z-index:59; background:transparent; }
  .shape-picker-popover{
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:60;
    background:var(--bg-alt); border:1px solid var(--border-strong); border-radius:8px;
    box-shadow:0 10px 28px rgba(0,0,0,.5); padding:8px; display:grid;
    grid-template-columns:repeat(3,1fr); gap:6px; max-height:340px; overflow-y:auto;
  }
  .shape-opt{
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px;
    background:var(--panel); border:1px solid var(--border-soft); border-radius:6px; color:var(--text-faint);
    font-size:9.5px; text-align:center; line-height:1.2; transition:border-color .12s, background .12s, color .12s;
  }
  .shape-opt:hover{ border-color:var(--gold); color:var(--text); background:rgba(201,162,76,.08); }
  .shape-opt svg{ width:22px; height:22px; stroke:currentColor; }

  #emptyState{ padding:30px 16px; text-align:center; color:var(--text-faint); font-size:12.5px; line-height:1.6; }
  #pathModeHint{ font-size:11px; color:var(--text-faint); padding:0 12px 10px; line-height:1.5; }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="sidebarResizeHandle" title="Потяните, чтобы изменить ширину"></div>
    <div id="sidebarHeader">
      <h1>Иконки меток</h1>
      <div style="display:flex; gap:6px;">
        <input type="text" id="searchInput" placeholder="Поиск по названию..." style="flex:1; min-width:0;">
        <button class="btn sm" id="addIconBtn" title="Добавить новую иконку">+ Новая</button>
      </div>
      <div id="catTabs"></div>
    </div>
    <div id="iconList"></div>
  </div>

  <div id="center">
    <div id="topbar">
      <div id="topbarLeft">
        <div class="topbar-row">
          <button class="btn sm" id="prevBtn" title="Предыдущая">←</button>
          <button class="btn sm" id="nextBtn" title="Следующая">→</button>
          <div>
            <div id="iconKeyLabel">—</div>
            <div id="iconMetaLabel"></div>
          </div>
          <select id="iconCategorySelect" title="Переместить в другую категорию"></select>
          <button class="btn sm" id="renameIconBtn" title="Переименовать эту иконку (название и/или ключ)">Переименовать</button>
          <button class="btn sm danger" id="deleteIconBtn" title="Удалить эту иконку насовсем">Удалить</button>
        </div>
        <div class="topbar-row">
          <button class="btn sm" id="undoBtn" title="Отменить (Ctrl+Z)">↶</button>
          <button class="btn sm" id="redoBtn" title="Повторить (Ctrl+Shift+Z)">↷</button>
          <span style="width:1px; height:20px; background:var(--border-soft); margin:0 2px;"></span>
          <select id="alignMenu" title="Сначала выделите 2+ фигуры (Ctrl/Cmd+клик в списке слоёв слева), затем выберите действие">
            <option value="" selected>— Распределение —</option>
            <optgroup label="Выровнять">
              <option value="align-left">По левому краю</option>
              <option value="align-hcenter">По центру (гориз.)</option>
              <option value="align-right">По правому краю</option>
              <option value="align-top">По верхнему краю</option>
              <option value="align-vcenter">По центру (верт.)</option>
              <option value="align-bottom">По нижнему краю</option>
            </optgroup>
            <optgroup label="Распределить">
              <option value="dist-h">Равномерно по горизонтали</option>
              <option value="dist-v">Равномерно по вертикали</option>
            </optgroup>
          </select>
        </div>
      </div>
      <div id="topbarRight">
        <span id="saveStatus"></span>
        <div id="topbarBtnStack">
          <button class="btn" id="loadFromFileBtn" title="Открыть другой marker-icons.js (обычно не нужен: редактор сам берёт файл из своей папки)">Открыть…</button>
          <button class="btn primary" id="saveBtn" title="Собрать marker-icons.js (Ctrl+S)">Сохранить</button>
        </div>
      </div>
    </div>

    <div id="canvasWrap">
      <svg id="svgCanvas" width="560" height="560" viewBox="-2 -2 28 28"></svg>
    </div>

    <div id="canvasFooter">
      <span>Клик по фигуре — выбрать. Точки и рычаги — тянуть мышью.</span>
      <div id="zoomControls">
        <button class="btn sm" id="zoomOutBtn" title="Уменьшить (Ctrl −)">−</button>
        <span id="zoomLabel">100%</span>
        <button class="btn sm" id="zoomInBtn" title="Увеличить (Ctrl +)">+</button>
        <button class="btn sm" id="zoomResetBtn" title="Сбросить масштаб (Ctrl 0)">1:1</button>
      </div>
    </div>
  </div>

  <div id="rightPanel"></div>
</div>

<script id="path-engine-src">
// ============================================================
// path_engine.js — parse an SVG <path d="..."> string into an editable
// "anchors with bezier handles" model, and serialize back to a 'd' string.
//
// Internal model per subpath: array of anchors:
//   { x, y, inX, inY, outX, outY }   (in/out are null when the segment on
//   that side is a straight line, not a curve)
// A path is: { subpaths: [ {anchors:[...], closed:bool}, ... ] }
//
// Supports: M/m L/l H/h V/v C/c S/s Q/q T/t A/a Z/z
// Q/T are converted to equivalent cubic C on parse (exact conversion).
// A (arc) is approximated with cubic beziers (standard arc-to-bezier).
// ============================================================

function parsePathD(d){
  const tokens = tokenizePath(d);
  let i = 0;
  let cx = 0, cy = 0;           // current point
  let startX = 0, startY = 0;   // subpath start (for Z)
  let prevCmd = '';
  let prevCtrl = null;          // reflection control point for S/T
  const subpaths = [];
  let cur = null; // current subpath being built: {anchors:[], closed:false}

  function pushAnchor(x, y, inX, inY, outXOfPrev, outYOfPrev){
    if(outXOfPrev != null && cur.anchors.length){
      const last = cur.anchors[cur.anchors.length-1];
      last.outX = outXOfPrev; last.outY = outYOfPrev;
    }
    cur.anchors.push({ x, y, inX: inX==null?null:inX, inY: inY==null?null:inY, outX:null, outY:null });
  }

  while(i < tokens.length){
    const cmd = tokens[i++];
    const abs = cmd === cmd.toUpperCase();
    const C = cmd.toUpperCase();
    // SVG allows omitting a repeated command letter for consecutive segments
    // of the same command — e.g. "L10,10 20,20 30,30" is three L segments.
    // `more()` reports whether the next token is a bare number (i.e. an
    // implicit repeat) rather than a new command letter, so every branch
    // below loops for as long as that holds.
    const more = () => i < tokens.length && isNum(tokens[i]);
    if(C === 'M'){
      moveTo();
    } else if(C === 'L'){
      do{ lineTo(); } while(more());
    } else if(C === 'H'){
      do{ horizTo(); } while(more());
    } else if(C === 'V'){
      do{ vertTo(); } while(more());
    } else if(C === 'C'){
      do{ curveTo(); } while(more());
    } else if(C === 'S'){
      do{ smoothCurveTo(); } while(more());
    } else if(C === 'Q'){
      do{ quadTo(); } while(more());
    } else if(C === 'T'){
      do{ smoothQuadTo(); } while(more());
    } else if(C === 'A'){
      do{ arcTo(); } while(more());
    } else if(C === 'Z'){
      cur.closed = true;
      cx = startX; cy = startY;
      subpaths.push(cur);
      cur = { anchors: [], closed:false };
      prevCmd = 'Z'; prevCtrl = null;
    } else {
      // unknown command — skip one token defensively (shouldn't happen for
      // this icon set, but avoids an infinite loop on unexpected input)
    }

    function moveTo(){
      const x = num(tokens[i++]), y = num(tokens[i++]);
      cx = abs ? x : cx + x; cy = abs ? y : cy + y;
      if(cur && cur.anchors.length) subpaths.push(cur);
      cur = { anchors: [], closed:false };
      cur.anchors.push({ x:cx, y:cy, inX:null, inY:null, outX:null, outY:null });
      startX = cx; startY = cy;
      prevCtrl = null; prevCmd = 'M';
      // Subsequent implicit coordinate pairs after M are treated as L.
      while(more()){
        const lx = num(tokens[i++]), ly = num(tokens[i++]);
        cx = abs ? lx : cx + lx; cy = abs ? ly : cy + ly;
        pushAnchor(cx, cy, null, null, null, null);
        prevCmd = 'L'; prevCtrl = null;
      }
    }
    function lineTo(){
      const x = num(tokens[i++]), y = num(tokens[i++]);
      cx = abs ? x : cx + x; cy = abs ? y : cy + y;
      pushAnchor(cx, cy, null, null, null, null);
      prevCmd = 'L'; prevCtrl = null;
    }
    function horizTo(){
      const x = num(tokens[i++]);
      cx = abs ? x : cx + x;
      pushAnchor(cx, cy, null, null, null, null);
      prevCmd = 'H'; prevCtrl = null;
    }
    function vertTo(){
      const y = num(tokens[i++]);
      cy = abs ? y : cy + y;
      pushAnchor(cx, cy, null, null, null, null);
      prevCmd = 'V'; prevCtrl = null;
    }
    function curveTo(){
      const x1=num(tokens[i++]), y1=num(tokens[i++]);
      const x2=num(tokens[i++]), y2=num(tokens[i++]);
      const x=num(tokens[i++]), y=num(tokens[i++]);
      const c1x = abs?x1:cx+x1, c1y = abs?y1:cy+y1;
      const c2x = abs?x2:cx+x2, c2y = abs?y2:cy+y2;
      const nx = abs?x:cx+x, ny = abs?y:cy+y;
      pushAnchor(nx, ny, c2x, c2y, c1x, c1y);
      prevCtrl = {x:c2x, y:c2y};
      cx = nx; cy = ny; prevCmd = 'C';
    }
    function smoothCurveTo(){
      const x2=num(tokens[i++]), y2=num(tokens[i++]);
      const x=num(tokens[i++]), y=num(tokens[i++]);
      const c2x = abs?x2:cx+x2, c2y = abs?y2:cy+y2;
      const nx = abs?x:cx+x, ny = abs?y:cy+y;
      let c1x, c1y;
      if(prevCtrl && (prevCmd==='C'||prevCmd==='S')){ c1x = 2*cx-prevCtrl.x; c1y = 2*cy-prevCtrl.y; }
      else { c1x = cx; c1y = cy; }
      pushAnchor(nx, ny, c2x, c2y, c1x, c1y);
      prevCtrl = {x:c2x, y:c2y};
      cx = nx; cy = ny; prevCmd = 'S';
    }
    function quadTo(){
      const x1=num(tokens[i++]), y1=num(tokens[i++]);
      const x=num(tokens[i++]), y=num(tokens[i++]);
      const qx = abs?x1:cx+x1, qy = abs?y1:cy+y1;
      const nx = abs?x:cx+x, ny = abs?y:cy+y;
      const c1x = cx + 2/3*(qx-cx), c1y = cy + 2/3*(qy-cy);
      const c2x = nx + 2/3*(qx-nx), c2y = ny + 2/3*(qy-ny);
      pushAnchor(nx, ny, c2x, c2y, c1x, c1y);
      prevCtrl = {x:qx, y:qy};
      cx = nx; cy = ny; prevCmd = 'Q';
    }
    function smoothQuadTo(){
      const x=num(tokens[i++]), y=num(tokens[i++]);
      const nx = abs?x:cx+x, ny = abs?y:cy+y;
      let qx, qy;
      if(prevCtrl && (prevCmd==='Q'||prevCmd==='T')){ qx = 2*cx-prevCtrl.x; qy = 2*cy-prevCtrl.y; }
      else { qx = cx; qy = cy; }
      const c1x = cx + 2/3*(qx-cx), c1y = cy + 2/3*(qy-cy);
      const c2x = nx + 2/3*(qx-nx), c2y = ny + 2/3*(qy-ny);
      pushAnchor(nx, ny, c2x, c2y, c1x, c1y);
      prevCtrl = {x:qx, y:qy};
      cx = nx; cy = ny; prevCmd = 'T';
    }
    function arcTo(){
      const rx=num(tokens[i++]), ry=num(tokens[i++]);
      const rot=num(tokens[i++]);
      const laf=num(tokens[i++]), sf=num(tokens[i++]);
      const x=num(tokens[i++]), y=num(tokens[i++]);
      const nx = abs?x:cx+x, ny = abs?y:cy+y;
      const beziers = arcToBeziers(cx, cy, rx, ry, rot, laf, sf, nx, ny);
      for(const b of beziers){
        pushAnchor(b.x, b.y, b.c2x, b.c2y, b.c1x, b.c1y);
      }
      prevCtrl = null;
      cx = nx; cy = ny; prevCmd = 'A';
    }
  }
  if(cur && cur.anchors.length) subpaths.push(cur);
  return { subpaths };
}

function serializePathD(pathModel, precision){
  const p = precision==null ? 3 : precision;
  const r = v => {
    const n = Math.round(v * Math.pow(10,p)) / Math.pow(10,p);
    return Number.isInteger(n) ? String(n) : String(n);
  };
  const parts = [];
  for(const sp of pathModel.subpaths){
    if(!sp.anchors.length) continue;
    const a0 = sp.anchors[0];
    parts.push(`M${r(a0.x)},${r(a0.y)}`);
    for(let k=1;k<sp.anchors.length;k++){
      const prev = sp.anchors[k-1], a = sp.anchors[k];
      if(prev.outX==null && a.inX==null){
        parts.push(`L${r(a.x)},${r(a.y)}`);
      } else {
        const c1x = prev.outX==null ? prev.x : prev.outX;
        const c1y = prev.outY==null ? prev.y : prev.outY;
        const c2x = a.inX==null ? a.x : a.inX;
        const c2y = a.inY==null ? a.y : a.inY;
        parts.push(`C${r(c1x)},${r(c1y)} ${r(c2x)},${r(c2y)} ${r(a.x)},${r(a.y)}`);
      }
    }
    if(sp.closed){
      // closing segment back to the first anchor, using the last anchor's
      // outHandle and the first anchor's inHandle if present
      const last = sp.anchors[sp.anchors.length-1];
      const first = sp.anchors[0];
      if(last.outX==null && first.inX==null){
        parts.push('Z');
      } else {
        const c1x = last.outX==null ? last.x : last.outX;
        const c1y = last.outY==null ? last.y : last.outY;
        const c2x = first.inX==null ? first.x : first.inX;
        const c2y = first.inY==null ? first.y : first.inY;
        parts.push(`C${r(c1x)},${r(c1y)} ${r(c2x)},${r(c2y)} ${r(first.x)},${r(first.y)}Z`);
      }
    }
  }
  return parts.join(' ');
}

// ---- helpers ----
function tokenizePath(d){
  const cmdRe = /[MLHVCSQTAZmlhvcsqtaz]/;
  const tokens = [];
  let i = 0;
  const n = d.length;
  while(i < n){
    const ch = d[i];
    if(cmdRe.test(ch)){ tokens.push(ch); i++; continue; }
    if(/[\s,]/.test(ch)){ i++; continue; }
    // number: optional sign, digits, optional decimal, optional exponent
    const m = /^[+-]?(\d+\.\d+|\.\d+|\d+\.?)(e[+-]?\d+)?/i.exec(d.slice(i));
    if(m){ tokens.push(m[0]); i += m[0].length; continue; }
    i++; // skip unrecognized char defensively
  }
  return tokens;
}
function num(s){ return parseFloat(s); }
function isNum(s){ return s!=null && /^[+-]?(\d|\.\d)/.test(s); }

// Standard arc-to-cubic-bezier conversion (endpoint parametrization).
function arcToBeziers(x1,y1, rx,ry, angleDeg, largeArcFlag, sweepFlag, x2,y2){
  if(rx===0 || ry===0) return [{x:x2,y:y2,c1x:x1,c1y:y1,c2x:x2,c2y:y2}];
  rx = Math.abs(rx); ry = Math.abs(ry);
  const phi = angleDeg * Math.PI/180;
  const cosPhi = Math.cos(phi), sinPhi = Math.sin(phi);
  const dx2 = (x1-x2)/2, dy2 = (y1-y2)/2;
  const x1p =  cosPhi*dx2 + sinPhi*dy2;
  const y1p = -sinPhi*dx2 + cosPhi*dy2;
  let rxs = rx*rx, rys = ry*ry;
  const x1ps = x1p*x1p, y1ps = y1p*y1p;
  const cr = x1ps/rxs + y1ps/rys;
  if(cr > 1){ const s = Math.sqrt(cr); rx*=s; ry*=s; rxs=rx*rx; rys=ry*ry; }
  const sign = (largeArcFlag !== sweepFlag) ? 1 : -1;
  let sq = ((rxs*rys) - (rxs*y1ps) - (rys*x1ps)) / ((rxs*y1ps) + (rys*x1ps));
  sq = sq < 0 ? 0 : sq;
  const coef = sign * Math.sqrt(sq);
  const cxp = coef * (rx*y1p/ry);
  const cyp = coef * -(ry*x1p/rx);
  const cx = cosPhi*cxp - sinPhi*cyp + (x1+x2)/2;
  const cy = sinPhi*cxp + cosPhi*cyp + (y1+y2)/2;
  const ux = (x1p-cxp)/rx, uy = (y1p-cyp)/ry;
  const vx = (-x1p-cxp)/rx, vy = (-y1p-cyp)/ry;
  const ang = (ux,uy,vx,vy) => {
    const dot = ux*vx+uy*vy;
    const len = Math.sqrt((ux*ux+uy*uy)*(vx*vx+vy*vy));
    let a = Math.acos(Math.max(-1,Math.min(1,dot/len)));
    if(ux*vy - uy*vx < 0) a = -a;
    return a;
  };
  let theta1 = ang(1,0,ux,uy);
  let dTheta = ang(ux,uy,vx,vy);
  if(!sweepFlag && dTheta>0) dTheta -= 2*Math.PI;
  if(sweepFlag && dTheta<0) dTheta += 2*Math.PI;
  const segCount = Math.max(1, Math.ceil(Math.abs(dTheta)/(Math.PI/2)));
  const delta = dTheta/segCount;
  const t = 4/3*Math.tan(delta/4);
  const result = [];
  let angle = theta1;
  for(let s=0; s<segCount; s++){
    const a1 = angle, a2 = angle+delta;
    const p1x = cx + rx*Math.cos(a1)*cosPhi - ry*Math.sin(a1)*sinPhi;
    const p1y = cy + rx*Math.cos(a1)*sinPhi + ry*Math.sin(a1)*cosPhi;
    const p2x = cx + rx*Math.cos(a2)*cosPhi - ry*Math.sin(a2)*sinPhi;
    const p2y = cy + rx*Math.cos(a2)*sinPhi + ry*Math.sin(a2)*cosPhi;
    const c1x = p1x - t*(rx*Math.sin(a1)*cosPhi + ry*Math.cos(a1)*sinPhi);
    const c1y = p1y - t*(rx*Math.sin(a1)*sinPhi - ry*Math.cos(a1)*cosPhi);
    const c2x = p2x + t*(rx*Math.sin(a2)*cosPhi + ry*Math.cos(a2)*sinPhi);
    const c2y = p2y + t*(rx*Math.sin(a2)*sinPhi - ry*Math.cos(a2)*cosPhi);
    result.push({x:p2x, y:p2y, c1x, c1y, c2x, c2y});
    angle = a2;
  }
  return result;
}

<script id="icon-model-src">
// ============================================================
// icon_model.js — converts between the raw SVG markup used in
// marker-icons.js (MARKER_SVG[key]) and an editable "elements" array.
//
// Fill and stroke are tracked INDEPENDENTLY (not as a single "mode"),
// because several existing icons rely on a shape that has both a real
// fill AND an inherited stroke at the same time (they set fill="currentColor"
// but never override stroke, so it inherits stroke:currentColor from the
// outer .map-marker-icon svg default) — collapsing that into one mutually
// exclusive fill-or-stroke mode silently thins those shapes out.
//
//   element = { id, kind:'path'|'rect'|'circle'|'ellipse',
//               fillRole:'none'|'main'|'accent'|'custom', fillCustom,
//               strokeRole:'none'|'main'|'accent'|'custom', strokeCustom,
//               strokeWidth, opacity, transform, ...shape-specific fields }
//   main   -> currentColor        (the icon's own silhouette)
//   accent -> var(--marker-color) (a cutout that matches the marker circle's background)
//   custom -> a literal color (rare, e.g. the volcano's fixed orange)
//
// A missing fill/stroke attribute in the source SVG inherits the outer
// .map-marker-icon svg default (fill:none; stroke:currentColor) — that
// inheritance is resolved once here on parse, so the editable model never
// has to reason about CSS cascade itself.
// ============================================================

let __uidCounter = 1;
function uid(){ return 'el' + (__uidCounter++) + '_' + Math.random().toString(36).slice(2,7); }

function roleToColor(role, custom){
  if(role === 'main') return 'currentColor';
  if(role === 'accent') return 'var(--marker-color)';
  return custom || '#000000';
}
function colorToRole(color){
  if(color === 'none') return { role:'none' };
  if(color === 'currentColor') return { role:'main' };
  if(color === 'var(--marker-color)') return { role:'accent' };
  return { role:'custom', customColor: color };
}
function fmtNum(v){
  if(v == null || isNaN(v)) return '0';
  const n = Math.round(v * 1000) / 1000;
  return String(n);
}

function parseIconSvg(svgString){
  const doc = new DOMParser().parseFromString(svgString, 'image/svg+xml');
  const svgEl = doc.documentElement;
  const viewBox = (svgEl && svgEl.getAttribute && svgEl.getAttribute('viewBox')) || '-2 -2 28 28';
  const elements = [];
  if(!svgEl || svgEl.tagName === 'parsererror'){ return { elements, viewBox }; }
  const children = Array.from(svgEl.children || []);
  for(const child of children){
    const tag = (child.tagName || '').toLowerCase();
    if(!['path','rect','circle','ellipse'].includes(tag)) continue;
    const fillAttr = child.getAttribute('fill');
    const strokeAttr = child.getAttribute('stroke');
    const fillInfo = fillAttr == null ? { role:'none' } : colorToRole(fillAttr);
    const strokeInfo = strokeAttr == null ? { role:'main' } : colorToRole(strokeAttr);
    const strokeWidthAttr = child.getAttribute('stroke-width');
    const opacityAttr = child.getAttribute('opacity');
    const transformAttr = child.getAttribute('transform');
    const dasharrayAttr = child.getAttribute('stroke-dasharray');
    const base = {
      id: uid(), kind: tag,
      fillRole: fillInfo.role, fillCustom: fillInfo.customColor,
      strokeRole: strokeInfo.role, strokeCustom: strokeInfo.customColor,
      strokeWidth: strokeWidthAttr != null ? parseFloat(strokeWidthAttr) : 2,
      opacity: opacityAttr != null ? parseFloat(opacityAttr) : 1,
      transform: transformAttr || '',
      strokeDasharray: dasharrayAttr || '',
    };
    if(tag === 'path'){
      base.pathModel = parsePathD(child.getAttribute('d') || '');
    } else if(tag === 'rect'){
      base.x = parseFloat(child.getAttribute('x')) || 0;
      base.y = parseFloat(child.getAttribute('y')) || 0;
      base.width = parseFloat(child.getAttribute('width')) || 0;
      base.height = parseFloat(child.getAttribute('height')) || 0;
      base.rx = parseFloat(child.getAttribute('rx')) || 0;
    } else if(tag === 'circle'){
      base.cx = parseFloat(child.getAttribute('cx')) || 0;
      base.cy = parseFloat(child.getAttribute('cy')) || 0;
      base.r = parseFloat(child.getAttribute('r')) || 0;
    } else if(tag === 'ellipse'){
      base.cx = parseFloat(child.getAttribute('cx')) || 0;
      base.cy = parseFloat(child.getAttribute('cy')) || 0;
      base.rx = parseFloat(child.getAttribute('rx')) || 0;
      base.ry = parseFloat(child.getAttribute('ry')) || 0;
    }
    elements.push(base);
  }
  return { elements, viewBox };
}

function elementToSvgString(el){
  const fillAttr = el.fillRole === 'none' ? 'none' : roleToColor(el.fillRole, el.fillCustom);
  const strokeAttr = el.strokeRole === 'none' ? 'none' : roleToColor(el.strokeRole, el.strokeCustom);
  const extra = [];
  if(el.strokeRole !== 'none') extra.push(`stroke-width="${fmtNum(el.strokeWidth || 2)}"`);
  if(el.strokeDasharray) extra.push(`stroke-dasharray="${el.strokeDasharray}"`);
  if(el.opacity != null && el.opacity !== 1) extra.push(`opacity="${fmtNum(el.opacity)}"`);
  if(el.transform) extra.push(`transform="${el.transform}"`);
  const extraStr = extra.length ? ' ' + extra.join(' ') : '';
  if(el.kind === 'path'){
    const d = serializePathD(el.pathModel);
    return `<path d="${d}" fill="${fillAttr}" stroke="${strokeAttr}"${extraStr}/>`;
  }
  if(el.kind === 'rect'){
    const rx = el.rx ? ` rx="${fmtNum(el.rx)}"` : '';
    return `<rect x="${fmtNum(el.x)}" y="${fmtNum(el.y)}" width="${fmtNum(el.width)}" height="${fmtNum(el.height)}"${rx} fill="${fillAttr}" stroke="${strokeAttr}"${extraStr}/>`;
  }
  if(el.kind === 'circle'){
    return `<circle cx="${fmtNum(el.cx)}" cy="${fmtNum(el.cy)}" r="${fmtNum(el.r)}" fill="${fillAttr}" stroke="${strokeAttr}"${extraStr}/>`;
  }
  if(el.kind === 'ellipse'){
    return `<ellipse cx="${fmtNum(el.cx)}" cy="${fmtNum(el.cy)}" rx="${fmtNum(el.rx)}" ry="${fmtNum(el.ry)}" fill="${fillAttr}" stroke="${strokeAttr}"${extraStr}/>`;
  }
  return '';
}

function iconToSvgString(iconData){
  return `<svg viewBox="${iconData.viewBox}">${iconData.elements.map(elementToSvgString).join('')}</svg>`;
}

function cloneIconData(iconData){
  return JSON.parse(JSON.stringify(iconData));
}
</script>


<script id="editor-render-src">

// ============================================================
// editor.js — the interactive part of the icon editor.
// ============================================================

/* ---------------- library bootstrap ---------------- */
// `library[key] = { elements, viewBox, dirty, label, category }`
const library = {};
function buildLibrary(){
  for(const [key, label] of MARKER_ICONS){
    const svg = MARKER_SVG[key];
    const parsed = svg ? parseIconSvg(svg) : { elements: [], viewBox: '-2 -2 28 28' };
    library[key] = {
      elements: parsed.elements,
      viewBox: parsed.viewBox,
      dirty: false,
      label,
      category: iconCategoryOf(key),
      color: MARKER_COLORS[key] || MARKER_COLORS.other,
    };
  }
}
buildLibrary();

let ALL_KEYS = MARKER_ICONS.map(([k]) => k);

/* ---------------- state ---------------- */
const state = {
  currentKey: ALL_KEYS[0],
  selectedElId: null,
  selectedAnchor: null,   // { subpathIdx, anchorIdx, part:'anchor'|'in'|'out' }
  activeCat: 'all',
  search: '',
  drawing: null,          // in-progress pen-tool path: { elId, subpathIdx }
  fileHandle: null,
  history: {},            // key -> [snapshot, ...]
  historyIndex: {},       // key -> index into history[key]
  shapePickerOpen: false,
  layersCollapsed: true, // layers list starts collapsed — it can get long and isn't needed open at all times
  linkSelectIds: new Set(), // element ids picked (ctrl/cmd+click) for building/breaking a link group
  snapGuides: { x:null, y:null, radial:null }, // active alignment guide lines shown while dragging
  snapToObjects: true,      // whether dragging snaps to OTHER shapes' edges/mid, on top of canvas snapping
  contextMenu: null,        // { x, y, targetElId } while the right-click menu is open, else null
  layerContextMenu: null,   // { x, y, elId, aboveId, belowId } while the layer-row right-click menu is open
  zoom: 1,                  // canvas zoom level (1 = the base 560px/24-unit fit)
  clipboard: null,          // { elements:[...], sourceKey } — in-memory copy/paste buffer, lives only in this tab/session
};
let BASE_CANVAS_PX = 560; // #svgCanvas's width/height at zoom 1
const ZOOM_MIN = 0.5, ZOOM_MAX = 8;

/* ---------------- snapping (canvas midpoints/edges + other objects) ---------------- */
const CANVAS_SNAP_VALUES = [0, 12, 24];   // far edges of the 24x24 safe zone + its middle
const SNAP_THRESHOLD = 0.35;              // in icon-space units (~7px on screen at current zoom)

// Snap lines are {v, type:'canvas'|'object'} tuples so guides can be colored
// by source. Canvas lines are always present; object lines come from the
// start/middle/end of every OTHER element's bbox on the given axis, so a
// dragged shape can line up with its neighbors, not just the canvas itself.
function axisSnapLines(excludeIds, axis){
  const lines = CANVAS_SNAP_VALUES.map(v=>({ v, type:'canvas', edge:'mid' }));
  if(!state.snapToObjects) return lines;
  currentIcon().elements.forEach(el=>{
    if(excludeIds.includes(el.id)) return;
    const b = elementBounds(el);
    const start = axis==='x' ? b.x : b.y;
    const size = axis==='x' ? b.w : b.h;
    [[start,'start'], [start+size/2,'mid'], [start+size,'end']].forEach(([v,edge])=>lines.push({ v: Math.round(v*100)/100, type:'object', edge }));
  });
  return lines;
}
function findSnap(value, lines){
  let best=null;
  lines.forEach(l=>{
    const d = Math.abs(value - l.v);
    if(d < SNAP_THRESHOLD && (!best || d < best.d)) best = { d, value:l.v, type:l.type };
  });
  return best; // {value, type} or null
}
// For a moving span [start, start+size] (an element or group's bbox edge on one axis),
// finds whichever of its start/middle/end lines up closest with a snap line, and returns
// the delta to shift the whole span by. Used for whole-shape / whole-group dragging.
function findSpanSnap(start, size, lines){
  let best = null;
  [[start,'start'], [start + size/2,'mid'], [start + size,'end']].forEach(([v, spanEdge])=>{
    lines.forEach(l=>{
      const d = Math.abs(v - l.v);
      if(d < SNAP_THRESHOLD && (!best || d < best.d)) best = { d, delta: l.v - v, guide: l.v, type:l.type, spanEdge, lineEdge:l.edge };
    });
  });
  if(best && best.type==='object'){
    // One shape's start touching another's end (or vice versa) is two flat
    // shapes placed edge-to-edge — nudge into a hair of overlap so
    // anti-aliasing doesn't leave a 1px seam between them. Same-edge matches
    // (start-start, mid-mid, end-end) are alignment, not abutment, and stay
    // exact.
    const abutting = (best.spanEdge==='start' && best.lineEdge==='end') || (best.spanEdge==='end' && best.lineEdge==='start');
    if(abutting){
      const overlap = screenPxToIconUnits(1);
      best.delta += best.spanEdge==='start' ? -overlap : overlap;
    }
  }
  return best;
}

/* ---------------- self-snapping (a shape's own center + spokes) ----------------
   Regular-ish polygons (hexagon, pentagon, star, ...) get invisible "threads"
   radiating from their own centroid, one through each vertex's current
   position, plus the four straight/diagonal axes through that same center.
   Dragging a vertex snaps it onto whichever thread it comes close to,
   letting you slide a corner in/out along its own spoke (or across the
   shape's middle) without nudging it off-angle by accident. */
function shapeCentroid(el){
  const anchors = el.pathModel.subpaths.flatMap(sp => sp.anchors);
  if(anchors.length < 3) return null;
  const cx = anchors.reduce((s,a)=>s+a.x,0) / anchors.length;
  const cy = anchors.reduce((s,a)=>s+a.y,0) / anchors.length;
  return { cx, cy };

function selfShapeRadialSnap(el, spIdx, aIdx, cursorPt){
  if(!el || el.kind !== 'path') return null;
  const center = shapeCentroid(el);
  if(!center) return null;
  const { cx, cy } = center;
  const origAnchor = el.pathModel.subpaths[spIdx].anchors[aIdx];
  const origAngle = Math.atan2(origAnchor.y - cy, origAnchor.x - cx);
  // the vertex's own original spoke, plus the four straight/diagonal axes
  // through the shape's center (horizontal, vertical, both diagonals)
  const angles = [origAngle, 0, Math.PI/4, Math.PI/2, 3*Math.PI/4, Math.PI, -Math.PI/4, -Math.PI/2, -3*Math.PI/4];
  const dx = cursorPt.x - cx, dy = cursorPt.y - cy;
  if(Math.hypot(dx, dy) < 0.05) return null;
  let best = null;
  for(const angle of angles){
    const nx = Math.cos(angle), ny = Math.sin(angle);
    const perp = Math.abs(-ny*dx + nx*dy); // perpendicular distance from cursor to this spoke
    if(perp < SNAP_THRESHOLD && (!best || perp < best.perp)){
      const proj = dx*nx + dy*ny; // signed distance along the spoke — keeps whatever radius the cursor implies
      best = { perp, x: cx + nx*proj, y: cy + ny*proj, cx, cy };
    }
  }
  return best;
}

    if(Object.keys(categoryData).length) localStorage.setItem('icon-editor-categories', JSON.stringify(categoryData));

  try{

      const dirtyData = JSON.parse(raw);
      for(const k in dirtyData){
        if(!library[k]) continue;
        library[k].elements = dirtyData[k].elements;
        library[k].viewBox = dirtyData[k].viewBox;
        library[k].dirty = true;

    }
  }catch(e){ /* ignore corrupt/missing local data */ }
  try{
    const rawCat = localStorage.getItem('icon-editor-categories');
    if(rawCat){
      const categoryData = JSON.parse(rawCat);
      for(const k in categoryData){ if(library[k]) library[k].category = categoryData[k]; }

}

// Builds a chain of anchors tracing a circular arc from startAngle to
// endAngle (radians), with correctly-shaped cubic-bezier handles between
// consecutive anchors — split into <=maxSegAngle chunks so each bezier stays
// a close approximation of the true circle. There's no dedicated "arc"
// primitive in this editor, only anchors + handles, so shapes like the
// crescent are built by chaining several of these arcs together.
function arcAnchorChain(cx, cy, r, startAngle, endAngle, maxSegAngle){
  maxSegAngle = maxSegAngle || Math.PI/2;
  const sweep = endAngle - startAngle;
  const segCount = Math.max(1, Math.ceil(Math.abs(sweep) / maxSegAngle));
  const delta = sweep / segCount;
  const kappa = (4/3) * Math.tan(delta/4);
  const anchors = [];
  for(let i=0; i<=segCount; i++){
    const angle = startAngle + i*delta;
    const x = cx + r*Math.cos(angle), y = cy + r*Math.sin(angle);
    const tx = -r*Math.sin(angle), ty = r*Math.cos(angle); // tangent vector, magnitude r
    const a = { x, y, inX:null, inY:null, outX:null, outY:null };
    if(i > 0){ a.inX = x - tx*kappa; a.inY = y - ty*kappa; }
    if(i < segCount){ a.outX = x + tx*kappa; a.outY = y + ty*kappa; }
    anchors.push(a);
  }
  return anchors;
}

// rect/circle/ellipse can be folded into the same combined path as a
// neighboring shape (a single <path> element can hold several subpaths). ----
function closedArcAnchors(cx, cy, r, maxSegAngle){
  const chain = arcAnchorChain(cx, cy, r, 0, 2*Math.PI, maxSegAngle || Math.PI/2);
  const first = chain[0], last = chain[chain.length-1];

// the outer circle's far arc plus the inner (shifted) circle's near arc,
// meeting at the same two points top and bottom so the outline is one
// single closed, self-consistent path.
function newCrescent(){
  const cx=12, cy=12, R=8;      // outer circle
  const shift=4.4, r2=8;        // inner circle: shifted right, same radius
  const icx = cx + shift;
  // circle-circle intersection (both same radius R=r2, centers on the same
  // horizontal line) — the two points where the crescent's horns meet.
  const a = (shift*shift) / (2*shift);           // = shift/2 since R===r2
  const h = Math.sqrt(Math.max(0, R*R - a*a));
  const ix = cx + a;
  const pTop = { x: ix, y: cy - h };
  const pBot = { x: ix, y: cy + h };
  const angOuterTop = Math.atan2(pTop.y - cy, pTop.x - cx);
  const angOuterBot = Math.atan2(pBot.y - cy, pBot.x - cx);
  const angInnerTop = Math.atan2(pTop.y - cy, pTop.x - icx);
  const angInnerBot = Math.atan2(pBot.y - cy, pBot.x - icx);
  // Outer boundary: the LONG way around the outer circle from top to bottom
  // point, bulging left (away from the inner circle) — going through π.
  let outerSweep = angOuterBot - angOuterTop;
  if(outerSweep > 0) outerSweep -= 2*Math.PI; // force the negative/long way through π (left side)
  const outerChain = arcAnchorChain(cx, cy, R, angOuterTop, angOuterTop + outerSweep, Math.PI/3);
  // Inner boundary: the SHORT way around the inner circle from bottom back
  // to top, curving through its leftmost point (the concave scoop that
  // faces the outer circle's center) — going back through π as well, but
  // as the shorter hop this time since the inner center sits further right.
  let innerSweep = angInnerTop - angInnerBot;
  if(innerSweep < 0) innerSweep += 2*Math.PI;
  const innerChain = arcAnchorChain(icx, cy, r2, angInnerBot, angInnerBot + innerSweep, Math.PI/3);
  // Stitch: outer chain already starts at pTop and ends at pBot; the inner
  // chain starts at pBot and ends at pTop — drop its duplicate endpoints so
  // the two chains join into one continuous closed loop.
  const anchors = outerChain.slice(0, -1).concat(innerChain.slice(0, -1));
  // carry the outer chain's closing handle onto the join, and the inner
  // chain's closing handle onto the wrap-around back to anchors[0]
  anchors[outerChain.length - 1].outX = outerChain[outerChain.length-1].outX;
  anchors[outerChain.length - 1].outY = outerChain[outerChain.length-1].outY;
  const lastInner = innerChain[innerChain.length - 1];
  anchors[0].inX = lastInner.inX; anchors[0].inY = lastInner.inY;
  return shapePathEl({ subpaths: [{ anchors, closed:true }] });
}

  const d = defs[key] || '';

  return `<svg viewBox="0 0 24 24"><path d="${d}" fill="${strokeOnly?'none':'currentColor'}" stroke="currentColor" stroke-width="${strokeOnly?2:0}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* ---------------- SVG helpers ---------------- */
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const el = document.createElementNS(SVGNS, tag);
  for(const k in attrs){ if(attrs[k] != null) el.setAttribute(k, attrs[k]); }
  return el;
}
function elementBounds(el){
  // rough bbox in icon-space, used for selection outline + resize handles
  if(el.kind === 'rect') return { x:el.x, y:el.y, w:el.width, h:el.height };
  if(el.kind === 'circle') return { x:el.cx-el.r, y:el.cy-el.r, w:el.r*2, h:el.r*2 };
  if(el.kind === 'ellipse') return { x:el.cx-el.rx, y:el.cy-el.ry, w:el.rx*2, h:el.ry*2 };
  if(el.kind === 'path'){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const sp of el.pathModel.subpaths){
      for(const a of sp.anchors){
        [[a.x,a.y],[a.inX,a.inY],[a.outX,a.outY]].forEach(([x,y])=>{
          if(x==null) return;
          if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
        });
      }
    }
    if(minX===Infinity) return {x:10,y:10,w:4,h:4};
    return { x:minX, y:minY, w:maxX-minX, h:maxY-minY };
  }
  return {x:0,y:0,w:0,h:0};
}

// Align/distribute reuses the same multi-select set built via Ctrl/Cmd+click
// in the layers list (normally used for linking) — no separate "select for
// alignment" mechanism needed.
function getAlignTargets(){
  const icon = currentIcon();
  return icon.elements.filter(el => state.linkSelectIds.has(el.id));
}
function applyAlignOrDistribute(kind){
  const targets = getAlignTargets();
  const isDistribute = kind === 'dist-h' || kind === 'dist-v';
  if(targets.length < 2){ alert('Сначала выделите минимум 2 фигуры: Ctrl/Cmd+клик по ним в списке слоёв слева.'); return; }
  if(isDistribute && targets.length < 3){ alert('Для распределения нужно минимум 3 фигуры.'); return; }
  const boundsList = targets.map(el=>({ el, b: elementBounds(el) }));

  if(kind==='align-left' || kind==='align-hcenter' || kind==='align-right'){
    const minX = Math.min(...boundsList.map(o=>o.b.x));
    const maxRight = Math.max(...boundsList.map(o=>o.b.x + o.b.w));
    const centerX = (minX + maxRight) / 2;
    boundsList.forEach(({el,b})=>{
      const targetX = kind==='align-left' ? minX : kind==='align-right' ? maxRight - b.w : centerX - b.w/2;
      translateElement(el, el, targetX - b.x, 0);
    });
  } else if(kind==='align-top' || kind==='align-vcenter' || kind==='align-bottom'){
    const minY = Math.min(...boundsList.map(o=>o.b.y));
    const maxBottom = Math.max(...boundsList.map(o=>o.b.y + o.b.h));
    const centerY = (minY + maxBottom) / 2;
    boundsList.forEach(({el,b})=>{
      const targetY = kind==='align-top' ? minY : kind==='align-bottom' ? maxBottom - b.h : centerY - b.h/2;
      translateElement(el, el, 0, targetY - b.y);
    });
  } else if(kind==='dist-h' || kind==='dist-v'){
    const axis = kind==='dist-h' ? 'x' : 'y';
    const sizeKey = kind==='dist-h' ? 'w' : 'h';
    const sorted = boundsList.slice().sort((a,b)=>a.b[axis]-b.b[axis]);
    const first = sorted[0], last = sorted[sorted.length-1];
    const totalSpan = (last.b[axis] + last.b[sizeKey]) - first.b[axis];
    const totalSize = sorted.reduce((s,o)=>s + o.b[sizeKey], 0);
    const gap = (totalSpan - totalSize) / (sorted.length - 1);
    let cursor = first.b[axis] + first.b[sizeKey] + gap;
    for(let i=1; i<sorted.length-1; i++){
      const { el, b } = sorted[i];
      if(axis==='x') translateElement(el, el, cursor - b.x, 0);
      else translateElement(el, el, 0, cursor - b.y);
      cursor += b[sizeKey] + gap;
    }
  }

  markDirty(state.currentKey);
  snapshot();
  renderAll();
}

// Adding/removing icon KEYS themselves (not just shapes inside one) — mutates
// the now-`let` MARKER_ICONS/MARKER_COLORS/MARKER_ICON_CATEGORIES/ALL_KEYS
// globals directly so every part of the editor that reads them (sidebar,
// category select, etc.) picks the change up immediately. Saving later
// diffs ALL_KEYS against whatever's in the connected/downloaded file
// (see computeKeyDiff) to know which lines to add or strip on export.
function addNewIcon(){
  let key = prompt('Ключ новой иконки (латиница, цифры, подчёркивания, без пробелов), например: watchtower');
  if(key == null) return;
  key = key.trim();
  if(!key){ alert('Ключ не может быть пустым.'); return; }
  if(!/^[a-z][a-z0-9_]*$/.test(key)){ alert('Ключ должен начинаться с латинской буквы и содержать только латинские строчные буквы, цифры и подчёркивания.'); return; }
  if(library[key]){ alert('Иконка с таким ключом уже существует.'); return; }
  const label = (prompt('Название (то, что видно в списке), например: Сторожевая башня', key) || key).trim() || key;
  const fallbackCat = MARKER_ICON_CATEGORIES.find(c=>c.key==='other') || MARKER_ICON_CATEGORIES[MARKER_ICON_CATEGORIES.length-1];
  const catKey = fallbackCat ? fallbackCat.key : 'other';
  MARKER_ICONS = MARKER_ICONS.concat([[key, label]]);
  MARKER_ICON_LABELS[key] = label;
  MARKER_COLORS[key] = MARKER_COLORS.other || 'var(--gray)';
  if(fallbackCat) fallbackCat.icons.push(key);
  MARKER_ICON_TO_CATEGORY[key] = catKey;
  library[key] = { elements: [], viewBox: '-2 -2 28 28', dirty: true, label, category: catKey, color: MARKER_COLORS[key] };
  ALL_KEYS = ALL_KEYS.concat([key]);
  state.currentKey = key;
  state.selectedElId = null;
  state.selectedAnchor = null;
  state.history[key] = [JSON.stringify(library[key].elements)];
  state.historyIndex[key] = 0;
  persistLocal();
  populateCategorySelect();
  renderSidebar();
  renderAll();
  state.structureDirty = true; flashSaveStatus(`Добавлена новая иконка «${key}» — нарисуйте её и сохраните, когда будете готовы.`);
}
function deleteCurrentIcon(){
  const key = state.currentKey;
  if(!key || !library[key]) return;
  if(ALL_KEYS.length <= 1){ alert('Нельзя удалить последнюю оставшуюся иконку.'); return; }
  if(!confirm(`Удалить иконку «${library[key].label || key}» (${key}) насовсем? После сохранения это будет необратимо.`)) return;
  delete library[key];
  ALL_KEYS = ALL_KEYS.filter(k=>k!==key);
  MARKER_ICONS = MARKER_ICONS.filter(([k])=>k!==key);
  delete MARKER_ICON_LABELS[key];
  delete MARKER_COLORS[key];
  delete MARKER_ICON_TO_CATEGORY[key];
  MARKER_ICON_CATEGORIES.forEach(cat=>{ cat.icons = cat.icons.filter(k=>k!==key); });
  state.linkSelectIds.delete(key);
  delete state.history[key];
  delete state.historyIndex[key];
  state.currentKey = ALL_KEYS[0];
  state.selectedElId = null;
  state.selectedAnchor = null;
  persistLocal();
  populateCategorySelect();
  renderSidebar();
  renderAll();
  state.structureDirty = true; flashSaveStatus(`Иконка «${key}» удалена — нажмите «Сохранить», чтобы это попало в файл.`);
}

function renameCurrentIcon(){
  const oldKey = state.currentKey;
  if(!oldKey || !library[oldKey]) return;
  const currentLabel = library[oldKey].label || oldKey;

  const newLabelRaw = prompt('Новое название иконки:', currentLabel);
  if(newLabelRaw == null) return; // cancelled
  const newLabel = newLabelRaw.trim() || currentLabel;

  const newKeyRaw = prompt('Ключ иконки (латиница, цифры, подчёркивания) — оставьте как есть, если менять не нужно:', oldKey);
  if(newKeyRaw == null) return; // cancelled
  let newKey = newKeyRaw.trim() || oldKey;

  if(newKey !== oldKey){
    if(!/^[a-z][a-z0-9_]*$/.test(newKey)){ alert('Ключ должен начинаться с латинской буквы и содержать только латинские строчные буквы, цифры и подчёркивания.'); return; }
    if(library[newKey]){ alert('Иконка с таким ключом уже существует.'); return; }
    if(!confirm(`Сменить ключ «${oldKey}» на «${newKey}»? Если где-то (например, на карте в основном приложении) уже стоят метки с типом «${oldKey}», они перестанут находить эту иконку и будут показываться как «Другое», пока вы сами не переставите их на новый тип. Продолжить?`)) return;

    library[newKey] = library[oldKey];
    delete library[oldKey];
    ALL_KEYS = ALL_KEYS.map(k => k === oldKey ? newKey : k);
    MARKER_COLORS[newKey] = MARKER_COLORS[oldKey];
    delete MARKER_COLORS[oldKey];
    delete MARKER_ICON_LABELS[oldKey];
    MARKER_ICON_TO_CATEGORY[newKey] = MARKER_ICON_TO_CATEGORY[oldKey];
    delete MARKER_ICON_TO_CATEGORY[oldKey];
    MARKER_ICON_CATEGORIES.forEach(cat=>{ cat.icons = cat.icons.map(k => k === oldKey ? newKey : k); });
    MARKER_ICONS = MARKER_ICONS.filter(([k]) => k !== oldKey);
    state.linkSelectIds.delete(oldKey);
    if(state.history[oldKey]){ state.history[newKey] = state.history[oldKey]; delete state.history[oldKey]; }
    if(state.historyIndex[oldKey] !== undefined){ state.historyIndex[newKey] = state.historyIndex[oldKey]; delete state.historyIndex[oldKey]; }
    state.currentKey = newKey;
    // the old key's SVG line must be stripped and the (new) one written back
    // in on save — marking dirty makes the existing per-icon save logic do that
    library[newKey].dirty = true;
  }

  const finalKey = newKey;
  library[finalKey].label = newLabel;
  MARKER_ICON_LABELS[finalKey] = newLabel;
  const pair = MARKER_ICONS.find(([k]) => k === finalKey);
  if(pair) pair[1] = newLabel;
  else MARKER_ICONS = MARKER_ICONS.concat([[finalKey, newLabel]]);

  persistLocal();
  populateCategorySelect();
  renderSidebar();
  renderAll();
  state.structureDirty = true; flashSaveStatus(`Переименовано${newKey!==oldKey ? ` (ключ: «${oldKey}» → «${newKey}»)` : ''} — нажмите «Сохранить», чтобы это попало в файл.`);
}

/* ---------------- render: sidebar ---------------- */
function iconThumbSvg(key, sizePx){
  const icon = library[key];
  const svg = iconToSvgString(icon).replace('currentColor', '#e9e4d8').replace(/var\(--marker-color\)/g, '#8a8f9e');
  // the above only replaces the FIRST currentColor; do a full pass instead:
  return iconToSvgStringForPreview(icon);
}
function iconToSvgStringForPreview(icon){
  const inner = icon.elements.map(elementToSvgString).join('');
  const previewInner = inner.replace(/currentColor/g, '#e9e4d8').replace(/var\(--marker-color\)/g, '#8a8f9e');
  return `<svg viewBox="${icon.viewBox}">${previewInner}</svg>`;
}
function renderSidebar(){
  const catTabs = document.getElementById('catTabs');
  const cats = [{key:'all',label:'Все'}, ...MARKER_ICON_CATEGORIES.map(c=>({key:c.key,label:c.label}))];
  catTabs.innerHTML = cats.map(c=>`<button data-cat="${c.key}" class="${state.activeCat===c.key?'active':''}">${esc(c.label)}</button>`).join('');
  catTabs.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.activeCat = b.dataset.cat; renderSidebar(); });
  });

  const list = document.getElementById('iconList');
  const q = state.search.trim().toLowerCase();
  const keys = ALL_KEYS.filter(k=>{
    if(state.activeCat !== 'all' && library[k].category !== state.activeCat) return false;
    if(q && !k.includes(q) && !(library[k].label||'').toLowerCase().includes(q)) return false;
    return true;
  });
  list.innerHTML = keys.map(k=>{
    const icon = library[k];
    const hasArt = icon.elements.length > 0;
    const moved = icon.category !== iconCategoryOf(k);
    return `<div class="icon-thumb ${k===state.currentKey?'active':''} ${icon.dirty?'dirty':''} ${moved?'moved':''}" data-key="${k}" title="${esc(icon.label)} (${k})${moved?' — перемещена в другую категорию':''}">
      ${hasArt ? iconToSvgStringForPreview(icon) : '<span style="font-size:9px; color:var(--text-dim);">пусто</span>'}
      <span class="dot"></span>
      <span class="moved-dot"></span>
    </div>`;
  }).join('');
  list.querySelectorAll('.icon-thumb').forEach(t=>{
    t.addEventListener('click', ()=> loadIcon(t.dataset.key));
  });
}

/* ---------------- render: topbar ---------------- */
function populateCategorySelect(){
  const sel = document.getElementById('iconCategorySelect');
  sel.innerHTML = MARKER_ICON_CATEGORIES.map(c=>`<option value="${c.key}">${esc(c.label)}</option>`).join('');
}
function renderTopbar(){
  const icon = currentIcon();
  document.getElementById('iconKeyLabel').textContent = state.currentKey;
  const originalCat = iconCategoryOf(state.currentKey);
  const moved = icon.category !== originalCat;
  const catLabel = (MARKER_ICON_CATEGORIES.find(c=>c.key===icon.category)||{}).label || icon.category;
  document.getElementById('iconMetaLabel').innerHTML =
    `${esc(icon.label)} · ${esc(catLabel)}${moved ? ` <span class="moved">(было: ${esc((MARKER_ICON_CATEGORIES.find(c=>c.key===originalCat)||{}).label || originalCat)})</span>` : ''}${icon.dirty ? ' · изменено' : ''}`;
  document.getElementById('iconCategorySelect').value = icon.category;
  const dirtyCount = Object.values(library).filter(x=>x.dirty).length;
  const st = document.getElementById('saveStatus');
  const unsaved = hasUnsaved();
  st.classList.toggle('warn', !!unsaved);
  st.textContent = (unsaved ? `Не сохранено${dirtyCount ? ` (изменено значков: ${dirtyCount})` : ''}. ` : 'Всё сохранено. ')
    + (window.__catalogMissing ? 'Рядом нет marker-icons.js — нажмите «Открыть…».' : state.fileHandle ? `Сохранение пишет в ${state.fileHandle.name}.` : 'Сохранение выберет файл или скачает marker-icons.js.');
  requestAnimationFrame(fitBaseCanvas);
  const h = state.history[state.currentKey] || [];
  const idx = state.historyIndex[state.currentKey] || 0;
  document.getElementById('undoBtn').disabled = idx <= 0;
  document.getElementById('redoBtn').disabled = idx >= h.length - 1;
}

/* ---------------- render: canvas ---------------- */
function renderCanvas(){
  const svg = document.getElementById('svgCanvas');
  const icon = currentIcon();
  svg.setAttribute('viewBox', icon.viewBox);
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  // safe-zone guide: shows the canonical 24x24 icon area distinct from the
  // small bleed margin the -2 -2 28 28 viewBox leaves around it.
  svg.appendChild(svgEl('rect', {class:'safe-zone', x:0, y:0, width:24, height:24}));

  // icon artwork itself
  for(const el of icon.elements){
    const node = renderElementNode(el);
    node.dataset.elId = el.id;
    node.classList.add('move-hit');
    node.addEventListener('pointerdown', (e)=> onElementPointerDown(e, el));
    svg.appendChild(node);
  }

  // selection overlay
  const sel = icon.elements.find(e=>e.id===state.selectedElId);
  if(sel){
    if(sel.kind === 'path'){
      renderPathEditOverlay(svg, sel);
    } else {
      renderShapeResizeOverlay(svg, sel);
    }
    renderRotateHandle(svg, sel);
  }

  // in-progress pen tool preview
  if(state.drawing){
    renderDrawingPreview(svg);
  }

  // active snap guides — full-length lines across the canvas while dragging
  if(state.snapGuides.x){
    const cls = 'snap-guide ' + (state.snapGuides.x.type==='object' ? 'snap-guide-object' : 'snap-guide-canvas');
    svg.appendChild(svgEl('line', {class:cls, x1:state.snapGuides.x.value, y1:-2, x2:state.snapGuides.x.value, y2:26}));
  }
  if(state.snapGuides.y){
    const cls = 'snap-guide ' + (state.snapGuides.y.type==='object' ? 'snap-guide-object' : 'snap-guide-canvas');
    svg.appendChild(svgEl('line', {class:cls, x1:-2, y1:state.snapGuides.y.value, x2:26, y2:state.snapGuides.y.value}));
  }
  if(state.snapGuides.radial){
    const r = state.snapGuides.radial;
    // extend the spoke line well past the vertex in both directions so it
    // reads as an infinite "thread" through the shape's center, not just a
    // stub ending at the cursor.
    const dx = r.x - r.cx, dy = r.y - r.cy;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx/len, uy = dy/len;
    const ext = 30;
    svg.appendChild(svgEl('line', {
      class:'snap-guide snap-guide-radial',
      x1: r.cx - ux*ext, y1: r.cy - uy*ext, x2: r.cx + ux*ext, y2: r.cy + uy*ext,
    }));
    svg.appendChild(svgEl('circle', {class:'snap-guide-center-dot', cx:r.cx, cy:r.cy, r:0.35}));
  }
  renderRealPreview();
}

// Renders the current icon at the same pixel sizes / colors it actually
// appears at in the app (marker on the map, marker in the card list), plus
// one larger reference size — so tiny-detail legibility issues (windows
// that turn to mush, etc.) are visible right here without exporting and
// reopening the main app.
function renderRealPreview(){
  const wrap = document.getElementById('realPreviewSizes');
  if(!wrap) return;
  const icon = currentIcon();
  const innerSvg = icon.elements.map(elementToSvgString).join('');
  const color = icon.color || 'var(--gold)';
  const sizes = [
    { label:'На карте', icon:9, badge:16 },
    { label:'В карточке', icon:16, badge:30 },
    { label:'Крупно', icon:24, badge:43 },
  ];
  wrap.innerHTML = sizes.map(s=>`
    <div class="rp-size-row">
      <div class="rp-badge" style="width:${s.badge}px; height:${s.badge}px; background:${color}; color:#14151b; --marker-color:${color};">
        <svg width="${s.icon}" height="${s.icon}" viewBox="${icon.viewBox}">${innerSvg}</svg>
      </div>
      <div class="rp-size-label">${esc(s.label)} · ${s.icon}px</div>
    </div>
  `).join('');
}

function renderElementNode(el){
  const fillAttr = el.fillRole==='none' ? 'none' : roleToColor(el.fillRole, el.fillCustom);
  const strokeAttr = el.strokeRole==='none' ? 'none' : roleToColor(el.strokeRole, el.strokeCustom);
  const previewFill = fillAttr === 'currentColor' ? '#e9e4d8' : fillAttr === 'var(--marker-color)' ? '#8a8f9e' : fillAttr;
  const previewStroke = strokeAttr === 'currentColor' ? '#e9e4d8' : strokeAttr === 'var(--marker-color)' ? '#8a8f9e' : strokeAttr;
  const attrs = {
    fill: previewFill, stroke: previewStroke,
    'stroke-width': el.strokeRole!=='none' ? (el.strokeWidth||2) : null,
    'stroke-dasharray': el.strokeDasharray || null,
    opacity: (el.opacity!=null && el.opacity!==1) ? el.opacity : null,
    transform: el.transform || null,
  };
  if(el.kind === 'path') return svgEl('path', {...attrs, d: serializePathD(el.pathModel)});
  if(el.kind === 'rect') return svgEl('rect', {...attrs, x:el.x, y:el.y, width:el.width, height:el.height, rx:el.rx||null});
  if(el.kind === 'circle') return svgEl('circle', {...attrs, cx:el.cx, cy:el.cy, r:el.r});
  if(el.kind === 'ellipse') return svgEl('ellipse', {...attrs, cx:el.cx, cy:el.cy, rx:el.rx, ry:el.ry});
  return svgEl('g', {});
}

/* ---- path node-edit overlay ---- */
function renderPathEditOverlay(svg, el){
  const g = svgEl('g', {});
  el.pathModel.subpaths.forEach((sp, spIdx)=>{
    sp.anchors.forEach((a, aIdx)=>{
      // handle lines + points
      if(a.inX != null){
        g.appendChild(svgEl('line', {class:'handle-line', x1:a.x, y1:a.y, x2:a.inX, y2:a.inY}));
        const hp = svgEl('circle', {class:'handle-pt', cx:a.inX, cy:a.inY, r:0.35});
        hp.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); startAnchorDrag(e, spIdx, aIdx, 'in'); });
        g.appendChild(hp);
      }
      if(a.outX != null){
        g.appendChild(svgEl('line', {class:'handle-line', x1:a.x, y1:a.y, x2:a.outX, y2:a.outY}));
        const hp = svgEl('circle', {class:'handle-pt', cx:a.outX, cy:a.outY, r:0.35});
        hp.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); startAnchorDrag(e, spIdx, aIdx, 'out'); });
        g.appendChild(hp);
      }
      const isSel = state.selectedAnchor && state.selectedAnchor.subpathIdx===spIdx && state.selectedAnchor.anchorIdx===aIdx && state.selectedAnchor.part==='anchor';
      const ap = svgEl('circle', {class:'anchor-pt'+(isSel?' selected':''), cx:a.x, cy:a.y, r:0.5});
      ap.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); startAnchorDrag(e, spIdx, aIdx, 'anchor'); });
      g.appendChild(ap);
    });
  });
  svg.appendChild(g);
}

/* ---- simple shape resize overlay (rect/circle/ellipse) ---- */
function renderShapeResizeOverlay(svgRoot, el){
  const svg = svgEl('g', { transform: el.transform || null });
  svgRoot.appendChild(svg);
  const b = elementBounds(el);
  const outline = svgEl('rect', {class:'elem-outline', x:b.x, y:b.y, width:b.w, height:b.h});
  svg.appendChild(outline);
  const corners = [
    {x:b.x, y:b.y, k:'nw'}, {x:b.x+b.w, y:b.y, k:'ne'},
    {x:b.x, y:b.y+b.h, k:'sw'}, {x:b.x+b.w, y:b.y+b.h, k:'se'},
  ];
  corners.forEach(c=>{
    const h = svgEl('circle', {class:'resize-handle', cx:c.x, cy:c.y, r:0.5});
    h.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); startResizeDrag(e, el, c.k); });
    svg.appendChild(h);
  });
}

/* ---- rotate handle: drag to spin the element around its bbox center
   (or its existing custom pivot, if the transform field already has one) ---- */
function parseRotateTransform(t){
  const m = /rotate\(\s*(-?[\d.]+)(?:[ ,]+(-?[\d.]+)[ ,]+(-?[\d.]+))?\s*\)/.exec(t || '');
  if(!m) return null;
  return { angle: parseFloat(m[1]), cx: m[2] != null ? parseFloat(m[2]) : null, cy: m[3] != null ? parseFloat(m[3]) : null };
}
/* Поворот и редактирование точек.
   У контура поворот «запекается» прямо в координаты точек (transform убирается), иначе точки
   рисуются в одной системе координат, а фигура — в другой, и всё ломается.
   У rect/circle/ellipse поворот остаётся атрибутом transform, поэтому их рамку и мышь
   пересчитываем через rotateAround(). */
function rotateAround(pt, angleDeg, cx, cy){
  const a = angleDeg * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a), dx = pt.x - cx, dy = pt.y - cy;
  return { x: cx + dx*c - dy*sn, y: cy + dx*sn + dy*c };
}
function localizePoint(el, p){
  const r = parseRotateTransform(el && el.transform);
  if(!r || !r.angle) return p;
  return rotateAround(p, -r.angle, r.cx != null ? r.cx : 0, r.cy != null ? r.cy : 0);
}
function bakeRotation(el){
  if(!el || el.kind !== 'path' || !el.transform) return false;
  const r = parseRotateTransform(el.transform);
  if(!r || !/^\s*rotate\([^)]*\)\s*$/.test(el.transform)) return false;
  if(r.angle){
    const cx = r.cx != null ? r.cx : 0, cy = r.cy != null ? r.cy : 0;
    for(const sp of el.pathModel.subpaths){
      for(const a of sp.anchors){
        const q = rotateAround(a, r.angle, cx, cy); a.x = q.x; a.y = q.y;
        if(a.inX != null){ const i = rotateAround({x:a.inX,y:a.inY}, r.angle, cx, cy); a.inX = i.x; a.inY = i.y; }
        if(a.outX != null){ const o = rotateAround({x:a.outX,y:a.outY}, r.angle, cx, cy); a.outX = o.x; a.outY = o.y; }
      }
    }

  return true;
}
function rotatePivotFor(el, b){
  const parsed = parseRotateTransform(el.transform);
  if(parsed && parsed.cx != null && parsed.cy != null) return { x:parsed.cx, y:parsed.cy };
  return { x: b.x + b.w/2, y: b.y + b.h/2 };
}
const ROTATE_HANDLE_OFFSET = 3; // icon-space units above the bbox top edge
function renderRotateHandle(svg, el){
  const b = elementBounds(el);
  const pivot = rotatePivotFor(el, b);
  const angle = (parseRotateTransform(el.transform) || { angle:0 }).angle;
  const rad = angle * Math.PI / 180;
  const topX = b.x + b.w/2, topY = b.y - ROTATE_HANDLE_OFFSET;
  // rotate the (unrotated) stick/handle position by the element's current
  // angle around its pivot, so the handle stays visually attached to the
  // shape as it spins rather than always pointing straight up.
  const rot = (px, py) => ({
    x: pivot.x + (px - pivot.x) * Math.cos(rad) - (py - pivot.y) * Math.sin(rad),
    y: pivot.y + (px - pivot.x) * Math.sin(rad) + (py - pivot.y) * Math.cos(rad),
  });
  const anchorTop = rot(b.x + b.w/2, b.y);
  const handlePt = rot(topX, topY);
  svg.appendChild(svgEl('line', { class:'rotate-stick', x1:anchorTop.x, y1:anchorTop.y, x2:handlePt.x, y2:handlePt.y }));
  const h = svgEl('circle', { class:'rotate-handle', cx:handlePt.x, cy:handlePt.y, r:0.55 });
  h.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); startRotateDrag(e, el); });
  svg.appendChild(h);
}
function startRotateDrag(e, el){
  const svg = document.getElementById('svgCanvas');
  svg.setPointerCapture(e.pointerId);
  const b = elementBounds(el);
  const pivot = rotatePivotFor(el, b);
  const startAngle = (parseRotateTransform(el.transform) || { angle:0 }).angle;
  const p0 = getSvgPoint(e);
  const pointerStartDeg = Math.atan2(p0.y - pivot.y, p0.x - pivot.x) * 180 / Math.PI;
  let moved = false;
  function onMove(ev){
    moved = true;
    const p = getSvgPoint(ev);
    const pointerDeg = Math.atan2(p.y - pivot.y, p.x - pivot.x) * 180 / Math.PI;
    let newAngle = startAngle + (pointerDeg - pointerStartDeg);
    if(ev.shiftKey) newAngle = Math.round(newAngle / 15) * 15;
    newAngle = Math.round(newAngle * 10) / 10;
    el.transform = `rotate(${newAngle} ${round2(pivot.x)} ${round2(pivot.y)})`;
    renderCanvas();
  }
  function onUp(){
    svg.releasePointerCapture(e.pointerId);
    svg.removeEventListener('pointermove', onMove);
    svg.removeEventListener('pointerup', onUp);

  }
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
}
function round2(v){ return Math.round(v*100)/100; }

<script id="editor-interact-src">

// ============================================================
// editor_interact.js — pointer interactions + load/save.
// ============================================================

function getSvgPoint(evt){
  const svg = document.getElementById('svgCanvas');
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const ctm = svg.getScreenCTM();
  if(!ctm) return { x:0, y:0 };
  const loc = pt.matrixTransform(ctm.inverse());
  return { x: loc.x, y: loc.y };
}

function selectElement(id){
  { const el0 = currentIcon().elements.find(x=>x.id===id); if(el0) bakeRotation(el0); }
  state.selectedElId = id;
  state.selectedAnchor = null;
  renderCanvas();
  renderRightPanel();
}

/* ---------------- linking (binding) between objects ----------------
   Elements sharing a `linkGroup` id move together when any one of them is
   dragged on the canvas. Purely a move-together binding — it doesn't
   propagate resize/rotate/color, just translation, which covers the common
   case of keeping a multi-shape icon (e.g. a roof + body + window) aligned
   while you nudge the whole thing into place. */
function linkElementIds(ids, opts){
  const icon = currentIcon();
  ids = (ids||[]).filter(Boolean).filter(id=>icon.elements.some(x=>x.id===id));
  if(ids.length < 2) return;
  const selectedEls = ids.map(id=>icon.elements.find(x=>x.id===id));
  // If the selection spans one or more existing groups, merge all of those
  // groups (not just the clicked members) into a single group so linking
  // never leaves a group silently split in two.
  const existingGroups = Array.from(new Set(selectedEls.map(el=>el.linkGroup).filter(Boolean)));
  const groupId = existingGroups[0] || ('grp-' + uid());
  icon.elements.forEach(el=>{
    if(ids.includes(el.id) || existingGroups.includes(el.linkGroup)) el.linkGroup = groupId;
  });
  if(!opts || !opts.skipClearSelection) state.linkSelectIds.clear();
  markDirty(state.currentKey); snapshot(); renderAll();
}
function linkSelectedElements(){
  linkElementIds(Array.from(state.linkSelectIds));
}
function unlinkSelectedElements(){
  const icon = currentIcon();
  state.linkSelectIds.forEach(id=> unlinkGroupMember(icon, id, {skipCleanup:true}));
  cleanupSingletonLinkGroups(icon);
  state.linkSelectIds.clear();
  markDirty(state.currentKey); snapshot(); renderAll();
}
// Removes one element from its link group (if any). Leaves other members
// of the group linked to each other.
function unlinkGroupMember(icon, id, opts){
  const el = icon.elements.find(x=>x.id===id);
  if(!el || !el.linkGroup) return;
  el.linkGroup = null;
  if(!opts || !opts.skipCleanup) cleanupSingletonLinkGroups(icon);
}
// A "group" of exactly one element is meaningless — if unlinking leaves a
// group with a single remaining member, clear its linkGroup too.
function cleanupSingletonLinkGroups(icon){
  const counts = {};
  icon.elements.forEach(el=>{ if(el.linkGroup) counts[el.linkGroup] = (counts[el.linkGroup]||0) + 1; });
  icon.elements.forEach(el=>{ if(el.linkGroup && counts[el.linkGroup] < 2) el.linkGroup = null; });
}

function loadIcon(key){
  if(state.drawing) finishDrawing();
  state.currentKey = key;
  state.selectedElId = null;
  state.selectedAnchor = null;
  if(!state.history[key]) snapshot();
  renderAll();
}

/* ---------------- element drag (move whole shape) ---------------- */
function onElementPointerDown(e, el){
  if(state.drawing){ onCanvasPointerDownForDrawing(e); return; }
  e.stopPropagation();
  selectElement(el.id);
  const startPt = getSvgPoint(e);
  const icon = currentIcon();
  // If this shape is linked to others, they all move together — snapshot
  // every member of the group up front so each can be translated from its
  // own starting position as the pointer moves.
  const groupEls = el.linkGroup ? icon.elements.filter(x => x.linkGroup === el.linkGroup) : [el];
  const startSnapshots = groupEls.map(x => JSON.parse(JSON.stringify(x)));
  const origBounds = combinedBounds(startSnapshots);
  const excludeIds = groupEls.map(g=>g.id);
  const linesX = axisSnapLines(excludeIds, 'x');
  const linesY = axisSnapLines(excludeIds, 'y');
  const svg = document.getElementById('svgCanvas');
  svg.setPointerCapture(e.pointerId);
  let moved = false;
  function onMove(ev){
    const p = getSvgPoint(ev);
    let dx = p.x - startPt.x, dy = p.y - startPt.y;
    if(Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05) moved = true;
    const snapX = findSpanSnap(origBounds.x + dx, origBounds.w, linesX);
    const snapY = findSpanSnap(origBounds.y + dy, origBounds.h, linesY);
    if(snapX) dx += snapX.delta;
    if(snapY) dy += snapY.delta;
    state.snapGuides = {
      x: snapX ? { value:snapX.guide, type:snapX.type } : null,
      y: snapY ? { value:snapY.guide, type:snapY.type } : null,

    groupEls.forEach((gEl, i) => translateElement(gEl, startSnapshots[i], dx, dy));

  }
