    svg.releasePointerCapture(e.pointerId);
    svg.removeEventListener('pointermove', onMove);
    svg.removeEventListener('pointerup', onUp);
    clearSnapGuides(); renderCanvas();
    if(moved){ markDirty(state.currentKey); snapshot(); renderRightPanel(); renderSidebar(); }
  }
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
}
function translateElement(el, startEl, dx, dy){
  if(el.kind === 'rect'){ el.x = startEl.x + dx; el.y = startEl.y + dy; }
  else if(el.kind === 'circle' || el.kind === 'ellipse'){ el.cx = startEl.cx + dx; el.cy = startEl.cy + dy; }
  if(el.kind !== 'path' && startEl.transform){
    const r = parseRotateTransform(startEl.transform);
    if(r) el.transform = `rotate(${r.angle} ${round2((r.cx != null ? r.cx : 0) + dx)} ${round2((r.cy != null ? r.cy : 0) + dy)})`;
  }
  else if(el.kind === 'path'){
    el.pathModel = JSON.parse(JSON.stringify(startEl.pathModel));
    for(const sp of el.pathModel.subpaths){
      for(const a of sp.anchors){
        a.x += dx; a.y += dy;
        if(a.inX != null){ a.inX += dx; a.inY += dy; }
        if(a.outX != null){ a.outX += dx; a.outY += dy; }
      }
    }
  }
}

/* ---------------- path anchor / handle drag ---------------- */
function startAnchorDrag(e, spIdx, aIdx, part){
  const icon = currentIcon();
  const el = icon.elements.find(x => x.id === state.selectedElId);
  if(!el) return;
  state.selectedAnchor = { subpathIdx: spIdx, anchorIdx: aIdx, part };
  const svg = document.getElementById('svgCanvas');
  svg.setPointerCapture(e.pointerId);
  const anchor = el.pathModel.subpaths[spIdx].anchors[aIdx];
  const start = { x:anchor.x, y:anchor.y, inX:anchor.inX, inY:anchor.inY, outX:anchor.outX, outY:anchor.outY };
  const linesX = axisSnapLines([el.id], 'x');
  const linesY = axisSnapLines([el.id], 'y');

  // Whole-shape scaling: holding Shift while dragging an anchor point scales
  // every anchor (and its curve handles) of the shape around its own
  // centroid, using this anchor's own distance from center as the dial —
  // drag it outward to grow the whole shape, inward to shrink it.
  const scaleCenter = part === 'anchor' ? shapeCentroid(el) : null;
  const scaleStartModel = scaleCenter ? JSON.parse(JSON.stringify(el.pathModel)) : null;
  const scaleD0 = scaleCenter ? Math.hypot(start.x - scaleCenter.cx, start.y - scaleCenter.cy) : 0;
  let wasScaling = false;

  let moved = false;
  function onMove(ev){
    const p = getSvgPoint(ev);
    moved = true;

    if(part === 'anchor' && ev.shiftKey && scaleCenter && scaleD0 > 0.05){
      wasScaling = true;
      const { cx, cy } = scaleCenter;
      const d1 = Math.hypot(p.x - cx, p.y - cy);
      const scale = d1 / scaleD0;
      el.pathModel.subpaths.forEach((sp, spI) => {
        sp.anchors.forEach((a, aI) => {
          const orig = scaleStartModel.subpaths[spI].anchors[aI];
          a.x = cx + (orig.x - cx) * scale;
          a.y = cy + (orig.y - cy) * scale;
          if(orig.inX != null){ a.inX = cx + (orig.inX - cx) * scale; a.inY = cy + (orig.inY - cy) * scale; }
          if(orig.outX != null){ a.outX = cx + (orig.outX - cx) * scale; a.outY = cy + (orig.outY - cy) * scale; }
        });
      });
      // Reuse the radial-guide visuals as a scaling pivot indicator: a spoke
      // from the shape's center out to the cursor, plus a dot at the pivot.
      state.snapGuides = { x:null, y:null, radial:{ x:p.x, y:p.y, cx, cy } };
      renderCanvas();
      return;
    }
    if(wasScaling){
      // Shift released mid-drag: restore the pre-scale geometry (in place,
      // so the `anchor` reference below stays valid) and fall through to a
      // normal single-point drag from the original baseline, instead of
      // leaving the shape mid-scale while also yanking one point around.
      el.pathModel.subpaths.forEach((sp, spI) => {
        sp.anchors.forEach((a, aI) => {
          const orig = scaleStartModel.subpaths[spI].anchors[aI];
          a.x = orig.x; a.y = orig.y; a.inX = orig.inX; a.inY = orig.inY; a.outX = orig.outX; a.outY = orig.outY;
        });
      });
      wasScaling = false;
    }

    if(part === 'anchor'){
      let ax = p.x, ay = p.y;
      const sx = findSnap(ax, linesX), sy = findSnap(ay, linesY);
      if(sx || sy){
        if(sx) ax = sx.value;
        if(sy) ay = sy.value;
        state.snapGuides = { x: sx ? {value:sx.value,type:sx.type} : null, y: sy ? {value:sy.value,type:sy.type} : null, radial:null };
      } else {
        const radial = ev.altKey ? null : selfShapeRadialSnap(el, spIdx, aIdx, p);
        if(radial){
          ax = radial.x; ay = radial.y;
          state.snapGuides = { x:null, y:null, radial };
        } else {
          state.snapGuides = { x:null, y:null, radial:null };
        }
      }
      const dx = ax - start.x, dy = ay - start.y;
      anchor.x = ax; anchor.y = ay;
      if(anchor.inX != null){ anchor.inX = start.inX + dx; anchor.inY = start.inY + dy; }
      if(anchor.outX != null){ anchor.outX = start.outX + dx; anchor.outY = start.outY + dy; }
    } else if(part === 'in'){
      clearSnapGuides();
      anchor.inX = p.x; anchor.inY = p.y;
    } else if(part === 'out'){
      clearSnapGuides();
      anchor.outX = p.x; anchor.outY = p.y;
    }
    renderCanvas();
  }
  function onUp(){
    svg.releasePointerCapture(e.pointerId);
    svg.removeEventListener('pointermove', onMove);
    svg.removeEventListener('pointerup', onUp);
    clearSnapGuides(); renderCanvas();
    if(moved){ markDirty(state.currentKey); snapshot(); renderSidebar(); }
    renderRightPanel();
  }
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  renderCanvas();
  renderRightPanel();
}

/* ---------------- rect/circle/ellipse resize ---------------- */
function startResizeDrag(e, el, corner){
  const svg = document.getElementById('svgCanvas');
  svg.setPointerCapture(e.pointerId);
  const b0 = elementBounds(el);
  const rotated = !!(parseRotateTransform(el.transform) || {}).angle;
  const linesX = rotated ? [] : axisSnapLines([el.id], 'x');
  const linesY = rotated ? [] : axisSnapLines([el.id], 'y');
  function onMove(ev){
    const p = localizePoint(el, getSvgPoint(ev));
    let px = p.x, py = p.y;
    const sx = findSnap(px, linesX), sy = findSnap(py, linesY);
    if(sx) px = sx.value;
    if(sy) py = sy.value;
    state.snapGuides = { x: sx ? {value:sx.value,type:sx.type} : null, y: sy ? {value:sy.value,type:sy.type} : null };
    let x0=b0.x, y0=b0.y, x1=b0.x+b0.w, y1=b0.y+b0.h;
    if(corner === 'nw'){ x0 = px; y0 = py; }
    else if(corner === 'ne'){ x1 = px; y0 = py; }
    else if(corner === 'sw'){ x0 = px; y1 = py; }
    else if(corner === 'se'){ x1 = px; y1 = py; }
    const nx = Math.min(x0,x1), ny = Math.min(y0,y1), nw = Math.abs(x1-x0), nh = Math.abs(y1-y0);
    if(el.kind === 'rect'){ el.x=nx; el.y=ny; el.width=nw; el.height=nh; }
    else if(el.kind === 'circle'){ el.cx=nx+nw/2; el.cy=ny+nh/2; el.r=Math.max(nw,nh)/2; }
    else if(el.kind === 'ellipse'){ el.cx=nx+nw/2; el.cy=ny+nh/2; el.rx=nw/2; el.ry=nh/2; }
    renderCanvas();
  }
  function onUp(){
    svg.releasePointerCapture(e.pointerId);
    svg.removeEventListener('pointermove', onMove);
    svg.removeEventListener('pointerup', onUp);
    clearSnapGuides(); renderCanvas();
    markDirty(state.currentKey); snapshot(); renderRightPanel(); renderSidebar();
  }
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
}

/* ---------------- pen tool (add new path) ---------------- */
function toggleAddPointMode(){
  if(state.drawing){ finishDrawing(); return; }
  const icon = currentIcon();
  const el = newEmptyPath();
  el.pathModel.subpaths.push({ anchors: [], closed:false });
  icon.elements.push(el);
  state.selectedElId = el.id;
  state.selectedAnchor = null;
  state.drawing = { elId: el.id };
  renderAll();
}
function finishDrawing(){
  const icon = currentIcon();
  const el = icon.elements.find(x => x.id === (state.drawing && state.drawing.elId));
  state.drawing = null;
  // drop a path that ended up empty (user toggled the tool on/off without clicking)
  if(el && el.pathModel.subpaths.every(sp => sp.anchors.length === 0)){
    icon.elements = icon.elements.filter(x => x.id !== el.id);
    state.selectedElId = null;
  } else {
    markDirty(state.currentKey);
    snapshot();
  }
  renderAll();
}
function onCanvasPointerDownForDrawing(e){
  if(!state.drawing) return;
  e.preventDefault();
  const icon = currentIcon();
  const el = icon.elements.find(x => x.id === state.drawing.elId);
  if(!el) return;
  const startP = getSvgPoint(e);
  const sp = el.pathModel.subpaths[el.pathModel.subpaths.length - 1];

  // clicking near the subpath's own starting point closes and finishes it
  if(sp.anchors.length >= 2){
    const first = sp.anchors[0];
    const dist = Math.hypot(first.x - startP.x, first.y - startP.y);
    if(dist < 0.7){
      sp.closed = true;
      finishDrawing();
      return;
    }
  }

  const anchor = { x:startP.x, y:startP.y, inX:null, inY:null, outX:null, outY:null };
  sp.anchors.push(anchor);
  renderCanvas();
  const svg = document.getElementById('svgCanvas');
  svg.setPointerCapture(e.pointerId);
  let dragged = false;
  function onMove(ev){
    const p = getSvgPoint(ev);
    const dx = p.x - startP.x, dy = p.y - startP.y;
    if(Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) dragged = true;
    anchor.outX = p.x; anchor.outY = p.y;
    anchor.inX = startP.x - dx; anchor.inY = startP.y - dy;
    renderCanvas();
  }
  function onUp(){
    svg.releasePointerCapture(e.pointerId);
    svg.removeEventListener('pointermove', onMove);
    svg.removeEventListener('pointerup', onUp);
    if(!dragged){ anchor.inX = null; anchor.inY = null; anchor.outX = null; anchor.outY = null; }
    renderCanvas();
  }
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
}

function pluralShapes(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10===1 && mod100!==11) return 'фигура';
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'фигуры';

}

/* ---------------- copy / paste (in-memory, this session only) ---------------- */
// Lives in `state.clipboard`, not the OS clipboard — no permission prompts,
// works instantly, and that's all copying shapes between icons needs since
// it only ever happens within one open editor tab.
function copySelection(){
  const icon = currentIcon();
  let ids;
  if(state.linkSelectIds.size > 0){
    ids = Array.from(state.linkSelectIds);
  } else if(state.selectedElId){
    const el = icon.elements.find(x => x.id === state.selectedElId);
    if(!el) return;
    // Copying one member of a linked group copies the whole group, same
    // convention as duplicate/flip elsewhere in this editor.
    ids = el.linkGroup ? icon.elements.filter(x => x.linkGroup === el.linkGroup).map(x => x.id) : [el.id];
  } else {
    return;
  }
  const els = ids.map(id => icon.elements.find(x => x.id === id)).filter(Boolean);
  if(!els.length) return;
  state.clipboard = { elements: JSON.parse(JSON.stringify(els)), sourceKey: state.currentKey };
  showToast(`Скопировано: ${els.length} ${pluralShapes(els.length)}`);
}
function pasteClipboard(targetPoint){
  if(!state.clipboard || !state.clipboard.elements.length) return;
  const icon = currentIcon();
  const sameIcon = state.clipboard.sourceKey === state.currentKey;
  // Pasting into a different icon lands at the exact same coordinates (every
  // icon shares the same 24x24 grid) — pasting back into the SAME icon gets
  // a small nudge so the copy doesn't sit invisibly right on top of the original.
  const offset = (sameIcon && !targetPoint) ? 1.5 : 0;
  const groupIdMap = {};
  const copies = state.clipboard.elements.map(orig=>{
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = uid();
    if(copy.linkGroup){
      // preserve the link BETWEEN pasted copies, never back to the originals
      if(!groupIdMap[copy.linkGroup]) groupIdMap[copy.linkGroup] = 'grp-' + uid();
      copy.linkGroup = groupIdMap[copy.linkGroup];
    }
    if(offset){
      if(copy.kind === 'rect'){ copy.x += offset; copy.y += offset; }
      else if(copy.kind === 'circle' || copy.kind === 'ellipse'){ copy.cx += offset; copy.cy += offset; }
      else if(copy.kind === 'path'){
        for(const sp of copy.pathModel.subpaths){
          for(const a of sp.anchors){
            a.x += offset; a.y += offset;
            if(a.inX != null){ a.inX += offset; a.inY += offset; }
            if(a.outX != null){ a.outX += offset; a.outY += offset; }
          }
        }
      }
    }
    return copy;
  });
  // "Paste here" from the right-click menu: recenter the whole pasted group
  // on the clicked point instead of the default offset/as-is placement.
  if(targetPoint){
    const combined = combinedBounds(copies);
    const dx = targetPoint.x - (combined.x + combined.w/2), dy = targetPoint.y - (combined.y + combined.h/2);
    copies.forEach(copy=>{
      if(copy.kind === 'rect'){ copy.x += dx; copy.y += dy; }
      else if(copy.kind === 'circle' || copy.kind === 'ellipse'){ copy.cx += dx; copy.cy += dy; }
      else if(copy.kind === 'path'){
        for(const sp of copy.pathModel.subpaths){
          for(const a of sp.anchors){
            a.x += dx; a.y += dy;
            if(a.inX != null){ a.inX += dx; a.inY += dy; }
            if(a.outX != null){ a.outX += dx; a.outY += dy; }
          }
        }
      }
    });
  }
  icon.elements.push(...copies);
  state.selectedElId = copies[copies.length - 1].id;
  state.selectedAnchor = null;
  state.linkSelectIds.clear();
  markDirty(state.currentKey); snapshot(); renderAll();
  showToast(`Вставлено: ${copies.length} ${pluralShapes(copies.length)}`);
}

function duplicateSelected(){
  const icon = currentIcon();
  const el = icon.elements.find(x => x.id === state.selectedElId);
  if(!el) return;
  // If the selected shape is part of a linked group, duplicate the whole
  // group together (same offset for every member, so relative positions are
  // preserved) and link the copies to each other — not to the originals.
  const groupEls = el.linkGroup ? icon.elements.filter(x => x.linkGroup === el.linkGroup) : [el];
  const newGroupId = groupEls.length > 1 ? ('grp-' + uid()) : null;
  const offset = 1.5;
  const copies = groupEls.map(orig=>{
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = uid();
    copy.linkGroup = newGroupId;
    if(copy.kind === 'rect'){ copy.x += offset; copy.y += offset; }
    else if(copy.kind === 'circle' || copy.kind === 'ellipse'){ copy.cx += offset; copy.cy += offset; }
    else if(copy.kind === 'path'){
      for(const sp of copy.pathModel.subpaths){
        for(const a of sp.anchors){
          a.x += offset; a.y += offset;
          if(a.inX != null){ a.inX += offset; a.inY += offset; }
          if(a.outX != null){ a.outX += offset; a.outY += offset; }
        }
      }
    }
    return copy;
  });
  icon.elements.push(...copies);
  // Re-select whichever copy corresponds to the shape that was actually
  // selected, so duplicating one member of a group still focuses the right one.
  const matchIdx = groupEls.findIndex(x=>x.id===el.id);
  state.selectedElId = (copies[matchIdx] || copies[0]).id;
  state.selectedAnchor = null;
  markDirty(state.currentKey); snapshot(); renderAll();
}

/* ---------------- center on canvas ---------------- */
function centerElementAxis(axis){
  const icon = currentIcon();
  const el = icon.elements.find(x => x.id === state.selectedElId);
  if(!el) return;
  const b = elementBounds(el);
  const target = 12; // center of the 24x24 safe zone
  const curCenter = axis === 'x' ? b.x + b.w/2 : b.y + b.h/2;
  const delta = target - curCenter;
  if(el.kind === 'rect'){ if(axis==='x') el.x += delta; else el.y += delta; }
  else if(el.kind === 'circle' || el.kind === 'ellipse'){ if(axis==='x') el.cx += delta; else el.cy += delta; }
  else if(el.kind === 'path'){
    for(const sp of el.pathModel.subpaths){
      for(const a of sp.anchors){
        if(axis==='x'){ a.x += delta; if(a.inX!=null) a.inX += delta; if(a.outX!=null) a.outX += delta; }
        else { a.y += delta; if(a.inY!=null) a.inY += delta; if(a.outY!=null) a.outY += delta; }
      }
    }
  }
  markDirty(state.currentKey); snapshot(); renderCanvas(); renderSidebar();
}

/* ---------------- flip horizontal / vertical ---------------- */
// Mirrors the selected shape (or its whole linked group, together, around
// their shared bounding box) left-right or top-bottom. A no-op for
// rect/circle/ellipse (they're already symmetric), but flips a path's
// anchors and their bezier handles for real.
function flipOneElement(el, axis, center){
  if(el.kind === 'rect'){
    if(axis === 'h') el.x = 2*center - el.x - el.width;
    else el.y = 2*center - el.y - el.height;
  } else if(el.kind === 'circle' || el.kind === 'ellipse'){
    if(axis === 'h') el.cx = 2*center - el.cx;
    else el.cy = 2*center - el.cy;
  } else if(el.kind === 'path'){
    for(const sp of el.pathModel.subpaths){
      for(const a of sp.anchors){
        if(axis === 'h'){
          a.x = 2*center - a.x;
          if(a.inX != null) a.inX = 2*center - a.inX;
          if(a.outX != null) a.outX = 2*center - a.outX;
        } else {
          a.y = 2*center - a.y;
          if(a.inY != null) a.inY = 2*center - a.inY;
          if(a.outY != null) a.outY = 2*center - a.outY;
        }
      }
    }
  }
}
// Right-click quick fill: one click sets the shape's fill straight to the
// "main" (currentColor) or "accent" (var(--marker-color)) role, skipping
// the property-panel dropdown entirely for the two colors you use 95% of
// the time.
// Reorders layers by dragging: moves srcId to sit just before (or after)
// targetId within icon.elements, preserving the same top-of-list ↔
// array-index correspondence the layers panel already renders with.
function reorderElement(srcId, targetId, insertBefore){
  const icon = currentIcon();
  const srcIdx = icon.elements.findIndex(x => x.id === srcId);
  if(srcIdx === -1) return;
  const [srcEl] = icon.elements.splice(srcIdx, 1);
  const targetIdx = icon.elements.findIndex(x => x.id === targetId);
  if(targetIdx === -1){ icon.elements.push(srcEl); }
  else { icon.elements.splice(insertBefore ? targetIdx : targetIdx + 1, 0, srcEl); }
  markDirty(state.currentKey); snapshot(); renderAll();
}

function quickFillSelected(role){
  const icon = currentIcon();
  const el = icon.elements.find(x => x.id === state.selectedElId);
  if(!el) return;
  el.fillRole = role;
  markDirty(state.currentKey); snapshot(); renderAll();
}

function flipSelected(axis){
  const icon = currentIcon();
  const el = icon.elements.find(x => x.id === state.selectedElId);
  if(!el) return;
  const groupEls = el.linkGroup ? icon.elements.filter(x => x.linkGroup === el.linkGroup) : [el];
  const b = combinedBounds(groupEls);
  const center = axis === 'h' ? b.x + b.w/2 : b.y + b.h/2;
  groupEls.forEach(gel => flipOneElement(gel, axis, center));
  markDirty(state.currentKey); snapshot(); renderCanvas(); renderRightPanel(); renderSidebar();
}

/* ---------------- arrow-key nudge ---------------- */
// Converts a distance in real on-screen CSS pixels to icon-space (viewBox)
// units, based on the canvas's actual current rendered size — so "1px" via
// arrow keys always means one pixel on your monitor, not one viewBox unit
// (those aren't the same: this canvas is 560 CSS px showing a 28-unit
// viewBox, i.e. ~20 screen px per icon unit).
function screenPxToIconUnits(px){
  const svg = document.getElementById('svgCanvas');
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  if(!rect.width || !vb.width) return px; // fallback if canvas isn't laid out yet
  return px * (vb.width / rect.width);
}

/* ---------------- canvas zoom ----------------
   Zoom only changes #svgCanvas's rendered CSS size (width/height); the
   viewBox stays fixed, so every coordinate helper above (getSvgPoint,
   screenPxToIconUnits) keeps working unchanged — they already read the
   canvas's live rendered size rather than assuming 560px. #canvasWrap is
   overflow:auto, so zooming in past the visible area just makes it
   scrollable. */
function fitBaseCanvas(){
  const wrap = document.getElementById('canvasWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(!w || !h) return;
  const base = Math.max(240, Math.min(900, Math.floor(Math.min(w, h) - 40)));
  if(base === BASE_CANVAS_PX) return;
  BASE_CANVAS_PX = base;
  const px = Math.round(base * state.zoom), svg = document.getElementById('svgCanvas');
  svg.setAttribute('width', px); svg.setAttribute('height', px);
}
window.addEventListener('resize', fitBaseCanvas);
function setZoom(newZoom, anchorClientX, anchorClientY){
  const svg = document.getElementById('svgCanvas');
  const wrap = document.getElementById('canvasWrap');
  const clamped = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, newZoom));
  if(clamped === state.zoom) return;

  // Keep whatever icon-space point is under the cursor (or the canvas
  // center, if no cursor position given) fixed on screen while zooming,
  // instead of always zooming toward the top-left corner.
  const wrapRect = wrap.getBoundingClientRect();
  const cx = anchorClientX != null ? anchorClientX : wrapRect.left + wrapRect.width/2;
  const cy = anchorClientY != null ? anchorClientY : wrapRect.top + wrapRect.height/2;
  const before = getSvgPoint({ clientX:cx, clientY:cy });

  state.zoom = clamped;
  const px = Math.round(BASE_CANVAS_PX * state.zoom);
  svg.setAttribute('width', px);
  svg.setAttribute('height', px);

  const after = getSvgPoint({ clientX:cx, clientY:cy });
  const svgRect = svg.getBoundingClientRect();
  const scale = svgRect.width / svg.viewBox.baseVal.width;
  wrap.scrollLeft += (before.x - after.x) * scale;
  wrap.scrollTop  += (before.y - after.y) * scale;

  renderZoomLabel();
}
function zoomBy(factor, anchorClientX, anchorClientY){ setZoom(state.zoom * factor, anchorClientX, anchorClientY); }
function resetZoom(){ setZoom(1); }
function renderZoomLabel(){
  const el = document.getElementById('zoomLabel');
  if(el) el.textContent = Math.round(state.zoom * 100) + '%';
}

function nudgeSelected(dx, dy){
  const icon = currentIcon();
  if(state.selectedAnchor && state.selectedAnchor.part === 'anchor'){
    const el = icon.elements.find(x => x.id === state.selectedElId);
    if(el && el.kind === 'path'){
      const a = el.pathModel.subpaths[state.selectedAnchor.subpathIdx].anchors[state.selectedAnchor.anchorIdx];
      a.x += dx; a.y += dy;
      if(a.inX != null){ a.inX += dx; a.inY += dy; }
      if(a.outX != null){ a.outX += dx; a.outY += dy; }
      markDirty(state.currentKey); snapshot(); renderCanvas();
      return;
    }
  }
  const el = icon.elements.find(x => x.id === state.selectedElId);
  if(!el) return;
  const groupEls = el.linkGroup ? icon.elements.filter(x => x.linkGroup === el.linkGroup) : [el];
  groupEls.forEach(gEl => translateElement(gEl, JSON.parse(JSON.stringify(gEl)), dx, dy));
  markDirty(state.currentKey); snapshot(); renderCanvas(); renderSidebar();
}
function deleteSelected(){
  const icon = currentIcon();
  if(state.selectedAnchor && state.selectedAnchor.part === 'anchor'){
    const el = icon.elements.find(x => x.id === state.selectedElId);
    if(el && el.kind === 'path'){
      const sp = el.pathModel.subpaths[state.selectedAnchor.subpathIdx];
      if(sp){
        sp.anchors.splice(state.selectedAnchor.anchorIdx, 1);
        if(sp.anchors.length === 0) el.pathModel.subpaths.splice(state.selectedAnchor.subpathIdx, 1);
      }
      state.selectedAnchor = null;
      markDirty(state.currentKey); snapshot(); renderAll();
      return;
    }
  }
  if(state.selectedElId){
    icon.elements = icon.elements.filter(x => x.id !== state.selectedElId);
    state.linkSelectIds.delete(state.selectedElId);
    cleanupSingletonLinkGroups(icon);
    state.selectedElId = null; state.selectedAnchor = null;
    markDirty(state.currentKey); snapshot(); renderAll();
  }
}

/* ---------------- property panel bindings ---------------- */
function bindRightPanel(){
  const layersHeader = document.getElementById('layersHeader');
  if(layersHeader) layersHeader.addEventListener('click', ()=>{
    state.layersCollapsed = !state.layersCollapsed;
    renderRightPanel();
  });
  document.querySelectorAll('#elementList .elem-row').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('[data-del]')) return;
      const id = row.dataset.el;
      if(e.ctrlKey || e.metaKey){
        // Ctrl/Cmd+click toggles this shape in the link-building selection
        // without disturbing whatever's open in the property panel.
        if(state.linkSelectIds.has(id)) state.linkSelectIds.delete(id);
        else state.linkSelectIds.add(id);
        renderRightPanel();
        return;
      }
      selectElement(id);
    });
    row.addEventListener('contextmenu', (e)=>{
      e.preventDefault();
      openLayerContextMenu(e.clientX, e.clientY, row.dataset.el);
    });
  });

  // Drag-and-drop reordering of layers — grab any row (the ⠿ handle makes
  // the affordance obvious) and drop it above/below another to reorder.
  let dragSrcId = null;
  const rows = document.querySelectorAll('#elementList .elem-row');
  const clearDragMarkers = ()=> rows.forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
  rows.forEach(row=>{
    row.addEventListener('dragstart', (e)=>{
      dragSrcId = row.dataset.el;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragSrcId); // Firefox requires data to be set for drag to start
    });
    row.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      clearDragMarkers();
      dragSrcId = null;
    });
    row.addEventListener('dragover', (e)=>{
      if(!dragSrcId || row.dataset.el === dragSrcId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      row.classList.toggle('drag-over-top', before);
      row.classList.toggle('drag-over-bottom', !before);
    });
    row.addEventListener('dragleave', ()=>{
      row.classList.remove('drag-over-top','drag-over-bottom');
    });
    row.addEventListener('drop', (e)=>{
      e.preventDefault();
      const targetId = row.dataset.el;
      const before = row.classList.contains('drag-over-top');
      clearDragMarkers();
      if(dragSrcId && dragSrcId !== targetId) reorderElement(dragSrcId, targetId, before);
      dragSrcId = null;
    });
  });
  const linkSelBtn = document.getElementById('linkSelBtn');
  if(linkSelBtn) linkSelBtn.addEventListener('click', linkSelectedElements);
  const unlinkSelBtn = document.getElementById('unlinkSelBtn');
  if(unlinkSelBtn) unlinkSelBtn.addEventListener('click', unlinkSelectedElements);
  const clearLinkSelBtn = document.getElementById('clearLinkSelBtn');
  if(clearLinkSelBtn) clearLinkSelBtn.addEventListener('click', ()=>{ state.linkSelectIds.clear(); renderRightPanel(); });
  const unlinkOneBtn = document.getElementById('unlinkOneBtn');
  if(unlinkOneBtn) unlinkOneBtn.addEventListener('click', ()=>{
    const icon = currentIcon();
    const el = icon.elements.find(x=>x.id===state.selectedElId);
    if(!el) return;
    unlinkGroupMember(icon, el.id);
    markDirty(state.currentKey); snapshot(); renderAll();
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const icon = currentIcon();
      icon.elements = icon.elements.filter(x => x.id !== btn.dataset.del);
      if(state.selectedElId === btn.dataset.del){ state.selectedElId = null; state.selectedAnchor = null; }
      state.linkSelectIds.delete(btn.dataset.del);
      cleanupSingletonLinkGroups(icon);
      markDirty(state.currentKey); snapshot(); renderAll();
    });
  });
  const addShapeBtn = document.getElementById('addShapeBtn');
  if(addShapeBtn) addShapeBtn.addEventListener('click', ()=>{
    state.shapePickerOpen = !state.shapePickerOpen;
    renderRightPanel();
  });
  const shapeOverlay = document.getElementById('shapePickerOverlay');
  if(shapeOverlay) shapeOverlay.addEventListener('click', ()=>{
    state.shapePickerOpen = false;
    renderRightPanel();
  });
  document.querySelectorAll('.shape-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.shape;
      state.shapePickerOpen = false;
      const def = SHAPE_LIBRARY.find(s => s.key === key);
      if(!def) return;
      if(key === 'path'){ toggleAddPointMode(); return; }
      const icon = currentIcon();
      const el = def.make();
      icon.elements.push(el);
      state.selectedElId = el.id;
      markDirty(state.currentKey); snapshot(); renderAll();
    });
  });
  const addPointBtn = document.getElementById('addPointModeBtn');
  if(addPointBtn) addPointBtn.addEventListener('click', toggleAddPointMode);
  const delAnchorBtn = document.getElementById('deleteAnchorBtn');
  if(delAnchorBtn) delAnchorBtn.addEventListener('click', deleteSelected);
  const delElBtn = document.getElementById('deleteElBtn');
  if(delElBtn) delElBtn.addEventListener('click', deleteSelected);
  const dupBtn = document.getElementById('duplicateElBtn');
  if(dupBtn) dupBtn.addEventListener('click', duplicateSelected);
  const centerXBtn = document.getElementById('centerXBtn');
  if(centerXBtn) centerXBtn.addEventListener('click', ()=> centerElementAxis('x'));
  const centerYBtn = document.getElementById('centerYBtn');
  if(centerYBtn) centerYBtn.addEventListener('click', ()=> centerElementAxis('y'));
  const flipHBtn = document.getElementById('flipHBtn');
  if(flipHBtn) flipHBtn.addEventListener('click', ()=> flipSelected('h'));
  const flipVBtn = document.getElementById('flipVBtn');
  if(flipVBtn) flipVBtn.addEventListener('click', ()=> flipSelected('v'));

  document.querySelectorAll('#rightPanel [data-prop]').forEach(input=>{
    const evtName = input.tagName === 'SELECT' || input.type === 'color' ? 'input' : 'input';
    input.addEventListener(evtName, ()=>{
      const icon = currentIcon();
      const el = icon.elements.find(x => x.id === state.selectedElId);
      if(!el) return;
      const prop = input.dataset.prop;
      let val = input.value;
      if(input.type === 'number') val = parseFloat(val);
      el[prop] = val;
      renderCanvas();
      // role selects change which extra fields should show (e.g. custom color
      // picker, stroke width) — those need a full property-panel re-render.
      if(prop === 'fillRole' || prop === 'strokeRole'){ renderRightPanel(); }
    });
    input.addEventListener('change', ()=>{
      if(input.dataset.prop === 'transform'){ const e2 = currentIcon().elements.find(x=>x.id===state.selectedElId); if(e2 && bakeRotation(e2)){ renderCanvas(); renderRightPanel(); } }
      markDirty(state.currentKey); snapshot(); renderSidebar(); renderTopbar();
    });
  });
}

/* ---------------- сохранение: marker-icons.js собирается целиком из каталога ---------------- */
const CAT_HEADER = `// ============================================================
// Библиотека значков карты: названия, категории, цвета и сама графика.
// Подключается и в Мастерской (index.html), и в Столе картографа.
// Не правьте вручную — файл собирает и сохраняет icon-editor.html.
// ============================================================
`;
const jsq = s => "'" + String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'") + "'";
const jsKey = k => /^[A-Za-z_$][\w$]*$/.test(k) ? k : jsq(k);
function currentSvgOf(k){
  const ic = library[k];
  return (ic.dirty || !MARKER_SVG[k]) ? iconToSvgString(ic) : MARKER_SVG[k];
}
function bucketedCategories(){
  const buckets = {}; MARKER_ICON_CATEGORIES.forEach(c=>{ buckets[c.key] = []; });
  const fb = MARKER_ICON_CATEGORIES[MARKER_ICON_CATEGORIES.length-1].key;
  ALL_KEYS.forEach(k=>{ const c = library[k].category; buckets[buckets[c] ? c : fb].push(k); });
  return buckets;
}
function buildCatalogText(){
  const buckets = bucketedCategories();
  const colors = ALL_KEYS.map(k=>`  ${jsKey(k)}:${jsq(library[k].color || MARKER_COLORS.other || 'var(--gray)')},`);
  if(!ALL_KEYS.includes('other') && MARKER_COLORS.other) colors.push(`  other:${jsq(MARKER_COLORS.other)},`);
  const svgs = ALL_KEYS.map(k=>'  ' + jsKey(k) + ': `' + currentSvgOf(k).replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$\{/g,'\\${') + '`,');
  return CAT_HEADER + '\n' + [
    'let MARKER_ICONS = [\n' + ALL_KEYS.map(k=>`  [${jsq(k)},${jsq(library[k].label)}],`).join('\n') + '\n];',
    'let MARKER_ICON_LABELS = Object.fromEntries(MARKER_ICONS);',
    'let MARKER_ICON_CATEGORIES = [\n' + MARKER_ICON_CATEGORIES.map(c=>`  { key:${jsq(c.key)}, label:${jsq(c.label)}, icons:[${buckets[c.key].map(jsq).join(',')}] },`).join('\n') + '\n];',
    "let MARKER_ICON_TO_CATEGORY = {};\nMARKER_ICON_CATEGORIES.forEach(cat=>{ cat.icons.forEach(key=>{ MARKER_ICON_TO_CATEGORY[key] = cat.key; }); });\nfunction iconCategoryOf(iconKey){ return MARKER_ICON_TO_CATEGORY[iconKey] || 'other'; }",
    'let MARKER_COLORS = {\n' + colors.join('\n') + '\n};',
    'let MARKER_SVG = {\n' + svgs.join('\n') + '\n};',
    '// старые ключи значков → актуальные (для карт, сохранённых раньше)\nlet LEGACY_MARKER_ICONS = ' + JSON.stringify(LEGACY_MARKER_ICONS || {}) + ';',
  ].join('\n\n') + '\n';
}
function downloadText(text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/javascript'}));
  a.download = 'marker-icons.js';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
async function saveAll(){
  if(state.drawing) finishDrawing();
  const text = buildCatalogText();
  // проверка: собранный файл должен читаться и содержать все значки — иначе ничего не пишем
  let back;
  try{ back = parseCatalogText(text); }catch(e){ back = null; }
  if(!back || !back.S || Object.keys(back.S).length !== ALL_KEYS.length || back.I.length !== ALL_KEYS.length){
    alert('Не удалось собрать корректный marker-icons.js — ничего не записано. Ваши правки остались в редакторе.');
    return;
  }
  let how = '';
  try{
    if(!state.fileHandle && window.showSaveFilePicker){
      state.fileHandle = await window.showSaveFilePicker({ suggestedName:'marker-icons.js', types:[{ description:'marker-icons.js', accept:{'text/javascript':['.js']} }] });
    }
    if(state.fileHandle){
      const w = await state.fileHandle.createWritable(); await w.write(text); await w.close();
      how = 'Записано в ' + state.fileHandle.name;
    } else { downloadText(text); how = 'Скачан marker-icons.js — положите его в папку проекта вместо старого'; }
  }catch(e){
    if(e && e.name === 'AbortError') return;
    state.fileHandle = null; downloadText(text); how = 'Прямая запись не вышла — скачан marker-icons.js';
  }
  // после сохранения редактор считает сохранённое состояние «чистым»
  ALL_KEYS.forEach(k=>{ MARKER_SVG[k] = currentSvgOf(k); library[k].dirty = false; });
  const buckets = bucketedCategories();
  MARKER_ICON_CATEGORIES.forEach(c=>{ c.icons = buckets[c.key]; });
  MARKER_ICON_TO_CATEGORY = {}; MARKER_ICON_CATEGORIES.forEach(c=>c.icons.forEach(k=>{ MARKER_ICON_TO_CATEGORY[k] = c.key; }));
  MARKER_ICONS = ALL_KEYS.map(k=>[k, library[k].label]); MARKER_ICON_LABELS = Object.fromEntries(MARKER_ICONS);
  state.structureDirty = false;
  persistLocal(); renderAll();
  flashSaveStatus(how);
}

const SIDEBAR_MIN_WIDTH = 125;
const SIDEBAR_MAX_WIDTH = 340;
function initSidebarResize(){
  const sidebar = document.getElementById('sidebar');
  const handle = document.getElementById('sidebarResizeHandle');
  const saved = Number(localStorage.getItem('icon-editor-sidebar-width'));
  if(saved && saved >= SIDEBAR_MIN_WIDTH && saved <= SIDEBAR_MAX_WIDTH) sidebar.style.width = saved + 'px';
  handle.addEventListener('mousedown', (e)=>{
    e.preventDefault();
    const startX = e.clientX;
    const startWidth = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const move = (ev)=>{
      const w = Math.min(SIDEBAR_MAX_WIDTH, Math.max(SIDEBAR_MIN_WIDTH, startWidth + (ev.clientX - startX)));
      sidebar.style.width = w + 'px';
    };
    const up = ()=>{
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      handle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      localStorage.setItem('icon-editor-sidebar-width', Math.round(sidebar.getBoundingClientRect().width));
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

function mergeWithNeighbor(elId, neighborId){
  if(!neighborId) return;
  const icon = currentIcon();
  const primary = icon.elements.find(e=>e.id===elId);
  const secondary = icon.elements.find(e=>e.id===neighborId);
  if(!primary || !secondary) return;
  const merged = mergeElements(primary, secondary, icon);
  state.selectedElId = merged.id;
  state.selectedAnchor = null;
  markDirty(state.currentKey); snapshot(); renderAll();
}
function closeLayerContextMenu(){
  state.layerContextMenu = null;

  closeContextMenu();
  closeLayerContextMenu();
  selectElement(elId);
  const icon = currentIcon();
  const idx = icon.elements.findIndex(e=>e.id===elId);
  const aboveEl = idx > 0 ? icon.elements[idx-1] : null;
  const belowEl = idx >= 0 && idx < icon.elements.length-1 ? icon.elements[idx+1] : null;
  state.layerContextMenu = { x:clientX, y:clientY, elId, aboveId: aboveEl?aboveEl.id:null, belowId: belowEl?belowEl.id:null };
  renderLayerContextMenu();
}

    <div class="ctx-item" data-act="linkDown" ${cm.belowId?'':'disabled'}>⬇ Связать с нижним слоем</div>
  `;
  document.body.appendChild(menu);

  bind('[data-act="linkUp"]', cm.aboveId, ()=> linkElementIds([cm.elId, cm.aboveId]));

function positionFloatingMenu(node, x, y){
  node.style.left = x + 'px';
  node.style.top = y + 'px';
  requestAnimationFrame(()=>{
    const r = node.getBoundingClientRect();
    let nx = x, ny = y;
    if(r.right > window.innerWidth - 6) nx = Math.max(6, window.innerWidth - r.width - 6);
    if(r.bottom > window.innerHeight - 6) ny = Math.max(6, window.innerHeight - r.height - 6);
    node.style.left = nx + 'px';
    node.style.top = ny + 'px';
  });
}

    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if(e.key === 'Escape' && state.contextMenu){ closeContextMenu(); return; }
    if(state.drawing && (e.key === 'Enter' || e.key === 'Escape')){ finishDrawing(); return; }
    if(typing) return;
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase()==='z' && e.shiftKey))){ e.preventDefault(); redo(); return; }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd'){ e.preventDefault(); duplicateSelected(); return; }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c'){ e.preventDefault(); copySelection(); return; }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v'){ e.preventDefault(); pasteClipboard(null); return; }
    if((e.key === 'Delete' || e.key === 'Backspace') && (state.selectedElId || state.selectedAnchor)){ e.preventDefault(); deleteSelected(); return; }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveAll(); return; }
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key) && (state.selectedElId || state.selectedAnchor)){
      e.preventDefault();
      const onePx = screenPxToIconUnits(1);
      const step = e.altKey ? onePx * 0.1 : e.shiftKey ? onePx * 10 : onePx;
      const dx = e.key==='ArrowLeft' ? -step : e.key==='ArrowRight' ? step : 0;
      const dy = e.key==='ArrowUp' ? -step : e.key==='ArrowDown' ? step : 0;
      nudgeSelected(dx, dy);
      return;
    }
    if((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')){ e.preventDefault(); zoomBy(1.25); return; }
    if((e.ctrlKey || e.metaKey) && e.key === '-'){ e.preventDefault(); zoomBy(1/1.25); return; }
    if((e.ctrlKey || e.metaKey) && e.key === '0'){ e.preventDefault(); resetZoom(); return; }
  });

  document.getElementById('zoomInBtn').addEventListener('click', ()=> zoomBy(1.25));
  document.getElementById('zoomOutBtn').addEventListener('click', ()=> zoomBy(1/1.25));
  document.getElementById('zoomResetBtn').addEventListener('click', resetZoom);
  document.getElementById('canvasWrap').addEventListener('wheel', (e)=>{
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0015);
    zoomBy(factor, e.clientX, e.clientY);
  }, { passive:false });
  renderZoomLabel();

  if(!state.history[state.currentKey]) snapshot();
  renderAll();
}

document.addEventListener('DOMContentLoaded', initEditor);

</script>
</body>
</html>
