<meta name="apple-mobile-web-app-title" content="Мастерская">
<meta name="description" content="Инструмент для управления большими историями: персонажи, связи, структура сюжета, таймлайн и лор.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<div id="authGate">
  <section class="auth-card">
    <div class="auth-brand"><span class="mark">✦</span><h1>Мастерская миров</h1></div>
    <p class="auth-subtitle">Войди, чтобы открыть свои проекты и синхронизировать их между устройствами.</p>
    <div id="authSetupWarning" hidden>Сначала укажи адрес проекта Supabase и публичный anon-ключ в настройках в начале скрипта. Секретный service_role-ключ здесь использовать нельзя.</div>
    <form id="authForm">
      <div class="field"><label for="authEmail">Электронная почта</label><input id="authEmail" type="email" autocomplete="email" required placeholder="name@example.com"></div>
      <div class="field"><label for="authPassword">Пароль</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="Не менее 6 символов"></div>
      <div class="auth-actions">
        <button id="authSubmitBtn" class="btn btn-primary" type="submit">Войти</button>
        <button id="authSignUpBtn" class="btn" type="button">Создать аккаунт</button>
      </div>
    </form>
    <div id="authMessage" role="status" aria-live="polite"></div>
  </section>
</div>
<div id="app" hidden>
  <div id="sidebar">
    <div class="sidebar-row">
      <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.2c0 0 3-1.4 6.3-1.4 2 0 3.2.9 3.2.9v14.6c0 0-1.2-.8-3.2-.8-3.3 0-6.3 1.3-6.3 1.3V5.2Z"/><path d="M21.5 5.2c0 0-3-1.4-6.3-1.4-2 0-3.2.9-3.2.9v14.6c0 0 1.2-.8 3.2-.8 3.3 0 6.3 1.3 6.3 1.3V5.2Z"/><path d="M12 4.7v14.6" stroke-width="1" opacity="0.5"/></svg></span><h1>Мастерская миров</h1></div>
      <div id="globalSearchWrap">
        <input type="text" id="globalSearch" placeholder="Искать по всем проектам…">
        <label id="searchScopeToggle">
          <input type="checkbox" id="searchScopeCheck">
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="tip" id="searchScopeTip">Ограничить поиск текущим проектом</span>
        </label>
        <div id="searchResults"></div>
      </div>
      <div id="activeProjectChip"></div>
      <div style="display:flex; align-items:center; gap:8px; margin-left:auto;">
        <div id="settingsSection">
          <button id="settingsToggle" type="button" aria-label="Настройки аккаунта" aria-expanded="false" title="Настройки">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.09 4.33 L10.37 1.73 L13.63 1.73 L13.91 4.33 A7.90 7.90 0 0 1 16.07 5.23 L18.11 3.59 L20.41 5.89 L18.77 7.93 A7.90 7.90 0 0 1 19.67 10.09 L22.27 10.37 L22.27 13.63 L19.67 13.91 A7.90 7.90 0 0 1 18.77 16.07 L20.41 18.11 L18.11 20.41 L16.07 18.77 A7.90 7.90 0 0 1 13.91 19.67 L13.63 22.27 L10.37 22.27 L10.09 19.67 A7.90 7.90 0 0 1 7.93 18.77 L5.89 20.41 L3.59 18.11 L5.23 16.07 A7.90 7.90 0 0 1 4.33 13.91 L1.73 13.63 L1.73 10.37 L4.33 10.09 A7.90 7.90 0 0 1 5.23 7.93 L3.59 5.89 L5.89 3.59 L7.93 5.23 A7.90 7.90 0 0 1 10.09 4.33 Z"/><circle cx="12" cy="12" r="3.2"/></svg>
          </button>
          <div id="settingsPanel" aria-label="Настройки аккаунта">
            <div id="accountEmail" title="Аккаунт"></div>
            <div class="settings-divider"></div>
            <div class="settings-label">Резервная копия на компьютер</div>
            <button id="exportAllBtn" class="btn btn-sm" style="width:100%;" title="Скачать файл со всеми проектами">⭳ Скачать все проекты</button>
            <button id="exportProjectBtn" class="btn btn-sm" style="width:100%;" title="Скачать файл с текущим проектом">⭳ Скачать текущий проект</button>
            <button id="importBtn" class="btn btn-sm" style="width:100%;" title="Загрузить проект или все данные из файла">⭱ Загрузить из файла</button>
            <input type="file" id="importFile" accept="application/json" style="display:none;">
            <div class="settings-divider"></div>
            <button id="signOutBtn" class="btn btn-sm settings-signout" type="button" title="Выйти из аккаунта">Выйти из аккаунта</button>
          </div>
        </div>
        <button id="sidebarToggle" onclick="toggleSidebar()" title="Свернуть панель">▴</button>
      </div>
    </div>
    <div id="projectsRow">
      <div id="projectList"></div>
      <button id="newProjectBtn" title="Новый проект">+</button>
      <button id="projectsExpandBtn" type="button" hidden aria-expanded="false" title="Показать все проекты"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 5 5 5-5M7 13l5 5 5-5"/></svg></button>
    </div>
  </div>
  <div id="main"></div>
</div>

<div id="modalOverlay"><div id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
