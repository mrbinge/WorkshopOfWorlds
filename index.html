<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мастерская миров</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14151b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мастерская">
<meta name="description" content="Инструмент для управления большими историями: персонажи, связи, структура сюжета, таймлайн и лор.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Kelly+Slab&family=Marck+Script&family=Pattaya&family=Bad+Script&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authGate">
  <section class="auth-card">
    <div class="auth-brand"><span class="mark">✦</span><h1>Мастерская миров</h1></div>
    <p class="auth-subtitle">Войди, чтобы открыть свои проекты и синхронизировать их между устройствами.</p>
    <div id="authSetupWarning" hidden>Сначала укажи адрес проекта Supabase и публичный anon-ключ в настройках в начале скрипта. Секретный service_role-ключ здесь использовать нельзя.</div>
    <form id="authForm">
      <div class="field"><label for="authEmail">Электронная почта</label><input id="authEmail" type="email" autocomplete="email" required placeholder="name@example.com"></div>
      <div class="field"><label for="authPassword">Пароль</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="Не менее 6 символов"></div>
      <div class="auth-actions">
        <button id="authSubmitBtn" class="btn btn-primary" type="submit">Войти</button>
        <button id="authSignUpBtn" class="btn" type="button">Создать аккаунт</button>
      </div>
    </form>
    <div id="authMessage" role="status" aria-live="polite"></div>
  </section>
</div>
<div id="app" hidden>
  <div id="sidebar">
    <div class="sidebar-row">
      <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.2c0 0 3-1.4 6.3-1.4 2 0 3.2.9 3.2.9v14.6c0 0-1.2-.8-3.2-.8-3.3 0-6.3 1.3-6.3 1.3V5.2Z"/><path d="M21.5 5.2c0 0-3-1.4-6.3-1.4-2 0-3.2.9-3.2.9v14.6c0 0 1.2-.8 3.2-.8 3.3 0 6.3 1.3 6.3 1.3V5.2Z"/><path d="M12 4.7v14.6" stroke-width="1" opacity="0.5"/></svg></span><h1>Мастерская миров</h1></div>
      <div id="globalSearchWrap">
        <input type="text" id="globalSearch" placeholder="Искать по всем проектам…">
        <label id="searchScopeToggle">
          <input type="checkbox" id="searchScopeCheck">
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="tip" id="searchScopeTip">Ограничить поиск текущим проектом</span>
        </label>
        <div id="searchResults"></div>
      </div>
      <div id="activeProjectChip"></div>
      <div style="display:flex; align-items:center; gap:8px; margin-left:auto;">
        <div id="dataSection">
          <button id="dataToggle" title="Данные — бэкап и восстановление">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          </button>
          <div id="dataPanel">
            <button id="exportBtn" class="btn btn-sm" style="width:100%;">⭳ Скачать бэкап</button>
            <button id="importBtn" class="btn btn-sm" style="width:100%;">⭱ Восстановить из файла</button>
            <input type="file" id="importFile" accept="application/json" style="display:none;">
          </div>
        </div>
        <div id="accountControls" title="Аккаунт Supabase">
          <span id="accountEmail"></span>
          <button id="signOutBtn" class="btn btn-sm" type="button" title="Выйти из аккаунта">Выйти</button>
        </div>
        <button id="sidebarToggle" onclick="toggleSidebar()" title="Свернуть панель">▴</button>
      </div>
    </div>
    <div id="projectsRow">
      <div id="projectList"></div>
      <button id="newProjectBtn" title="Новый проект">+</button>
    </div>
  </div>
  <div id="main"></div>
</div>

<div id="modalOverlay"><div id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
