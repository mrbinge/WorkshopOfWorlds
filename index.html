<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мастерская миров</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14151b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мастерская">
<meta name="description" content="Инструмент для управления большими историями: персонажи, связи, структура сюжета, таймлайн и лор.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14151b;
    --bg-alt:#1a1c24;
    --card:#1f222c;
    --card-hover:#262a36;
    --border:#33384a;
    --border-soft:#2a2e3a;
    --text:#e9e4d8;
    --text-dim:#9a9fb0;
    --text-faint:#5f6478;
    --thread:#c1443b;
    --gold:#c9a24c;
    --teal:#5fa8a0;
    --rose:#b5698f;
    --violet:#8c7ec9;
    --gray:#7a7f92;
    --manga-color:#5fa8a0;
    --roman-color:#c9a24c;
    --other-color:#8c7ec9;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(193,68,59,0.05), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(95,168,160,0.04), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--thread); color:#fff;}

  /* Custom scrollbars — dark track, gold thumb, no native gray arrow buttons */
  *{ scrollbar-width:thin; scrollbar-color:var(--border) var(--bg-alt); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg-alt); }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; border:2px solid var(--bg-alt); background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--gold); }
  ::-webkit-scrollbar-corner{ background:var(--bg-alt); }
  ::-webkit-scrollbar-button{ display:none; width:0; height:0; }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; color:var(--text); background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius); padding:9px 11px; font-size:14px; outline:none; transition:border-color .15s;}
  input:focus,textarea:focus,select:focus{border-color:var(--thread);}
  textarea{resize:vertical; min-height:70px; line-height:1.5;}
  h1,h2,h3,h4{font-family:'Spectral', serif; font-weight:600; margin:0;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint);}

  /* Layout */
  #app{display:flex; flex-direction:column; min-height:100vh;}
  #sidebar{
    width:100%; flex-shrink:0; background:var(--bg-alt);
    display:flex; flex-direction:column; padding:14px 32px 0 32px; gap:12px; position:sticky; top:0; z-index:30;
    transition:padding .18s ease;
  }
  .sidebar-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap; border-bottom:1px solid var(--border-soft); padding-bottom:12px;}
  #sidebarToggle{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    background:var(--card); border:1px solid var(--border); color:var(--text-dim); font-size:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; margin-left:auto;
  }
  #sidebarToggle:hover{ color:var(--text); border-color:var(--text-faint); }
  #sidebar.collapsed{ padding:10px 32px 0 32px; gap:0; }
  #sidebar.collapsed .brand h1,
  #sidebar.collapsed #globalSearchWrap,
  #sidebar.collapsed #dataSection,
  #sidebar.collapsed #projectsRow{ display:none; }
  #activeProjectChip{ display:none; align-items:center; gap:8px; flex:1; min-width:0; overflow:hidden; }
  #sidebar.collapsed #activeProjectChip{ display:flex; }
  #activeProjectChip .p-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  #main{flex:1; min-width:0; padding:34px 42px 80px;}
  @media (max-width:900px){
    #sidebar{padding:12px 16px 0 16px;}
    #sidebar.collapsed{padding:8px 16px 0 16px;}
    #main{padding:22px 16px 60px;}
  }

  /* Sidebar */
  .brand{display:flex; align-items:center; gap:9px; flex-shrink:0; padding-right:16px; border-right:1px solid var(--border-soft);}
  .brand h1{font-size:17px; letter-spacing:.01em; white-space:nowrap;}
  .brand .mark{color:var(--gold); display:flex; align-items:center;}
  #globalSearchWrap{position:relative; flex:1; min-width:160px; max-width:420px;}
  #globalSearch{width:100%;}
  #searchResults{position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); max-height:360px; overflow-y:auto; z-index:50; display:none;}
  #searchResults.show{display:block;}
  .search-hit{padding:9px 12px; border-bottom:1px solid var(--border-soft); font-size:13px; display:flex; flex-direction:column; gap:2px;}
  .search-hit:last-child{border-bottom:none;}
  .search-hit:hover{background:var(--card-hover); cursor:pointer;}
  .search-hit .hit-name{color:var(--text); font-weight:600;}
  .search-hit .hit-meta{color:var(--text-faint); font-size:11px;}
  .search-empty{padding:12px; font-size:12.5px; color:var(--text-faint);}

  #dataSection{position:relative; flex-shrink:0;}
  #dataToggle{
    width:26px; height:26px; padding:0; border-radius:50%;
    background:var(--card); border:1px solid var(--border); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #dataToggle:hover{ color:var(--text); border-color:var(--text-faint); }
  #dataPanel{position:absolute; top:calc(100% + 8px); right:0; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:10px; box-shadow:var(--shadow); display:none; flex-direction:column; gap:8px; min-width:210px; z-index:60;}
  #dataPanel.show{display:flex;}

  .side-section-label{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; margin-bottom:2px;}
  #projectsRow{display:flex; align-items:flex-end; gap:10px; min-width:0;}
  #projectList{display:flex; flex-direction:row; gap:8px; overflow-x:auto; flex:0 1 auto; min-width:0; max-width:100%; padding-bottom:2px;}
  #projectList::-webkit-scrollbar{height:5px;}
  #projectList::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
  .project-item{
    display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px 10px 0 0; cursor:pointer;
    border:1px solid var(--border-soft); border-bottom:3px solid var(--pcolor, var(--gray)); background:var(--bg);
    transition:background .15s, transform .15s, box-shadow .15s; flex-shrink:0; white-space:nowrap;
    position:relative; top:0;
  }
  .project-item:hover{background:var(--card-hover);}
  .project-item:not(.active):hover{ transform:translateY(-1px); }
  .project-item.active{
    background:var(--pcolor, var(--gray));
    border:1px solid var(--pcolor, var(--gray));
    border-radius:10px 10px 0 0;
    padding-top:16px;
    box-shadow:0 -4px 14px rgba(0,0,0,.3);
    z-index:5;
  }
  .project-item.active .p-name{ color:#14151b; }
  .project-item.active .p-type{ color:rgba(20,21,27,.65); }
  .project-item.active .p-dot{ background:rgba(20,21,27,.22) !important; color:#14151b; }
  .p-dot{width:22px; height:22px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#14151b;}
  .p-info{min-width:0;}
  .project-item .p-name{font-size:13px; font-weight:600; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .project-item .p-type{font-size:9px; font-family:'IBM Plex Mono',monospace; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
  #newProjectBtn{
    flex-shrink:0; width:38px; height:38px; padding:0; background:none; border:none;
    color:var(--text-faint); border-radius:8px; font-size:24px; font-weight:300; line-height:1;
    display:flex; align-items:center; justify-content:center; align-self:center;
  }
  #newProjectBtn:hover{background:var(--card-hover); color:var(--text);}

  .btn{border:1px solid var(--border); background:var(--card); color:var(--text); padding:9px 15px; border-radius:var(--radius); font-size:13px; font-weight:500; transition:all .15s;}
  .btn:hover{background:var(--card-hover); border-color:var(--text-faint);}
  .btn-primary{background:var(--thread); border-color:var(--thread); color:#fff;}
  .btn-primary:hover{background:#a83a32; border-color:#a83a32;}
  .btn-ghost{background:none; border:1px solid transparent; color:var(--text-dim); padding:6px 10px;}
  .btn-ghost:hover{color:var(--text); background:var(--card-hover);}
  .btn-danger{color:var(--thread); border-color:transparent; background:none;}
  .btn-danger:hover{background:rgba(193,68,59,0.12);}
  .btn-sm{padding:6px 10px; font-size:12px;}

  /* Empty state */
  .empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:100px 20px; color:var(--text-dim); gap:14px;}
  .empty-state .mark{color:var(--gold); display:flex; align-items:center; justify-content:center;}
  .empty-state h2{color:var(--text); font-size:22px;}
  .empty-state p{max-width:420px; font-size:14px; line-height:1.6; color:var(--text-dim);}

  /* Project header */
  #projectHeader{margin-bottom:26px;}
  #projectHeader .ph-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px;}
  #projectHeader h2{font-size:30px; color:var(--text);}
  .ph-avatar{
    width:52px; height:52px; border-radius:14px; flex-shrink:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center; font-family:'Spectral',serif; font-size:22px; font-weight:600; color:#14151b; margin-top:2px;
  }
  .ph-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  #projectHeader .ph-type{display:inline-block; margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--pcolor); border:1px solid var(--pcolor); padding:3px 8px; border-radius:2px;}
  #projectHeader .ph-desc{color:var(--text-dim); font-size:13.5px; margin-top:10px; max-width:640px; line-height:1.6;}

  #tabs{display:flex; gap:2px; border-bottom:1px solid var(--border-soft); margin-bottom:26px; flex-wrap:wrap;}
  .tab-btn{background:none; border:none; color:var(--text-faint); padding:11px 16px; font-size:13.5px; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab-btn:hover{color:var(--text-dim);}
  .tab-btn.active{color:var(--text); border-bottom-color:var(--thread);}

  /* Stat cards */
  .stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:30px;}
  .stat-card{background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 20px; min-width:120px;}
  .stat-card .num{font-family:'Spectral',serif; font-size:28px; font-weight:600;}
  .stat-card .label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; font-family:'IBM Plex Mono',monospace; margin-top:2px;}

  /* Grid + cards (dossier style) */
  .toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .toolbar input[type=text]{width:260px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:14px;}
  .dossier{
    background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px;
    position:relative; transition:border-color .15s, transform .15s;
  }
  .dossier:hover{border-color:var(--border); }
  .dossier.is-pinned{border-color:var(--gold); box-shadow:0 0 0 1px rgba(201,162,76,0.28);}
  .dossier[draggable="true"]{cursor:grab;}
  .dossier.dragging-card{opacity:.4;}
  .dossier.drag-over{border-color:var(--thread); box-shadow:0 0 0 2px rgba(193,68,59,0.25);}
  .project-item[draggable="true"]{cursor:grab;}
  .project-item.dragging-card{opacity:.4;}
  .project-item.drag-over{border-color:var(--thread); box-shadow:0 0 0 2px rgba(193,68,59,0.25);}
  .pin-btn{background:none; border:none; padding:3px; color:var(--text-faint); cursor:pointer; display:flex; align-items:center; border-radius:3px;}
  .pin-btn:hover{color:var(--gold); background:var(--bg-alt);}
  .pin-btn.pinned{color:var(--gold);}
  .dossier::before{
    content:''; position:absolute; top:-1px; left:16px; width:26px; height:6px; background:var(--gold);
    clip-path: polygon(0 0,100% 0,85% 100%,15% 100%); opacity:.85;
  }
  .dossier .d-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-top:6px;}
  .d-avatar{width:44px; height:44px; border-radius:50%; object-fit:cover; border:1px solid var(--border); flex-shrink:0; background:var(--bg-alt);}
  .d-avatar-placeholder{display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-faint);}
  .dossier h3{font-size:16.5px; margin-bottom:2px;}
  .dossier .d-alias{font-size:11.5px; color:var(--text-faint); font-style:italic;}
  .dossier .d-role{font-size:11px; color:var(--gold); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.05em; margin-top:6px;}
  .dossier .d-status{font-size:10px; padding:2px 7px; border-radius:10px; border:1px solid var(--border); color:var(--text-faint); white-space:nowrap; font-family:'IBM Plex Mono',monospace;}
  .status-alive{color:var(--teal); border-color:var(--teal);}
  .status-dead{color:var(--thread); border-color:var(--thread);}
  .dossier .d-desc{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin-top:10px; max-height:80px; overflow:hidden;}
  .d-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;}
  .d-tag{font-size:10px; background:var(--bg-alt); border:1px solid var(--border-soft); padding:2px 7px; border-radius:9px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace;}
  .d-actions{display:flex; gap:4px; margin-top:12px; padding-top:10px; border-top:1px solid var(--border-soft);}

  /* Timeline */
  #timelineList{position:relative; padding-left:26px; margin-top:6px;}
  #timelineList::before{content:''; position:absolute; left:6px; top:6px; bottom:6px; width:1px; background:linear-gradient(var(--border), var(--border-soft));}
  .tl-event{position:relative; padding-bottom:22px;}
  .tl-event::before{content:''; position:absolute; left:-26px; top:5px; width:9px; height:9px; border-radius:50%; background:var(--thread); box-shadow:0 0 0 3px var(--bg);}
  .tl-card{background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px;}
  .tl-card .tl-date{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); letter-spacing:.05em;}
  .tl-card h3{font-size:15.5px; margin-top:4px;}
  .tl-card .tl-arc{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; font-family:'IBM Plex Mono',monospace;}
  .tl-card .d-desc{max-height:none;}
  .tl-card .d-tags{margin-top:8px;}

  /* Relationship network canvas */
  #legend{display:flex; flex-wrap:wrap; gap:14px;}
  .legend-item{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim);}
  .legend-swatch{width:18px; height:3px; border-radius:1px;}
  .dim{opacity:.12;}
  #relCanvasViewport{
    position:relative; overflow:hidden; border:1px solid var(--border-soft); border-radius:var(--radius);
    background: radial-gradient(circle, var(--border-soft) 1px, transparent 1px) 0 0/22px 22px, var(--bg-alt);
    height:560px; cursor:grab; touch-action:none;
  }
  #relCanvasViewport.panning{cursor:grabbing;}
  #relCanvasInner{position:absolute; top:0; left:0; width:4000px; height:3000px; transform-origin:0 0;}
  #relEdgesSvg{position:absolute; top:0; left:0; pointer-events:none; overflow:visible;}
  .rel-edge{stroke-width:2.4; fill:none; cursor:pointer; pointer-events:stroke; transition:opacity .2s;}
  .rel-edge:hover{stroke-width:3.6;}
  .rel-node{position:absolute; width:84px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:grab; user-select:none; transition:opacity .2s;}
  .rel-node.dragging{cursor:grabbing; z-index:20;}
  .rel-avatar{width:52px; height:52px; border-radius:50%; overflow:hidden; border:2px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--text-dim); position:relative; box-shadow:var(--shadow);}
  .rel-avatar img{width:100%; height:100%; object-fit:cover;}
  .rel-name{font-size:11px; color:var(--text-dim); text-align:center; max-width:84px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rel-port{position:absolute; bottom:2px; right:10px; width:14px; height:14px; border-radius:50%; background:var(--gold); border:2px solid var(--bg-alt); cursor:crosshair;}
  .rel-port:hover{background:var(--thread);}

  /* World (locations/factions) */
  .world-section{margin-bottom:14px; border:1px solid var(--border-soft); border-radius:var(--radius); overflow:hidden;}
  .world-section h3{font-size:15px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-family:'IBM Plex Mono',monospace; margin-bottom:14px; font-weight:500;}
  .world-section-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; cursor:pointer; background:var(--bg-alt);}
  .world-section-head:hover{background:var(--card-hover);}
  .world-section-head-left{display:flex; align-items:center; gap:10px;}
  .world-section-chevron{color:var(--text-faint); transition:transform .18s; display:flex; flex-shrink:0;}
  .world-section.open .world-section-chevron{transform:rotate(90deg);}
  .world-section-title{font-size:13px; color:var(--text); text-transform:uppercase; letter-spacing:.08em; font-family:'IBM Plex Mono',monospace; font-weight:500;}
  .world-section-count{font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace;}
  .world-section-body{display:none; padding:18px 16px 20px;}
  .world-section.open .world-section-body{display:block;}
  .world-section-addbtn{position:relative; z-index:2;}

  /* Map (lore) */
  .map-dossier{cursor:pointer;}
  .map-thumb{width:100%; height:120px; border-radius:4px; background-size:cover; background-position:center; border:1px solid var(--border-soft); margin-bottom:2px; background-color:var(--bg-alt);}
  #mapViewport{position:relative; width:100%; border:1px solid var(--border-soft); border-radius:var(--radius); overflow:hidden; background:var(--bg-alt); cursor:crosshair;}
  .map-bg-img{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:fill; pointer-events:none; user-select:none;}
  #mapPathsSvg{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;}
  .map-marker{
    position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column;
    align-items:center; cursor:grab; user-select:none; z-index:5;
  }
  .map-marker:active{cursor:grabbing;}
  .map-marker-icon{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#14151b; background:var(--marker-color,var(--gold)); border:2px solid rgba(20,21,27,.82);
    box-shadow:0 3px 8px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.08);
    transition:transform .12s, box-shadow .12s;
  }
  .map-marker:hover .map-marker-icon{
    transform:scale(1.12); box-shadow:0 4px 12px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.14);
  }
  .map-marker-icon svg{width:19px; height:19px; display:block; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .map-marker-label{
    font-size:10.5px; color:#fff; background:rgba(20,21,27,.88); border:1px solid rgba(255,255,255,.08);
    padding:2px 7px; border-radius:8px; margin-top:3px; white-space:nowrap; max-width:150px;
    overflow:hidden; text-overflow:ellipsis; box-shadow:0 2px 5px rgba(0,0,0,.35);
  }
  .marker-card-icon{
    width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    background:var(--marker-color,var(--gold)); color:#14151b; flex-shrink:0; vertical-align:middle;
  }
  .marker-card-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* Structure canvas (node editor) */
  .canvas-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; flex-wrap:wrap;}
  .canvas-zoom-controls{display:flex; gap:4px; align-items:center;}
  #storyCanvasViewport{
    position:relative; overflow:hidden; border:1px solid var(--border-soft); border-radius:var(--radius);
    background: radial-gradient(circle, var(--border-soft) 1px, transparent 1px) 0 0/22px 22px, var(--bg-alt);
    height:620px; cursor:grab; touch-action:none;
  }
  #storyCanvasViewport.panning{cursor:grabbing;}
  #storyCanvasInner{position:absolute; top:0; left:0; width:4000px; height:3000px; transform-origin:0 0;}
  #edgesSvg{position:absolute; top:0; left:0; pointer-events:none; overflow:visible;}
  .scene-edge{stroke:var(--gold); stroke-width:2; fill:none; cursor:pointer; pointer-events:stroke;}
  .scene-edge:hover{stroke:var(--thread);}
  .temp-edge{stroke:var(--text-faint); stroke-width:1.6; stroke-dasharray:4 3; fill:none;}
  .scene-node{
    position:absolute; width:200px; background:var(--card); border:1px solid var(--border); border-radius:5px;
    box-shadow:var(--shadow); cursor:grab; user-select:none;
  }
  .scene-node.dragging{cursor:grabbing; z-index:20; box-shadow:0 12px 30px rgba(0,0,0,.45);}
  .scene-node .sn-head{padding:9px 10px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:7px;}
  .scene-node .sn-title{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
  .scene-node .sn-status{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .status-idea .sn-status{background:var(--violet);}
  .status-draft .sn-status{background:var(--gold);}
  .status-final .sn-status{background:var(--teal);}
  .scene-node .sn-body{padding:9px 12px; font-size:11.5px; color:var(--text-dim); line-height:1.5; max-height:56px; overflow:hidden;}
  .scene-node .sn-remove{background:none; border:none; color:var(--text-faint); font-size:15px; line-height:1; padding:0 2px; flex-shrink:0;}
  .scene-node .sn-remove:hover{color:var(--thread);}
  .port{position:absolute; top:50%; width:14px; height:14px; margin-top:-7px; border-radius:50%; background:var(--bg-alt); border:2px solid var(--gold); cursor:crosshair; z-index:5;}
  .port-out{right:-7px;}
  .port-in{left:-7px;}
  .port:hover{background:var(--gold);}

  /* Modal */
  #modalOverlay{position:fixed; inset:0; background:rgba(10,10,14,0.7); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:5vh 20px; overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none;}
  #modalOverlay::-webkit-scrollbar{ display:none; width:0; height:0; }
  #modalOverlay.show{display:flex;}
  #modalBox{background:var(--bg-alt); border:1px solid var(--border); border-radius:6px; width:100%; max-width:560px; padding:26px; box-shadow:var(--shadow);}
  #modalBox h2{font-size:20px; margin-bottom:18px;}
  .field{margin-bottom:14px; display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.05em;}
  .field input, .field textarea, .field select{width:100%;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  #modalActions{display:flex; justify-content:space-between; align-items:center; margin-top:20px;}

  .empty-tab{padding:50px 20px; text-align:center; color:var(--text-faint); font-size:13.5px;}
  .toast{position:fixed; bottom:22px; right:22px; background:var(--card); border:1px solid var(--border); padding:11px 16px; border-radius:var(--radius); font-size:13px; box-shadow:var(--shadow); z-index:200; opacity:0; transform:translateY(8px); transition:all .25s;}
  .toast.show{opacity:1; transform:translateY(0);}
  .highlight-flash{animation:flash 1.4s ease;}
  @keyframes flash{0%{box-shadow:0 0 0 2px var(--thread);} 100%{box-shadow:0 0 0 0 transparent;}}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sidebar-row">
      <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.2c0 0 3-1.4 6.3-1.4 2 0 3.2.9 3.2.9v14.6c0 0-1.2-.8-3.2-.8-3.3 0-6.3 1.3-6.3 1.3V5.2Z"/><path d="M21.5 5.2c0 0-3-1.4-6.3-1.4-2 0-3.2.9-3.2.9v14.6c0 0 1.2-.8 3.2-.8 3.3 0 6.3 1.3 6.3 1.3V5.2Z"/><path d="M12 4.7v14.6" stroke-width="1" opacity="0.5"/></svg></span><h1>Мастерская миров</h1></div>
      <div id="globalSearchWrap">
        <input type="text" id="globalSearch" placeholder="Искать по всем проектам…">
        <div id="searchResults"></div>
      </div>
      <div id="activeProjectChip"></div>
      <div style="display:flex; align-items:center; gap:8px; margin-left:auto;">
        <div id="dataSection">
          <button id="dataToggle" title="Данные — бэкап и восстановление">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          </button>
          <div id="dataPanel">
            <button id="exportBtn" class="btn btn-sm" style="width:100%;">⭳ Скачать бэкап</button>
            <button id="importBtn" class="btn btn-sm" style="width:100%;">⭱ Восстановить из файла</button>
            <input type="file" id="importFile" accept="application/json" style="display:none;">
          </div>
        </div>
        <button id="sidebarToggle" onclick="toggleSidebar()" title="Свернуть панель">▴</button>
      </div>
    </div>
    <div id="projectsRow">
      <div id="projectList"></div>
      <button id="newProjectBtn" title="Новый проект">+</button>
    </div>
  </div>
  <div id="main"></div>
</div>

<div id="modalOverlay"><div id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- DATA LAYER ---------------- */
const STORAGE_KEY = 'story-bible-data';
let data = { projects: [], characters: [], relationships: [], events: [], locations: [], factions: [], scenes: [], sceneLinks: [], creatures: [], myths: [], magicSystems: [], deities: [], maps: [] };
let state = { activeProjectId: null, activeTab: 'overview', graphSelected: null };
let canvasView = { pan:{x:120,y:80}, scale:1 };
let saveTimer = null;

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function resizeImageFile(file, maxW, maxH, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const ratio = Math.min(1, maxW/w, maxH/h);
        w = Math.max(1, Math.round(w*ratio)); h = Math.max(1, Math.round(h*ratio));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      data = Object.assign({ projects:[], characters:[], relationships:[], events:[], locations:[], factions:[], scenes:[], sceneLinks:[], creatures:[], myths:[], magicSystems:[], deities:[], maps:[] }, parsed);
    }
  }catch(e){ /* no data yet, or storage unavailable */ }
  if(data.projects.length && !state.activeProjectId){ state.activeProjectId = data.projects[0].id; }
  render();
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ showToast('Не удалось сохранить — возможно, закончилось место в хранилище браузера.'); }
  }, 350);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- HELPERS ---------------- */
const TYPE_PALETTE = ['var(--roman-color)','var(--manga-color)','var(--other-color)','var(--thread)','var(--rose)'];
function typeColor(type){
  const t = (type||'').trim().toLowerCase();
  if(!t) return 'var(--gray)';
  let hash = 0; for(let i=0;i<t.length;i++){ hash = (hash*31 + t.charCodeAt(i)) >>> 0; }
  return TYPE_PALETTE[hash % TYPE_PALETTE.length];
}
function projectColor(p){ return (p && p.color) ? p.color : typeColor(p ? p.type : ''); }
function projectDotHtml(p){
  const color = projectColor(p);
  const letter = esc((p.name||'?').trim().charAt(0).toUpperCase() || '?');
  if(p.photo) return `<div class="p-dot" style="background:${color}; padding:0; overflow:hidden;"><img src="${p.photo}" alt="" style="width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;"></div>`;
  return `<div class="p-dot" style="background:${color}">${letter}</div>`;
}
const REL_TYPES = {
  ally:{label:'Союзники', color:'#5fa8a0'},
  enemy:{label:'Враги', color:'#c1443b'},
  family:{label:'Семья', color:'#c9a24c'},
  romance:{label:'Романтика', color:'#b5698f'},
  mentor:{label:'Наставник', color:'#8c7ec9'},
  friend:{label:'Друзья', color:'#7fb069'},
  acquaintance:{label:'Знакомые', color:'#6a8caf'},
  other:{label:'Другое', color:'#7a7f92'},
};

function proj(id){ return data.projects.find(p=>p.id===id); }
function activeProject(){ return proj(state.activeProjectId); }
function itemsOf(coll, projectId){ return data[coll].filter(x=>x.projectId===projectId); }
function charName(id){ const c = data.characters.find(c=>c.id===id); return c ? c.name : '???'; }
function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- RENDER ROOT ---------------- */
function render(){
  renderSidebarProjects();
  renderMain();
}

function renderSidebarProjects(){
  const list = document.getElementById('projectList');
  if(!data.projects.length){
    list.innerHTML = `<div style="font-size:12.5px; color:var(--text-faint); padding:6px 2px;">Пока нет проектов</div>`;
    return;
  }
  list.innerHTML = data.projects.map(p=>{
    const color = projectColor(p);
    return `<div class="project-item ${p.id===state.activeProjectId?'active':''}" data-id="${p.id}" style="--pcolor:${color}" title="${esc(p.name)}" onclick="selectProject('${p.id}')">
      ${projectDotHtml(p)}
      <div class="p-info">
        <div class="p-name">${esc(p.name)}</div>
        <div class="p-type">${esc(p.type || '—')}</div>
      </div>
    </div>`;
  }).join('');
  attachProjectDragEvents();
  renderActiveProjectChip();
}
function reorderProjects(dragId, targetId){
  const fromIdx = data.projects.findIndex(p=>p.id===dragId);
  const toIdx = data.projects.findIndex(p=>p.id===targetId);
  if(fromIdx===-1 || toIdx===-1 || fromIdx===toIdx) return;
  const [moved] = data.projects.splice(fromIdx,1);
  data.projects.splice(toIdx,0,moved);
  queueSave();
  renderSidebarProjects();
}
function attachProjectDragEvents(){
  const list = document.getElementById('projectList');
  if(!list) return;
  let dragId = null;
  list.querySelectorAll('.project-item').forEach(chip=>{
    chip.draggable = true;
    chip.addEventListener('dragstart', ()=>{
      dragId = chip.dataset.id;
      chip.classList.add('dragging-card');
    });
    chip.addEventListener('dragend', ()=>{
      chip.classList.remove('dragging-card');
      list.querySelectorAll('.project-item').forEach(c=>c.classList.remove('drag-over'));
    });
    chip.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(chip.dataset.id === dragId) return;
      chip.classList.add('drag-over');
    });
    chip.addEventListener('dragleave', ()=>{ chip.classList.remove('drag-over'); });
    chip.addEventListener('drop', (e)=>{
      e.preventDefault();
      chip.classList.remove('drag-over');
      const targetId = chip.dataset.id;
      if(!dragId || dragId===targetId) return;
      reorderProjects(dragId, targetId);
    });
  });
}
function renderActiveProjectChip(){
  const chipEl = document.getElementById('activeProjectChip');
  if(!chipEl) return;
  const p = proj(state.activeProjectId);
  if(!p){ chipEl.innerHTML = ''; return; }
  chipEl.innerHTML = `${projectDotHtml(p)}<span class="p-name">${esc(p.name)}</span>`;
}

function selectProject(id){ state.activeProjectId = id; state.activeTab='overview'; state.activeMapId = null; render(); }
function toggleSidebar(){
  const sidebar = document.getElementById('sidebar');
  const collapsed = sidebar.classList.toggle('collapsed');
  document.getElementById('sidebarToggle').textContent = collapsed ? '▾' : '▴';
}

function renderMain(){
  const main = document.getElementById('main');
  if(!data.projects.length){
    main.innerHTML = `<div class="empty-state">
      <div class="mark"><svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.2c0 0 3-1.4 6.3-1.4 2 0 3.2.9 3.2.9v14.6c0 0-1.2-.8-3.2-.8-3.3 0-6.3 1.3-6.3 1.3V5.2Z"/><path d="M21.5 5.2c0 0-3-1.4-6.3-1.4-2 0-3.2.9-3.2.9v14.6c0 0 1.2-.8 3.2-.8 3.3 0 6.3 1.3 6.3 1.3V5.2Z"/><path d="M12 4.7v14.6" stroke-width="1" opacity="0.5"/></svg></div>
      <h2>Пустая мастерская</h2>
      <p>Создайте первый проект — роман, мангу или что угодно ещё. Внутри будут свои персонажи, связи, таймлайн и лор, отдельно от всех остальных проектов.</p>
      <button class="btn btn-primary" onclick="openNewProjectModal()">Создать первый проект</button>
    </div>`;
    return;
  }
  const p = activeProject();
  if(!p){ state.activeProjectId = data.projects[0].id; return renderMain(); }
  const color = projectColor(p);

  main.innerHTML = `
    <div id="projectHeader" style="--pcolor:${color}">
      <div class="ph-top">
        <div style="display:flex; gap:14px; align-items:flex-start;">
          <div class="ph-avatar" style="background:${color};">${p.photo ? `<img src="${p.photo}" alt="">` : esc((p.name||'?').trim().charAt(0).toUpperCase() || '?')}</div>
          <div>
            <h2>${esc(p.name)}</h2>
            ${p.type ? `<span class="ph-type">${esc(p.type)}</span>` : ''}
            ${p.desc ? `<div class="ph-desc">${esc(p.desc)}</div>` : ''}
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-sm" onclick="openEditProjectModal('${p.id}')">Изменить</button>
        </div>
      </div>
      <div id="tabs">
        ${tabBtn('overview','Обзор')}
        ${tabBtn('characters','Персонажи')}
        ${tabBtn('structure','Структура')}
        ${tabBtn('relationships','Связи')}
        ${tabBtn('timeline','Таймлайн')}
        ${tabBtn('world','Мир и лор')}
      </div>
    </div>
    <div id="tabContent"></div>
  `;
  renderTabContent();
}

function tabBtn(key,label){
  return `<button class="tab-btn ${state.activeTab===key?'active':''}" onclick="switchTab('${key}')">${label}</button>`;
}
function switchTab(key){ state.activeTab = key; if(key!=='world') state.activeMapId = null; renderMain(); }

function renderTabContent(){
  const el = document.getElementById('tabContent');
  const pid = state.activeProjectId;
  if(state.activeTab==='overview') return el.innerHTML = renderOverview(pid);
  if(state.activeTab==='characters') return renderCharacters(el, pid);
  if(state.activeTab==='structure') return renderStructure(el, pid);
  if(state.activeTab==='relationships') return renderRelationships(el, pid);
  if(state.activeTab==='timeline') return renderTimeline(el, pid);
  if(state.activeTab==='world') return renderWorld(el, pid);
}

/* ---------------- OVERVIEW ---------------- */
function renderOverview(pid){
  const chars = itemsOf('characters', pid);
  const events = itemsOf('events', pid);
  const rels = itemsOf('relationships', pid);
  const locs = itemsOf('locations', pid);
  const facs = itemsOf('factions', pid);
  const stats = [
    ['Персонажей', chars.length], ['Связей', rels.length], ['Событий', events.length],
    ['Локаций', locs.length], ['Фракций', facs.length]
  ];
  return `
    <div class="stat-row">${stats.map(([l,n])=>`<div class="stat-card"><div class="num">${n}</div><div class="label">${l}</div></div>`).join('')}</div>
    ${chars.length===0 && events.length===0 ? `<div class="empty-tab">Проект пуст. Начните с вкладки «Персонажи» или «Таймлайн» — заполните архив по кусочку, каша сама уляжется в систему.</div>` : `
    ${chars.filter(c=>c.pinned).length ? `
    <div class="side-section-label" style="margin-bottom:10px;">📌 Закреплённые</div>
    <div class="grid" style="margin-bottom:30px;">${chars.filter(c=>c.pinned).map(characterCard).join('')}</div>
    ` : ''}
    <div class="side-section-label" style="margin-bottom:10px;">Недавние персонажи</div>
    <div class="grid" style="margin-bottom:30px;">${chars.slice(-4).reverse().map(characterCard).join('') || '<div class="empty-tab">Пока нет персонажей</div>'}</div>
    <div class="side-section-label" style="margin-bottom:10px;">Последние события</div>
    <div id="timelineList" style="max-width:640px;">${events.slice(-3).reverse().map(eventCard).join('') || '<div class="empty-tab">Пока нет событий</div>'}</div>
    `}
  `;
}

/* ---------------- CHARACTERS ---------------- */
function characterCard(c){
  const statusClass = c.status==='alive' ? 'status-alive' : c.status==='dead' ? 'status-dead' : '';
  const avatar = c.photo
    ? `<img class="d-avatar" src="${c.photo}" alt="">`
    : `<div class="d-avatar d-avatar-placeholder">${esc(initials(c.name))}</div>`;
  const pinBtn = `<button class="pin-btn ${c.pinned?'pinned':''}" onclick="event.stopPropagation(); togglePinCharacter('${c.id}')" title="${c.pinned?'Открепить':'Закрепить'}">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M14.7 2.3c-.4-.4-1-.4-1.4 0L11 4.6c-1.7-.5-3.7 0-5 1.3L4.6 7.3c-.4.4-.4 1 0 1.4l3.6 3.6-4.9 4.9a1 1 0 0 0 1.4 1.4l4.9-4.9 3.6 3.6c.4.4 1 .4 1.4 0l1.4-1.4c1.3-1.3 1.8-3.3 1.3-5l2.3-2.3c.4-.4.4-1 0-1.4l-5-5Z"/></svg>
  </button>`;
  return `<div class="dossier ${c.pinned?'is-pinned':''}" id="char-${c.id}" data-id="${c.id}">
    <div class="d-top">
      <div style="display:flex; gap:10px; align-items:flex-start; min-width:0;">
        ${avatar}
        <div style="min-width:0;">
          <h3>${esc(c.name)}</h3>
          ${c.aliases ? `<div class="d-alias">${esc(c.aliases)}</div>` : ''}
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
        ${pinBtn}
        ${c.status ? `<span class="d-status ${statusClass}">${esc(c.status)}</span>` : ''}
      </div>
    </div>
    ${c.role ? `<div class="d-role">${esc(c.role)}</div>` : ''}
    ${c.desc ? `<div class="d-desc">${esc(c.desc)}</div>` : ''}
    ${c.tags && c.tags.length ? `<div class="d-tags">${c.tags.map(t=>`<span class="d-tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="d-actions">
      <button class="btn btn-ghost btn-sm" onclick="openEditCharacterModal('${c.id}')">Изменить</button>
      <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteCharacter('${c.id}')">Удалить</button>
    </div>
  </div>`;
}
function togglePinCharacter(id){
  const c = data.characters.find(x=>x.id===id);
  if(!c) return;
  c.pinned = !c.pinned;
  queueSave();
  renderMain();
}
function sortCharacters(list){
  return [...list].sort((a,b)=>{
    const pinDiff = (b.pinned?1:0)-(a.pinned?1:0);
    if(pinDiff) return pinDiff;
    return (a.order??0) - (b.order??0);
  });
}
function reorderCharacters(dragId, targetId){
  const pid = state.activeProjectId;
  const list = sortCharacters(itemsOf('characters', pid));
  const fromIdx = list.findIndex(c=>c.id===dragId);
  const toIdx = list.findIndex(c=>c.id===targetId);
  if(fromIdx===-1 || toIdx===-1 || fromIdx===toIdx) return;
  const [moved] = list.splice(fromIdx,1);
  list.splice(toIdx,0,moved);
  list.forEach((c,i)=>{ c.order = i; });
  queueSave();
  renderCharacters(document.getElementById('tabContent'), pid);
}
function attachCharacterDragEvents(){
  const grid = document.getElementById('charGrid');
  if(!grid) return;
  let dragId = null;
  grid.querySelectorAll('.dossier').forEach(card=>{
    card.draggable = true;
    card.addEventListener('dragstart', ()=>{
      dragId = card.dataset.id;
      card.classList.add('dragging-card');
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging-card');
      grid.querySelectorAll('.dossier').forEach(c=>c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(card.dataset.id === dragId) return;
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', ()=>{ card.classList.remove('drag-over'); });
    card.addEventListener('drop', (e)=>{
      e.preventDefault();

/* ---------------- RELATIONSHIPS (network canvas) ---------------- */
let relCanvasView = { pan:{x:220,y:90}, scale:1 };
let relSelected = null;

function relTypes(r){ return (r.types && r.types.length) ? r.types : (r.type ? [r.type] : ['other']); }
function relEvolves(r){ return (r.evolvesTo && r.evolvesTo.length) ? r.evolvesTo : []; }
function relTypeLabel(k){ return (REL_TYPES[k]||REL_TYPES.other).label; }
function relTypeColor(k){ return (REL_TYPES[k]||REL_TYPES.other).color; }

function ensureNetPositions(chars){
  let changed = false;
  const cx=280, cy=230, R=170;
  chars.forEach((c,i)=>{
    if(c.netX===undefined || c.netY===undefined){
      const angle = (i/chars.length)*Math.PI*2 - Math.PI/2;
      c.netX = Math.round(cx + R*Math.cos(angle) - 42);
      c.netY = Math.round(cy + R*Math.sin(angle) - 26);
      changed = true;
    }
  });
  if(changed) queueSave();
}

function renderRelationships(el, pid){
  const chars = itemsOf('characters', pid);
  const rels = itemsOf('relationships', pid);
  if(chars.length < 2){
    el.innerHTML = `<div class="empty-tab">Нужно хотя бы два персонажа, чтобы строить связи. Добавьте их во вкладке «Персонажи».</div>`;

    <div class="canvas-toolbar">

      <div style="display:flex; gap:8px; align-items:center;">
        <div class="canvas-zoom-controls">
          <button class="btn btn-sm" onclick="zoomRelCanvas(-0.15)">−</button>
          <span class="mono" id="relZoomLabel" style="font-size:12px; color:var(--text-faint); min-width:42px; text-align:center; display:inline-block;">100%</span>
          <button class="btn btn-sm" onclick="zoomRelCanvas(0.15)">+</button>
        </div>
        <button class="btn btn-sm" onclick="resetRelCanvasView()">Сброс вида</button>
        <button class="btn btn-primary btn-sm" onclick="openNewRelationshipModal()">+ Связь</button>
      </div>
    </div>
    <div id="relCanvasViewport">
      <div id="relCanvasInner">
        <svg id="relEdgesSvg" width="4000" height="3000"></svg>
        ${chars.map(relNodeHtml).join('')}
      </div>
    </div>
    <div id="legend" style="margin-top:14px;">
      ${Object.entries(REL_TYPES).map(([k,v])=>`<div class="legend-item"><span class="legend-swatch" style="background:${v.color}"></span>${v.label}</div>`).join('')}
    </div>
    <div class="side-section-label" style="margin:26px 0 10px;">Список связей</div>
    <div class="grid">${rels.length ? rels.map(relCard).join('') : '<div class="empty-tab">Связей пока нет.</div>'}</div>
  `;
  applyRelCanvasTransform();
  drawRelEdges();
  attachRelCanvasEvents();
}

function relNodeHtml(c){
  const avatarInner = c.photo ? `<img src="${c.photo}" alt="">` : `<span>${esc(initials(c.name))}</span>`;
  return `<div class="rel-node" data-id="${c.id}" style="left:${c.netX}px; top:${c.netY}px;">
    <div class="rel-avatar">${avatarInner}</div>
    <div class="rel-name">${esc(c.name)}</div>
    <div class="rel-port" data-id="${c.id}" title="Тяните, чтобы создать связь"></div>
  </div>`;
}

function applyRelCanvasTransform(){
  const inner = document.getElementById('relCanvasInner');
  if(!inner) return;
  inner.style.transform = `translate(${relCanvasView.pan.x}px, ${relCanvasView.pan.y}px) scale(${relCanvasView.scale})`;
  const lbl = document.getElementById('relZoomLabel');
  if(lbl) lbl.textContent = Math.round(relCanvasView.scale*100)+'%';
}
function zoomRelCanvas(delta){ relCanvasView.scale = Math.min(2, Math.max(0.35, relCanvasView.scale+delta)); applyRelCanvasTransform(); drawRelEdges(); }
function resetRelCanvasView(){ relCanvasView.pan = {x:220,y:90}; relCanvasView.scale = 1; applyRelCanvasTransform(); drawRelEdges(); }

function drawRelEdges(){
  const svg = document.getElementById('relEdgesSvg');
  if(!svg) return;
  const chars = itemsOf('characters', state.activeProjectId);
  const rels = itemsOf('relationships', state.activeProjectId);
  const byId = {}; chars.forEach(c=>byId[c.id]=c);
  const NCX=42, NCY=26;
  let defs = '<defs>';
  let paths = '';
  rels.forEach(r=>{
    const a = byId[r.charA], b = byId[r.charB];
    if(!a||!b) return;
    const types = relTypes(r), evolves = relEvolves(r);
    const startColor = relTypeColor(types[0]);
    const endColor = evolves.length ? relTypeColor(evolves[0]) : relTypeColor(types[types.length-1]);
    const x1=a.netX+NCX, y1=a.netY+NCY, x2=b.netX+NCX, y2=b.netY+NCY;
    const gradId = 'grad-'+r.id, arrowId = 'arrow-'+r.id;
    defs += `<linearGradient id="${gradId}" gradientUnits="userSpaceOnUse" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">
      <stop offset="0" stop-color="${startColor}"/><stop offset="1" stop-color="${endColor}"/>
    </linearGradient>
    <marker id="${arrowId}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${endColor}"/></marker>`;
    const mx=(x1+x2)/2, my=(y1+y2)/2 - 26;
    paths += `<path class="rel-edge" data-id="${r.id}" data-a="${r.charA}" data-b="${r.charB}" onclick="event.stopPropagation(); openEditRelationshipModal('${r.id}')" d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" stroke="url(#${gradId})" marker-end="url(#${arrowId})" fill="none"/>`;
  });
  defs += '</defs>';
  svg.innerHTML = defs + paths;
}

function attachRelCanvasEvents(){
  const viewport = document.getElementById('relCanvasViewport');
  if(!viewport) return;
  viewport.addEventListener('mousedown', onRelCanvasMouseDown);
  viewport.addEventListener('wheel', onRelCanvasWheel, {passive:false});
}

function onRelCanvasWheel(e){
  e.preventDefault();
  const viewport = document.getElementById('relCanvasViewport');
  const rect = viewport.getBoundingClientRect();
  const cursorX = e.clientX-rect.left, cursorY = e.clientY-rect.top;
  const oldScale = relCanvasView.scale;
  const newScale = Math.min(2, Math.max(0.35, oldScale + (e.deltaY<0?0.1:-0.1)));
  const localX=(cursorX-relCanvasView.pan.x)/oldScale, localY=(cursorY-relCanvasView.pan.y)/oldScale;
  relCanvasView.pan.x = cursorX-localX*newScale;
  relCanvasView.pan.y = cursorY-localY*newScale;
  relCanvasView.scale = newScale;
  applyRelCanvasTransform(); drawRelEdges();
}

function onRelCanvasMouseDown(e){
  const viewport = document.getElementById('relCanvasViewport');
  const rect = viewport.getBoundingClientRect();
  const portEl = e.target.closest('.rel-port');
  const nodeEl = e.target.closest('.rel-node');

  if(portEl){
    const sourceId = portEl.dataset.id;
    const svg = document.getElementById('relEdgesSvg');
    const tempPath = document.createElementNS('http://www.w3.org/2000/svg','path');
    tempPath.setAttribute('class','temp-edge');
    svg.appendChild(tempPath);
    const move=(ev)=>{
      const s = itemsOf('characters', state.activeProjectId).find(x=>x.id===sourceId);
      if(!s) return;
      const x1=s.netX+42, y1=s.netY+26;
      const lx=(ev.clientX-rect.left-relCanvasView.pan.x)/relCanvasView.scale, ly=(ev.clientY-rect.top-relCanvasView.pan.y)/relCanvasView.scale;
      tempPath.setAttribute('d', `M${x1},${y1} L${lx},${ly}`);
    };
    const up=(ev)=>{
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      tempPath.remove();
      const targetNode = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.rel-node');
      if(targetNode && targetNode.dataset.id !== sourceId) openNewRelationshipModal(sourceId, targetNode.dataset.id);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    e.stopPropagation(); e.preventDefault();
    return;
  }

  if(nodeEl){
    const id = nodeEl.dataset.id;
    const c = itemsOf('characters', state.activeProjectId).find(x=>x.id===id);
    if(!c) return;
    const startX=e.clientX, startY=e.clientY, ox=c.netX, oy=c.netY;
    let moved = false;
    nodeEl.classList.add('dragging');
    const move=(ev)=>{
      if(Math.abs(ev.clientX-startX)>3 || Math.abs(ev.clientY-startY)>3) moved = true;
      c.netX = ox + (ev.clientX-startX)/relCanvasView.scale;
      c.netY = oy + (ev.clientY-startY)/relCanvasView.scale;
      nodeEl.style.left = c.netX+'px'; nodeEl.style.top = c.netY+'px';
      drawRelEdges();
    };
    const up=()=>{
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      nodeEl.classList.remove('dragging');
      if(moved) queueSave(); else relToggleSelect(id);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    e.preventDefault();
    return;
  }

  const startX=e.clientX, startY=e.clientY, ox=relCanvasView.pan.x, oy=relCanvasView.pan.y;
  viewport.classList.add('panning');
  const move=(ev)=>{
    relCanvasView.pan.x = ox+(ev.clientX-startX);
    relCanvasView.pan.y = oy+(ev.clientY-startY);
    applyRelCanvasTransform();
  };
  const up=()=>{
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    viewport.classList.remove('panning');
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

function relToggleSelect(id){
  relSelected = relSelected===id ? null : id;
  document.querySelectorAll('.rel-node').forEach(n=>{ n.classList.toggle('dim', relSelected && n.dataset.id !== relSelected); });
  document.querySelectorAll('.rel-edge').forEach(ed=>{
    const connected = !relSelected || ed.dataset.a===relSelected || ed.dataset.b===relSelected;
    ed.classList.toggle('dim', !connected);
  });
}

function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function relCard(r){
  const types = relTypes(r), evolves = relEvolves(r);
  const typesHtml = types.map(t=>`<span class="d-tag" style="border-color:${relTypeColor(t)}; color:${relTypeColor(t)};">${esc(relTypeLabel(t))}</span>`).join('');

  return `<div class="dossier">
    <div class="d-top"><h3 style="font-size:14.5px;">${esc(charName(r.charA))} ↔ ${esc(charName(r.charB))}</h3></div>
    <div class="d-tags" style="margin-top:8px; align-items:center;">${typesHtml}${evolvesHtml}</div>
    ${r.evolveNote ? `<div class="d-alias" style="margin-top:6px;">${esc(r.evolveNote)}</div>` : ''}
    ${r.desc ? `<div class="d-desc">${esc(r.desc)}</div>` : ''}
    <div class="d-actions">
      <button class="btn btn-ghost btn-sm" onclick="openEditRelationshipModal('${r.id}')">Изменить</button>
      <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteRelationship('${r.id}')">Удалить</button>

}

function getScenePortCenter(nodeId, portClass){
  const el = document.querySelector(`.scene-node[data-id="${nodeId}"] .${portClass}`);
  const viewport = document.getElementById('storyCanvasViewport');
  if(!el || !viewport) return null;
  const portRect = el.getBoundingClientRect();
  const vpRect = viewport.getBoundingClientRect();
  const screenX = portRect.left + portRect.width/2 - vpRect.left;
  const screenY = portRect.top + portRect.height/2 - vpRect.top;
  return {
    x: (screenX - canvasView.pan.x) / canvasView.scale,
    y: (screenY - canvasView.pan.y) / canvasView.scale,
  };
}

function drawEdges(){
  const svg = document.getElementById('edgesSvg');
  if(!svg) return;
  const links = itemsOf('sceneLinks', state.activeProjectId);
  let out = `<defs><marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--gold)"/></marker></defs>`;
  out += links.map(l=>{
    const p1 = getScenePortCenter(l.from, 'port-out');
    const p2 = getScenePortCenter(l.to, 'port-in');
    if(!p1||!p2) return '';
    const mx = (p1.x+p2.x)/2;
    return `<path class="scene-edge" onclick="deleteSceneLink('${l.id}')" d="M${p1.x},${p1.y} C${mx},${p1.y} ${mx},${p2.y} ${p2.x},${p2.y}" marker-end="url(#arrowHead)"/>`;
  }).join('');
  svg.innerHTML = out;
}

function attachCanvasEvents(){
  const viewport = document.getElementById('storyCanvasViewport');
  if(!viewport) return;
  viewport.addEventListener('mousedown', onCanvasMouseDown);
  viewport.addEventListener('wheel', onCanvasWheel, {passive:false});
}

function onCanvasWheel(e){
  e.preventDefault();
  const viewport = document.getElementById('storyCanvasViewport');
  const rect = viewport.getBoundingClientRect();
  const cursorX = e.clientX-rect.left, cursorY = e.clientY-rect.top;
  const oldScale = canvasView.scale;
  const newScale = Math.min(2, Math.max(0.35, oldScale + (e.deltaY < 0 ? 0.1 : -0.1)));
  const localX = (cursorX - canvasView.pan.x)/oldScale;
  const localY = (cursorY - canvasView.pan.y)/oldScale;
  canvasView.pan.x = cursorX - localX*newScale;
  canvasView.pan.y = cursorY - localY*newScale;
  canvasView.scale = newScale;
  applyCanvasTransform(); drawEdges();
}

function onCanvasMouseDown(e){
  const viewport = document.getElementById('storyCanvasViewport');
  const rect = viewport.getBoundingClientRect();
  const portEl = e.target.closest('.port');
  const nodeEl = e.target.closest('.scene-node');

  if(portEl && portEl.dataset.port==='out'){
    const sourceId = portEl.dataset.id;
    const svg = document.getElementById('edgesSvg');
    const tempPath = document.createElementNS('http://www.w3.org/2000/svg','path');
    tempPath.setAttribute('class','temp-edge');
    svg.appendChild(tempPath);
    const startPort = getScenePortCenter(sourceId, 'port-out');
    const move = (ev)=>{
      if(!startPort) return;
      const lx=(ev.clientX-rect.left-canvasView.pan.x)/canvasView.scale, ly=(ev.clientY-rect.top-canvasView.pan.y)/canvasView.scale;
      tempPath.setAttribute('d', `M${startPort.x},${startPort.y} L${lx},${ly}`);
    };
    const up = (ev)=>{
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      tempPath.remove();
      const targetNode = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.scene-node');
      if(targetNode && targetNode.dataset.id !== sourceId) createSceneLink(sourceId, targetNode.dataset.id);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    e.stopPropagation(); e.preventDefault();
    return;
  }

  if(nodeEl && !portEl){
    const id = nodeEl.dataset.id;
    const scene = itemsOf('scenes', state.activeProjectId).find(x=>x.id===id);
    if(!scene) return;
    const startX=e.clientX, startY=e.clientY, ox=scene.x, oy=scene.y;
    let moved = false;
    nodeEl.classList.add('dragging');
    const move=(ev)=>{
      moved = true;
      scene.x = ox + (ev.clientX-startX)/canvasView.scale;
      scene.y = oy + (ev.clientY-startY)/canvasView.scale;
      nodeEl.style.left = scene.x+'px'; nodeEl.style.top = scene.y+'px';
      drawEdges();
    };
    const up=()=>{
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      nodeEl.classList.remove('dragging');
      if(moved) queueSave();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    e.preventDefault();
    return;
  }

  if(e.target.id==='storyCanvasViewport' || e.target.id==='storyCanvasInner' || e.target.id==='edgesSvg'){
    const startX=e.clientX, startY=e.clientY, ox=canvasView.pan.x, oy=canvasView.pan.y;
    viewport.classList.add('panning');
    const move=(ev)=>{
      canvasView.pan.x = ox+(ev.clientX-startX);
      canvasView.pan.y = oy+(ev.clientY-startY);
      applyCanvasTransform();
    };
    const up=()=>{
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      viewport.classList.remove('panning');
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }
}

function createSceneLink(from, to){
  if(from===to) return;
  const exists = data.sceneLinks.find(l=>l.from===from && l.to===to && l.projectId===state.activeProjectId);
  if(exists) return;
  data.sceneLinks.push({id:uid(), projectId: state.activeProjectId, from, to});
  queueSave(); drawEdges();
}

  const localY = (rect.height/2 - canvasView.pan.y)/canvasView.scale - 40;

function getImageDimensions(dataUrl){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=> resolve({ w: img.naturalWidth || img.width, h: img.naturalHeight || img.height });
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function openMapFormModal(existingMap){
  const isEdit = !!existingMap;
  let pendingImage = isEdit ? { dataUrl: existingMap.image, w: null, h: null } : null;
  const box = document.getElementById('modalBox');
  box.innerHTML = `<h2>${isEdit ? 'Изменить карту' : 'Новая карта'}</h2>
    <div class="field"><label>Название карты</label><input type="text" id="mapNameInput" value="${isEdit ? esc(existingMap.name) : ''}" placeholder="Карта мира, Континент…"></div>
    <div class="field"><label>Изображение карты</label>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <input type="file" id="mapImageInput" accept="image/*" style="display:none;">
        <button class="btn btn-ghost btn-sm" id="mapImagePickBtn" style="align-self:flex-start;">${isEdit ? 'Заменить изображение' : 'Выбрать изображение'}</button>
        <div id="mapImagePreviewWrap" style="display:${isEdit ? 'block' : 'none'};"><img id="mapImagePreview" src="${isEdit ? existingMap.image : ''}" style="max-width:100%; max-height:220px; border-radius:4px; border:1px solid var(--border); display:block;"></div>
      </div>
    </div>
    <div id="modalActions">
      <div id="modalLeftActions">${isEdit ? `<button class="btn btn-danger btn-sm" id="mapDangerBtn">Удалить карту</button>` : ''}</div>
      <div id="modalRightActions" style="display:flex; gap:10px;">
        <button class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" id="mapSaveBtn">${isEdit ? 'Сохранить' : 'Создать'}</button>
      </div>
    </div>`;
  document.getElementById('mapImagePickBtn').onclick = ()=> document.getElementById('mapImageInput').click();
  document.getElementById('mapImageInput').onchange = ()=>{
    const file = document.getElementById('mapImageInput').files[0];
    if(!file) return;
    resizeImageFile(file, 1600, 1600, 0.85).then(dataUrl=>{
      return getImageDimensions(dataUrl).then(dim=>{
        pendingImage = { dataUrl, w: dim.w, h: dim.h };
        document.getElementById('mapImagePreviewWrap').style.display = 'block';
        document.getElementById('mapImagePreview').src = dataUrl;
      });
    }).catch(()=>showToast('Не удалось загрузить изображение'));
  };
  document.getElementById('mapSaveBtn').onclick = ()=>{
    const name = document.getElementById('mapNameInput').value.trim();
    if(!name){ showToast('Введите название карты'); return; }
    if(!pendingImage){ showToast('Загрузите изображение карты'); return; }
    if(isEdit){
      existingMap.name = name;
      if(pendingImage.dataUrl !== existingMap.image){
        existingMap.image = pendingImage.dataUrl;
        if(pendingImage.w && pendingImage.h) existingMap.aspect = pendingImage.w / pendingImage.h;
      }
      queueSave(); closeModal(); renderMain();
    } else {
      const m = { id: uid(), projectId: state.activeProjectId, name, image: pendingImage.dataUrl, aspect: (pendingImage.w && pendingImage.h) ? pendingImage.w/pendingImage.h : 1.6, markers: [], paths: [] };
      data.maps.push(m);
      queueSave(); closeModal();
      openMapEditor(m.id);
    }
  };
  if(isEdit){ document.getElementById('mapDangerBtn').onclick = ()=>{ closeModal(); deleteMap(existingMap.id); }; }
  document.getElementById('modalOverlay').classList.add('show');
}

function markerIconKey(mk){
  const raw = mk && mk.icon;
  if(raw && MARKER_SVG[raw]) return raw;
  if(raw && LEGACY_MARKER_ICONS[raw]) return LEGACY_MARKER_ICONS[raw];
  if(mk && mk.type==='city') return 'city';
  if(mk && mk.type==='poi') return 'landmark';
  return 'other';
}

function markerIcon(mk, size='map'){
  const key = markerIconKey(mk);
  const svg = MARKER_SVG[key] || MARKER_SVG.other;
  const color = MARKER_COLORS[key] || MARKER_COLORS.other;
  const cls = size==='card' ? 'marker-card-icon' : 'map-marker-icon';
  return `<span class="${cls}" style="--marker-color:${color}" aria-hidden="true">${svg}</span>`;
}

function onMapClick(e){
  if(e.target.closest('.map-marker')) return;
  const viewport = document.getElementById('mapViewport');
  const rect = viewport.getBoundingClientRect();
  const xPct = ((e.clientX-rect.left)/rect.width)*100;
  const yPct = ((e.clientY-rect.top)/rect.height)*100;
  if(xPct<0 || xPct>100 || yPct<0 || yPct>100) return;
  const m = data.maps.find(x=>x.id===state.activeMapId);
  if(!m) return;
  if(state.mapMode==='marker'){
    openNewMarkerModal(m, xPct, yPct);
  } else if(state.mapMode==='path'){
    if(!state.mapDrawingPath){ showToast('Сначала нажмите «Начать новый путь»'); return; }
    state.mapDrawingPath.points.push({x:xPct, y:yPct});
    refreshMapEditor();
  }
}

function drawMapPaths(m){
  const svg = document.getElementById('mapPathsSvg');
  if(!svg) return;
  let out = '';
  (m.paths||[]).forEach(p=>{
    const pts = (p.points||[]).map(pt=>`${pt.x},${pt.y}`).join(' ');
    out += `<polyline points="${pts}" fill="none" stroke="${p.color||'var(--gold)'}" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>`;
    (p.points||[]).forEach((pt,i)=>{
      out += `<circle cx="${pt.x}" cy="${pt.y}" r="${i===0||i===p.points.length-1?1.1:0.7}" fill="${p.color||'var(--gold)'}"/>`;
    });
  });
  if(state.mapDrawingPath){
    const pts = state.mapDrawingPath.points;
    const ptsStr = pts.map(pt=>`${pt.x},${pt.y}`).join(' ');
    out += `<polyline points="${ptsStr}" fill="none" stroke="var(--thread)" stroke-width="0.6" stroke-dasharray="1.5 1" stroke-linecap="round"/>`;
    pts.forEach(pt=>{ out += `<circle cx="${pt.x}" cy="${pt.y}" r="0.9" fill="var(--thread)"/>`; });
  }
  svg.innerHTML = out;
}

function attachMapMarkerDrag(m){
  const viewport = document.getElementById('mapViewport');
  if(!viewport) return;
  viewport.querySelectorAll('.map-marker').forEach(nodeEl=>{
    nodeEl.addEventListener('mousedown', (e)=>{
      e.stopPropagation();
      const id = nodeEl.dataset.id;
      const marker = (m.markers||[]).find(x=>x.id===id);
      if(!marker) return;
      const rect = viewport.getBoundingClientRect();
      const startX=e.clientX, startY=e.clientY, ox=marker.x, oy=marker.y;
      let moved = false;
      const move=(ev)=>{
        if(Math.abs(ev.clientX-startX)>3 || Math.abs(ev.clientY-startY)>3) moved = true;
        let nx = ox + ((ev.clientX-startX)/rect.width)*100;
        let ny = oy + ((ev.clientY-startY)/rect.height)*100;
        nx = Math.min(100, Math.max(0, nx));
        ny = Math.min(100, Math.max(0, ny));
        marker.x = nx; marker.y = ny;
        nodeEl.style.left = nx+'%'; nodeEl.style.top = ny+'%';
        drawMapPaths(m);
      };
      const up=()=>{
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        if(moved) queueSave();
        else onMarkerClick(id);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      e.preventDefault();
    });
  });
}
